<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Planeswalker's Table</title>
<meta name="description" content="Play Magic: The Gathering against a computer opponent in Standard or 1v1 Commander with any preconstructed deck.">
<meta name="theme-color" content="#0f1d1c">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700;800&family=IBM+Plex+Mono:wght@500;600;700&family=Marcellus+SC&display=swap">
<style>:root{color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}*,*::before,*::after{box-sizing:border-box}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<style>/* Layout: one-screen game table — opponent on top, you at the bottom, a hand rail and a prompt bar; setup is a single scrolling column. */
:root {
  --mat: #0f1d1c;
  --mat-2: #162a29;
  --mat-3: #1e3634;
  --line: #2c4744;
  --ink: #ece6d6;
  --muted: #94a7a2;
  --brass: #d1a952;
  --brass-ink: #1b1608;
  --you: #7cbbe0;
  --foe: #e08a6c;
  --good: #8fcf8a;
  --bad: #ef7a6a;
  --f-display: "Marcellus SC", "Palatino Linotype", Palatino, Georgia, serif;
  --f-body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --tile-w: 64px;
  --tile-h: 88px;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--mat); color: var(--ink); font-family: var(--f-body); font-size: 15px; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--mat); }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
#app { height: 100%; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

/* ---------- buttons */
.btn { padding: 9px 14px; border-radius: 8px; background: var(--mat-3); border: 1px solid var(--line); color: var(--ink); font-weight: 600; letter-spacing: .01em; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--brass); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--brass); color: var(--brass-ink); border-color: var(--brass); }
.btn.ghost { background: transparent; }
.btn.big { padding: 12px 22px; font-size: 16px; }
.btn.sm { padding: 5px 10px; font-size: 13px; }
.link { color: var(--brass); text-decoration: underline; text-underline-offset: 3px; font-size: 13px; padding: 0; }

/* ---------- loading */
.loading { height: 100%; display: grid; place-content: center; text-align: center; gap: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.ld-title { font-family: var(--f-display); font-size: 30px; color: var(--brass); }
.ld-sub { color: var(--muted); }
.ld-bar { width: 220px; height: 3px; background: var(--mat-3); margin: 8px auto 0; overflow: hidden; border-radius: 2px; }
.ld-bar i { display: block; height: 100%; width: 40%; background: var(--brass); animation: ld 1.1s ease-in-out infinite; }
@keyframes ld { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }

/* ---------- setup */
.setup { max-width: 980px; margin: 0 auto; padding-block: 20px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 18px; }
.setup-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px; }
.brand { display: flex; gap: 12px; align-items: center; }
.brand-mark { font-size: 34px; color: var(--brass); line-height: 1; }
.brand h1 { font-family: var(--f-display); font-weight: 400; font-size: 28px; margin: 0; letter-spacing: .02em; text-wrap: balance; }
.brand p { margin: 2px 0 0; color: var(--muted); }
.modes { display: flex; gap: 6px; background: var(--mat-2); padding: 4px; border-radius: 12px; border: 1px solid var(--line); }
.mode { padding: 8px 16px; border-radius: 9px; text-align: left; display: grid; }
.mode b { font-family: var(--f-display); font-weight: 400; font-size: 18px; }
.mode small { color: var(--muted); font-size: 12px; }
.mode.on { background: var(--mat-3); box-shadow: inset 0 0 0 1px var(--brass); }
.mode.on b { color: var(--brass); }
.matchup { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: stretch; }
.slot { background: var(--mat-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; cursor: pointer; min-width: 0; }
.slot.active { border-color: var(--brass); }
.slot-lbl { text-transform: uppercase; letter-spacing: .12em; font-size: 11px; color: var(--muted); margin-bottom: 6px; }
.slot-empty { color: var(--muted); font-style: italic; }
.ds-name { font-family: var(--f-display); font-size: 19px; }
.ds-meta { color: var(--muted); font-size: 13px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.ds-cmd { font-size: 14px; margin-top: 2px; }
.vs { align-self: center; font-family: var(--f-display); color: var(--brass); font-size: 20px; }
.start-row { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 12px; justify-content: flex-end; align-items: center; }
.lifesel { color: var(--muted); font-size: 14px; display: flex; gap: 6px; align-items: center; }
select, input[type=search] { background: var(--mat-2); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: inherit; }
.browser { display: grid; gap: 10px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.filters input { flex: 1 1 240px; min-width: 0; }
.colorchips { display: flex; gap: 4px; }
.cchip { padding: 3px; border-radius: 50%; opacity: .45; }
.cchip.on { opacity: 1; box-shadow: 0 0 0 2px var(--brass); }
.cchip .pip { width: 22px; height: 22px; font-size: 12px; }
.count { color: var(--muted); font-size: 13px; }
.count b { color: var(--ink); }
.decklist { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 6px; }
.drow { display: flex; justify-content: space-between; gap: 10px; text-align: left; padding: 9px 12px; border-radius: 9px; background: var(--mat-2); border: 1px solid transparent; min-width: 0; }
.drow:hover { border-color: var(--line); }
.dr-main { display: grid; min-width: 0; }
.dr-name { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dr-sub { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dr-side { display: grid; justify-items: end; gap: 2px; flex: none; }
.dr-year { font-family: var(--f-num); font-size: 11px; color: var(--muted); }
.dpips { display: inline-flex; gap: 2px; }
.tag { font-size: 10px; text-transform: uppercase; letter-spacing: .1em; padding: 1px 6px; border-radius: 4px; margin-left: 4px; vertical-align: 2px; }
.tag.you { background: var(--you); color: #0b1a22; }
.tag.ai { background: var(--foe); color: #2a0f06; }
.none { color: var(--muted); padding: 20px 0; }

/* ---------- mana pips */
.pip { display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; font-family: var(--f-num); font-size: 9.5px; font-weight: 700; color: #1b1a17; background: #cfc8b8; box-shadow: inset 0 -1px 0 rgba(0,0,0,.25); vertical-align: -3px; flex: none; }
.p-W { background: #f3ecd2; } .p-U { background: #8fc1e6; } .p-B { background: #a49aa6; } .p-R { background: #ec9274; } .p-G { background: #8fc98a; } .p-C { background: #d3d6da; } .p-H { background: linear-gradient(135deg, #e2c46a, #b98fd0); }

/* ---------- card colors (card faces are light parchment tints) */
.c-W { --cf: #ece4c8; --ce: #b9a874; }
.c-U { --cf: #b8d3e8; --ce: #4f86b3; }
.c-B { --cf: #c2bac2; --ce: #5d5160; }
.c-R { --cf: #edc0ae; --ce: #b8553a; }
.c-G { --cf: #bfd8b5; --ce: #4d8a4a; }
.c-M { --cf: #e9d79c; --ce: #b38f2a; }
.c-A { --cf: #cfd3d7; --ce: #7a8590; }
.c-L { --cf: #d6c8ad; --ce: #8b7552; }

/* ---------- game table */
body.in-game { overflow: hidden; }
.table { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto minmax(0, 1fr) auto auto auto; position: relative; padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.pbar { display: flex; align-items: center; gap: 10px; padding: 6px 12px; background: var(--mat-2); border-block: 1px solid var(--line); min-width: 0; flex-wrap: wrap; }
.pbar.active.me { box-shadow: inset 3px 0 0 var(--you); }
.pbar.active.ai { box-shadow: inset 3px 0 0 var(--foe); }
.pl-life { display: flex; align-items: baseline; gap: 8px; padding: 2px 10px 2px 6px; border-radius: 8px; }
.pl-name { font-family: var(--f-display); font-size: 15px; }
.pbar.me .pl-name { color: var(--you); } .pbar.ai .pl-name { color: var(--foe); }
.life { font-family: var(--f-num); font-weight: 600; font-size: 22px; font-variant-numeric: tabular-nums; }
.pl-zones { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.zc { font-family: var(--f-num); font-size: 12.5px; color: var(--muted); background: var(--mat); border: 1px solid var(--line); border-radius: 6px; padding: 2px 7px; }
.zbtn:hover { color: var(--ink); }
.zc.poison { color: var(--good); } .zc.cmd { color: var(--bad); }
.zc.pool { display: inline-flex; gap: 2px; }
.cmdzone { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; }
.cmdchip { background: var(--cf); color: #1a1712; border-radius: 6px; padding: 3px 9px; font-weight: 700; font-size: 13px; border: 2px solid var(--ce); max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
.cmdchip i { font-style: normal; font-family: var(--f-num); font-size: 11px; opacity: .7; }
.bf { overflow-y: auto; padding: 8px 12px; display: flex; flex-direction: column; gap: 6px; background: radial-gradient(ellipse at 50% 0%, var(--mat-2), var(--mat) 70%); }
.bf-ai { flex-direction: column-reverse; background: radial-gradient(ellipse at 50% 100%, var(--mat-2), var(--mat) 70%); }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: flex-start; min-height: 30px; flex-shrink: 0; }
.row.lands .tile { height: calc(var(--tile-h) * .6); }
.row.lands .t-type { display: none; }
.row.lands { gap: 4px; }
.empty { color: var(--muted); font-size: 12px; font-style: italic; opacity: .6; align-self: center; }
.midline { display: grid; gap: 4px; padding: 5px 12px; background: var(--mat); border-block: 1px dashed var(--line); }
.phases { display: flex; gap: 3px; align-items: center; overflow-x: auto; scrollbar-width: none; }
.turnlbl { font-family: var(--f-display); font-size: 13px; margin-right: 6px; white-space: nowrap; }
.phases.mine .turnlbl { color: var(--you); } .phases.theirs .turnlbl { color: var(--foe); }
.ph { font-size: 11px; padding: 2px 6px; border-radius: 4px; color: var(--muted); white-space: nowrap; text-transform: uppercase; letter-spacing: .06em; }
.ph.on { background: var(--brass); color: var(--brass-ink); font-weight: 700; }
.ticker { display: grid; gap: 1px; font-size: 13px; min-height: 18px; }
.tk { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tk.old { color: var(--muted); font-size: 12px; }
.tk.turn { color: var(--brass); }
.tk.err, .lg.err { color: #c9b07a; font-style: italic; }
.stack { display: flex; flex-direction: column; gap: 3px; }
.stk { display: flex; gap: 8px; align-items: center; text-align: left; background: var(--mat-3); border: 1px solid var(--line); border-radius: 7px; padding: 5px 9px; font-size: 13.5px; min-width: 0; }
.stk.me { border-left: 3px solid var(--you); } .stk.ai { border-left: 3px solid var(--foe); }
.stk-who { font-family: var(--f-display); font-size: 12px; color: var(--muted); }
.stk-what { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stk-top { font-size: 11px; color: var(--brass); white-space: nowrap; }
.stk.hl { box-shadow: 0 0 0 2px var(--brass); } .stk.sel { background: var(--brass); color: var(--brass-ink); }
.hand { display: flex; gap: 6px; overflow-x: auto; padding: 8px 12px; background: var(--mat-2); border-top: 1px solid var(--line); min-height: calc(var(--tile-h) + 16px); }
.hand .tile { flex: none; }
.prompt { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 8px 12px calc(8px + env(safe-area-inset-bottom, 0px)); background: #0a1514; border-top: 1px solid var(--line); }
.pmsg { font-size: 14.5px; flex: 1 1 220px; min-width: 0; }
.pmsg.wait { color: var(--muted); font-style: italic; }
.pmsg b { font-family: var(--f-num); color: var(--brass); }
.blines { font-size: 12.5px; color: var(--brass); margin-top: 2px; }
.pbtns { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.stopall { font-size: 12.5px; color: var(--muted); display: flex; gap: 5px; align-items: center; }
.logbtn, .menubtn { position: absolute; top: 6px; right: max(12px, env(safe-area-inset-right, 0px)); background: var(--mat-3); border: 1px solid var(--line); border-radius: 7px; padding: 4px 9px; font-size: 13px; z-index: 3; }
.logbtn { right: calc(max(12px, env(safe-area-inset-right, 0px)) + 44px); }
.pbar.ai { padding-right: 110px; }
.logpane { position: absolute; right: 0; top: 0; bottom: 0; width: min(380px, 92vw); background: var(--mat-2); border-left: 1px solid var(--line); z-index: 5; display: flex; flex-direction: column; box-shadow: -10px 0 30px rgba(0,0,0,.4); }
.lp-head { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.lp-body { overflow-y: auto; padding: 8px 12px; display: grid; gap: 3px; font-size: 13.5px; align-content: start; }
.lg.turn { color: var(--brass); margin-top: 6px; font-family: var(--f-display); }
.lg.big { font-weight: 700; }
.lg.combat { color: #f0c3a8; } .lg.cast { color: #d4e4ef; }

/* ---------- card tiles */
.tile { width: var(--tile-w); height: var(--tile-h); background: var(--cf); color: #1b1914; border-radius: 6px; border: 2px solid var(--ce); padding: 3px 4px; display: flex; flex-direction: column; gap: 1px; position: relative; cursor: pointer; transition: transform .15s ease, box-shadow .15s ease; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; overflow: hidden; }
.t-name { font-weight: 800; font-size: 10px; line-height: 1.12; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.t-mid { display: flex; flex-wrap: wrap; gap: 1px; }
.t-mid .pip { width: 12px; height: 12px; font-size: 7.5px; vertical-align: 0; }
.t-type { font-size: 8.5px; opacity: .7; line-height: 1.1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.t-bot { margin-top: auto; display: flex; flex-wrap: wrap; gap: 2px; justify-content: flex-end; align-items: flex-end; }
.t-pt { font-family: var(--f-num); font-weight: 700; font-size: 11px; background: rgba(255,255,255,.75); border-radius: 4px; padding: 0 3px; }
.t-pt.up { color: #1e6a1a; } .t-pt.down { color: #a3261a; }
.t-pt i { font-style: normal; color: #a3261a; }
.t-loy { font-family: var(--f-num); font-weight: 700; font-size: 11px; background: #2b2722; color: #f0e7cf; border-radius: 4px 4px 9px 9px; padding: 0 4px; }
.bdg { font-size: 8.5px; font-weight: 800; background: #2b2722; color: #f2ead4; border-radius: 3px; padding: 0 3px; line-height: 13px; }
.bdg.zz { background: #4c6676; }
.bdg.kw { background: rgba(0,0,0,.55); letter-spacing: 1px; }
.t-zone { position: absolute; left: 0; right: 0; bottom: 0; font-size: 8.5px; background: rgba(0,0,0,.65); color: #f0e6cc; text-align: center; padding: 1px; }
.tile.tapped { transform: rotate(9deg) translateY(3px); filter: saturate(.55) brightness(.78); }
.tile.playable { box-shadow: 0 0 0 2px var(--brass), 0 0 14px rgba(209,169,82,.55); }
.tile.hl { box-shadow: 0 0 0 2px var(--you), 0 0 12px rgba(124,187,224,.6); }
.tile.sel { box-shadow: 0 0 0 3px var(--brass), 0 0 16px rgba(209,169,82,.9); transform: translateY(-4px); }
.tile.tapped.sel { transform: rotate(9deg) translateY(-2px); }
.tile.attacking { outline: 2px solid var(--foe); outline-offset: 2px; }
.tile.blocking { outline: 2px solid var(--you); outline-offset: 2px; }
.tile.big { --tile-w: 150px; --tile-h: 210px; padding: 7px 8px; gap: 3px; cursor: pointer; }
.tile.big .t-name { font-size: 13px; -webkit-line-clamp: 2; }
.tile.big .t-type { font-size: 10.5px; white-space: normal; }
.tile.big .t-text { font-size: 10.5px; line-height: 1.25; overflow: hidden; flex: 1; }
.tile.big .t-text .pip, .tile.big .t-cost .pip { width: 13px; height: 13px; font-size: 8px; }
.tile.big .t-pt { font-size: 13px; }
.lstack { position: relative; }
.lstack[data-n]:not([data-n="1"]) .tile { box-shadow: 3px -3px 0 -1px var(--cf), 3px -3px 0 0 var(--ce); }
.lcount { position: absolute; top: -6px; right: -6px; background: var(--brass); color: var(--brass-ink); font-family: var(--f-num); font-weight: 700; font-size: 11px; border-radius: 9px; padding: 0 5px; z-index: 1; }
.pl-life.hl { box-shadow: 0 0 0 2px var(--you); } .pl-life.sel { background: var(--brass); color: var(--brass-ink); }

/* ---------- sheets */
.sheet-wrap { position: fixed; inset: 0; background: rgba(4,10,10,.62); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { position: relative; background: var(--mat-2); border: 1px solid var(--line); border-radius: 16px 16px 0 0; width: min(560px, 100%); max-height: 88%; display: flex; flex-direction: column; box-shadow: 0 -10px 40px rgba(0,0,0,.5); animation: up .18s ease-out; padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet.wide { width: min(900px, 100%); }
@keyframes up { from { transform: translateY(30px); opacity: .6; } to { transform: none; opacity: 1; } }
@media (min-width: 760px) { .sheet-wrap { align-items: center; } .sheet { border-radius: 16px; } }
.sheet-body { overflow-y: auto; padding: 18px max(16px, env(safe-area-inset-right, 0px)) 18px max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 14px; }
.sheet-x { position: absolute; top: 8px; right: 10px; font-size: 18px; color: var(--muted); padding: 6px; z-index: 1; }
.sheet-back { position: absolute; top: 10px; left: 12px; color: var(--brass); font-size: 14px; z-index: 1; }
.sheet-head h3 { font-family: var(--f-display); font-weight: 400; font-size: 21px; margin: 0 28px 2px 0; text-wrap: balance; }
.sheet-actions { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; position: sticky; bottom: -18px; background: var(--mat-2); padding-block: 10px 4px; }
.tiles { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.tiles.dense .tile { --tile-w: 92px; --tile-h: 120px; }
.selwrap.on .tile, .scrywrap.down .tile { box-shadow: 0 0 0 3px var(--brass); }
.scrywrap { display: grid; justify-items: center; gap: 4px; }
.scrywrap.down .tile { opacity: .6; }
.scrylbl { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.ptile { padding: 14px 20px; border-radius: 10px; background: var(--mat-3); border: 1px solid var(--line); font-family: var(--f-display); font-size: 17px; }
.ptile.on { background: var(--brass); color: var(--brass-ink); }
.bigcard { background: var(--cf); color: #1b1914; border: 3px solid var(--ce); border-radius: 12px; padding: 12px 14px; display: grid; gap: 8px; }
.bc-top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.bc-name { font-family: var(--f-display); font-size: 21px; line-height: 1.1; }
.bc-cost { display: flex; gap: 2px; flex-wrap: wrap; justify-content: flex-end; }
.bc-cost .pip { width: 20px; height: 20px; font-size: 11px; }
.bc-type { font-weight: 700; font-size: 14px; border-block: 1px solid rgba(0,0,0,.2); padding-block: 3px; }
.bc-text { font-size: 15px; line-height: 1.4; max-width: 62ch; }
.bc-text .pip { width: 15px; height: 15px; font-size: 9px; }
.bc-foot { display: flex; justify-content: flex-end; gap: 8px; }
.bc-pt, .bc-loy { font-family: var(--f-num); font-weight: 700; font-size: 17px; background: rgba(255,255,255,.7); border-radius: 6px; padding: 1px 8px; }
.bc-loy { background: #2b2722; color: #f0e7cf; }
.bc-state { font-size: 14px; color: var(--muted); }
.acts { display: flex; flex-direction: column; gap: 8px; }

<div id="app"></div>
<script>window.MTG_ART = true;</script>
<script>/* MTG engine — core: parsing, objects, characteristics, mana. */
var MTG = (typeof MTG !== 'undefined') ? MTG : {};
(function (M) {
  'use strict';
  const COLORS = ['W', 'U', 'B', 'R', 'G'];
  const COLOR_NAME = { W: 'White', U: 'Blue', B: 'Black', R: 'Red', G: 'Green' };
  const NAME_COLOR = { white: 'W', blue: 'U', black: 'B', red: 'R', green: 'G' };
  const BASIC_MANA = { Plains: 'W', Island: 'U', Swamp: 'B', Mountain: 'R', Forest: 'G', Wastes: 'C' };
  const CARD_TYPES = ['Creature', 'Land', 'Artifact', 'Enchantment', 'Planeswalker', 'Instant', 'Sorcery', 'Battle', 'Kindred', 'Tribal'];
  const SUPERTYPES = ['Legendary', 'Basic', 'Snow', 'World', 'Ongoing'];
  M.COLORS = COLORS; M.COLOR_NAME = COLOR_NAME; M.BASIC_MANA = BASIC_MANA;

  // ---------------------------------------------------------------- parsing
  function parseParams(str) {
    const out = {};
    if (!str) return out;
    for (const part of str.split('|')) {
      const i = part.indexOf('$');
      if (i < 0) continue;
      const k = part.slice(0, i).trim();
      const v = part.slice(i + 1).trim();
      if (k) out[k] = v;
    }
    return out;
  }
  M.parseParams = parseParams;

  function parseMana(str) {
    // Forge cost "2 W W", "X R", "W/U", "2/W", "W/P", "C", "S"
    const c = { generic: 0, pips: [], x: 0, raw: str || '' };
    if (!str || str === 'no cost') { c.none = true; return c; }
    for (const tok of str.trim().split(/\s+/)) {
      if (/^\d+$/.test(tok)) c.generic += +tok;
      else if (tok === 'X') c.x++;
      else if (tok === 'Y' || tok === 'Z') c.x++;
      else if (tok === 'S') c.generic++;
      else if (tok) c.pips.push(tok);
    }
    return c;
  }
  M.parseMana = parseMana;
  function manaValue(c) {
    if (!c || c.none) return 0;
    let v = c.generic;
    for (const p of c.pips) v += /^2\//.test(p) ? 2 : 1;
    return v;
  }
  M.manaValue = manaValue;
  function manaColors(c) {
    const s = new Set();
    if (!c || c.none) return s;
    for (const p of c.pips) for (const ch of p.split('/')) if (COLORS.includes(ch)) s.add(ch);
    return s;
  }

  function parseTypes(t) {
    const words = (t || '').split(/\s+/).filter(Boolean);
    const r = { super: [], types: [], sub: [] };
    for (const w of words) {
      if (SUPERTYPES.includes(w)) r.super.push(w);
      else if (CARD_TYPES.includes(w)) r.types.push(w === 'Tribal' ? 'Kindred' : w);
      else r.sub.push(w);
    }
    return r;
  }

  const faceCache = new WeakMap();
  function face(raw) {
    // parse a raw face record once
    let f = faceCache.get(raw);
    if (f) return f;
    f = { raw, name: raw.n, cost: parseMana(raw.c), oracle: raw.o || '', svars: raw.SV || {} };
    f.cmc = manaValue(f.cost);
    const ty = parseTypes(raw.t);
    f.super = ty.super; f.types = ty.types; f.sub = ty.sub;
    if (raw.cl) {
      f.colors = new Set(raw.cl.split(',').map(x => NAME_COLOR[x.trim().toLowerCase()]).filter(Boolean));
    } else f.colors = manaColors(f.cost);
    if (raw.pt) { const [p, t] = raw.pt.split('/'); f.power = p; f.toughness = t; }
    if (raw.l != null) f.loyalty = parseInt(raw.l, 10) || 0;
    f.keywords = (raw.K || []).map(k => k.trim());
    if (f.keywords.some(k => k === 'Devoid')) f.colors = new Set();
    f.abilities = (raw.A || []).map((s, i) => ({ str: s, p: parseParams(s.replace(/^\s*(SP|AB)\$\s*/, 'API$ ')), kind: /^\s*SP\$/.test(s) ? 'SP' : 'AB', idx: i }));
    f.triggers = (raw.T || []).map((s, i) => ({ str: s, p: parseParams(s), idx: i }));
    f.statics = (raw.S || []).map((s, i) => ({ str: s, p: parseParams(s), idx: i }));
    f.repl = (raw.R || []).map((s, i) => ({ str: s, p: parseParams(s), idx: i }));
    // keyword-derived triggers/abilities
    for (const k of f.keywords) {
      const [kw, a1, a2] = k.split(':');
      if (kw === 'Prowess') f.triggers.push({ p: { Mode: 'SpellCast', ValidCard: 'Card.nonCreature', ValidActivatingPlayer: 'You', TriggerZones: 'Battlefield', Execute: '__prowess' }, kw: true });
      if (kw === 'Exalted') f.triggers.push({ p: { Mode: 'Attacks', ValidCard: 'Creature.YouCtrl', Alone: 'True', TriggerZones: 'Battlefield', Execute: '__exalted' }, kw: true });
    }
    faceCache.set(raw, f);
    return f;
  }
  M.face = face;

  // ---------------------------------------------------------------- game objects
  let NEXT_ID = 1;
  class Obj {
    constructor(def, owner, opts) {
      this.id = NEXT_ID++;
      this.def = def;          // {faces, alt}
      this.owner = owner;
      this.controller = owner;
      this.zone = 'library';
      this.faceIdx = 0;
      this.zcc = 0;            // zone change counter
      this.isToken = !!(opts && opts.token);
      this.isCommander = !!(opts && opts.commander);
      this.resetState();
    }
    resetState() {
      this.tapped = false;
      this.enteredTurn = -1;
      this.counters = {};
      this.damage = 0;
      this.deathtouched = false;
      this.attachedTo = null;
      this.pumps = [];
      this.kicked = 0;
      this.xPaid = 0;
      this.remembered = [];
      this.regen = 0;
      this.castFaceIdx = null;
      this.attacking = null; // defender ref
      this.blocking = [];
      this.blockedBy = [];
      this.wasBlocked = false;
      this.adventure = false;
      this.chosenColor = null;
      this.chosenType = null;
      this.mustExileOnLeave = false;
      this.crewed = false;
      this.lore = 0;
      this.loyaltyUsed = false;
      this.controller = this.owner;
      this.dealtDamageThisTurn = false;
    }
    get face() { return face(this.def.faces[this.faceIdx] || this.def.faces[0]); }
    get name() { return this.face.name; }
  }
  M.Obj = Obj;

  // ---------------------------------------------------------------- characteristics
  function isLand(o) { return hasType(o, 'Land'); }
  function isCreature(o) { return hasType(o, 'Creature'); }

  function baseTypes(o) {
    const f = o.face;
    const r = { super: f.super.slice(), types: f.types.slice(), sub: f.sub.slice() };
    if (o.crewed && !r.types.includes('Creature')) r.types.push('Creature');
    for (const p of o.pumps) if (p.addType) for (const t of p.addType) { if (CARD_TYPES.includes(t)) { if (!r.types.includes(t)) r.types.push(t); } else if (!r.sub.includes(t)) r.sub.push(t); }
    return r;
  }

  function hasType(o, t) {
    if (!o || !o.def) return false;
    const ch = o.game ? chars(o) : null;
    const ty = ch ? ch : baseTypes(o);
    if (CARD_TYPES.includes(t)) return ty.types.includes(t === 'Tribal' ? 'Kindred' : t);
    if (SUPERTYPES.includes(t)) return ty.super.includes(t);
    if (ty.sub.includes(t)) return true;
    if (ty.types.includes('Creature') && hasKWRaw(o, 'Changeling') && /^[A-Z][a-z]+$/.test(t) && !BASIC_MANA[t]) return true;
    return false;
  }
  M.hasType = hasType; M.isLand = isLand; M.isCreature = isCreature;

  function hasKWRaw(o, kw) { return o.face.keywords.some(k => k.split(':')[0] === kw); }

  function colorsOf(o) {
    let s = new Set(o.face.colors);
    for (const p of o.pumps) if (p.setColor) s = new Set(p.setColor);
    return s;
  }
  M.colorsOf = colorsOf;

  // computed characteristics for objects on the battlefield (and simple for elsewhere)
  let charDepth = 0;
  function chars(o) {
    const g = o.game;
    if (o._chv === (g ? g.version : -1) && o._ch) return o._ch;
    const f = o.face;
    const ty = baseTypes(o);
    const ch = { super: ty.super, types: ty.types, sub: ty.sub, kws: new Set(), cantAttack: false, cantBlock: false, cantBeBlocked: false, mustAttack: false, power: 0, toughness: 0, colors: colorsOf(o), protections: new Set(), cantBlockBy: [] };
    for (const k of f.keywords) ch.kws.add(normKW(k));
    let P = numOr(f.power, 0), T = numOr(f.toughness, 0);
    for (const p of o.pumps) { if (p.setP != null) P = p.setP; if (p.setT != null) T = p.setT; }
    o._ch = ch; o._chv = g ? g.version : -1; // provisional to stop recursion
    ch.power = P; ch.toughness = T;
    if (g && charDepth < 3 && o.zone === 'battlefield') {
      charDepth++;
      try {
        // characteristic-defining

    gainLife(pl, n, src) {

    destroy(o, noRegen) {

    sacrifice(o) {

      this.fire({ type: 'sacrificed', card: o, player: pl });
      return true;
    }
    discard(pl, o) {
      this.move(o, 'graveyard');
      this.fire({ type: 'discard', player: pl, card: o });
    }
    createToken(name, ctrl, n, mods) {
      const raw = this.db.tokens[name];
      let face;
      if (raw) face = raw; else face = M.guessToken(name);
      if (!face) return [];
      const def = { faces: [face], alt: null, token: true };
      const out = [];
      for (let i = 0; i < (n || 1); i++) {
        const o = this.newObj(def, ctrl, { token: true });
        o.zone = 'limbo';
        this.move(o, 'battlefield', { controller: ctrl, tapped: mods && mods.tapped });

    }
    createCopyToken(of, ctrl) {
      const def = { faces: of.def.faces, alt: of.def.alt, token: true };
      const o = this.newObj(def, ctrl, { token: true });
      o.faceIdx = of.faceIdx;
      o.zone = 'limbo';
      this.move(o, 'battlefield', { controller: ctrl });

    }
    inCombat() { return ['beginCombat', 'attackers', 'blockers', 'firstStrike', 'damage', 'endCombat'].includes(this.step); }
    addCounters(o, type, n) {
      if (n <= 0 || !o || o.zone !== 'battlefield') return;

      this.fire({ type: 'counter', card: o, counter: type, amount: n });
      this.touch();
    }

    // ---------------------------------------------------------------- triggers
    fire(ev) {
      if (this.suppressTriggers) return;
      const g = this;
      const sources = new Set(this.battlefield);
      if (ev.type === 'zone' && ev.from === 'battlefield') sources.add(ev.card);
      for (const pl of this.players) for (const o of pl.command) if (o.emblem) sources.add(o);
      for (const e of this.effects) sources.add(e);
      for (const src of sources) {
        const leaving = src === ev.card && ev.type === 'zone' && ev.from === 'battlefield';
        const f = (leaving && ev.lki) ? src.face : src.face;
        for (const tr of f.triggers) {
          const p = tr.p;
          const zones = p.TriggerZones || 'Battlefield';
          if (!/Battlefield|Command/.test(zones) && !(p.Mode === 'ChangesZone')) continue;
          if (src.zone !== 'battlefield' && !leaving && !src.emblem && !src.effect) {
            // ETB/LTB of other zones ignored
            continue;
          }
          if (leaving && !(p.Mode === 'ChangesZone' || p.Mode === 'ChangesZoneAll')) continue;
          const ctrl = leaving && ev.lki ? ev.lki.controller : src.controller;
          let tdata;
          try { tdata = this.matchTrigger(tr, ev, src, ctrl); } catch (e) { tdata = null; }
          if (!tdata) continue;
          const exec = p.Execute;
          let str = exec === '__prowess' ? 'DB$ Pump | Defined$ Self | NumAtt$ +1 | NumDef$ +1' : exec === '__exalted' ? 'DB$ Pump | Defined$ TriggeredAttacker | NumAtt$ +1 | NumDef$ +1' : f.svars[exec];
          if (!str) continue;

    }
    matchTrigger(tr, ev, src, ctrl) {

      const ctx = { game: this, src, ctrl };
      const mode = p.Mode;
      const vc = (thing, key) => !p[key] || M.matchValid(p[key], thing, ctx);
      let data = null;
      switch (mode) {
        case 'ChangesZone': {
          if (ev.type !== 'zone') return null;
          const org = p.Origin, dst = p.Destination;
          const zmap = { battlefield: 'Battlefield', graveyard: 'Graveyard', hand: 'Hand', library: 'Library', exile: 'Exile', stack: 'Stack', command: 'Command' };
          if (org && org !== 'Any' && !org.split(',').includes(zmap[ev.from] || ev.from)) return null;
          const to = ev.toCommand ? (ev.to) : ev.to;
          if (dst && dst !== 'Any' && !dst.split(',').includes(zmap[to] || to)) return null;
          // validity check against LKI for leaving
          const card = ev.card;
          if (p.ValidCard) {
            let ok;
            if (ev.from === 'battlefield' && ev.lki) {

              ok = matchLKI(p.ValidCard, card, ev.lki, ctx);
            } else ok = M.matchValid(p.ValidCard, card, ctx);
            if (!ok) return null;
          }
          data = { card, from: ev.from, to: ev.to, lki: ev.lki };
          break;
        }
        case 'Phase': {
          if (ev.type !== 'phase') return null;
          const ph = { 'Upkeep': 'upkeep', 'Draw': 'draw', 'End of Turn': 'end', 'Main1': 'main1', 'Main2': 'main2', 'BeginCombat': 'beginCombat', 'EndCombat': 'endCombat', 'Cleanup': 'cleanup', 'Precombat Main': 'main1' };
          const want = (p.Phase || '').split(',').map(x => ph[x.trim()] || x.trim());
          if (!want.includes(ev.step)) return null;
          if (p.ValidPlayer && !M.matchValid(p.ValidPlayer, ev.player, ctx)) return null;
          data = { player: ev.player };
          break;
        }
        case 'Attacks': {
          if (ev.type !== 'attacks') return null;
          if (!vc(ev.card, 'ValidCard')) return null;
          if (p.Alone && ev.count !== 1) return null;
          if (p.Attacked && !M.matchValid(p.Attacked, ev.defender, ctx)) return null;

        }
        case 'AttackersDeclared': {

    }

    // put pending triggers on stack (active player first)
    async processTriggers() {
      let guard = 0;
      while (this.pendingTriggers.length && guard++ < 50) {
        const list = this.pendingTriggers.splice(0);
        list.sort((a, b) => (a.ctrl === this.active ? 0 : 1) - (b.ctrl === this.active ? 0 : 1));
        for (const t of list) {
          if (this.over) return;
          const node = M.buildTree(t.str, t.face);
          if (!node) continue;
          const item = { isStackItem: true, kind: 'trigger', obj: t.src, controller: t.ctrl, node, trig: t.trig, desc: t.desc, x: t.src.xPaid || 0, kicked: t.src.kicked, id: M.uid(), face: t.face, chapter: t.chapter, srcZcc: t.src.zcc };
          if (t.optional) {
            const yes = await this.ask(t.ctrl, { type: 'yesno', prompt: `Use ${t.src.name}'s triggered ability?`, card: t.src, item });
            if (!yes) continue;
          }
          const ok = await M.chooseTargetsForTree(this, item, t.ctrl);
          if (!ok) continue;
          // Trigger cost (e.g. "Cost$ 1")
          if (node.p.Cost && node.kind !== 'SP') {
            const cost = M.parseAbilityCost(node.p.Cost);
            if (cost && (cost.mana.generic || cost.mana.pips.length)) {
              const can = M.canPayCost(this, t.ctrl, t.src, cost, 0);
              if (!can) continue;
              const pay = await this.ask(t.ctrl, { type: 'yesno', prompt: `Pay ${node.p.Cost} for ${t.src.name}?`, card: t.src, item });
              if (!pay) continue;
              if (!(await M.payCost(this, t.ctrl, t.src, cost, 0, item))) continue;
            }
          }
          this.stack.push(item);
          this.log(`${t.ctrl.name}: ${t.desc} → ${M.describeItem(this, item)}`, 'trig');
          this.touch();
        }
      }
    }

    // ---------------------------------------------------------------- state-based actions
    checkSBA() {
      let changed = true, loops = 0;
      while (changed && loops++ < 20) {
        changed = false;
        for (const pl of this.players) {
          if (pl.lost) continue;
          if (pl.life <= 0 || pl.poison >= 10 || pl.drewFromEmpty || Object.values(pl.cmdDamage).some(v => v >= 21)) {
            pl.lost = true;
            const why = pl.life <= 0 ? 'life total reached 0' : pl.poison >= 10 ? '10 poison counters' : pl.drewFromEmpty ? 'drew from an empty library' : '21 commander damage';
            this.log(`${pl.name} loses (${why}).`, 'big');
          }
        }
        if (this.players.some(p => p.lost)) {
          const alive = this.players.filter(p => !p.lost);
          this.over = true;
          this.winner = alive.length === 1 ? alive[0] : null;
          throw new GameOver(this.winner);
        }
        for (const o of this.battlefield.slice()) {
          if (o.zone !== 'battlefield') continue;
          // +1/+1 and -1/-1 annihilate
          if (o.counters.P1P1 > 0 && o.counters.M1M1 > 0) { const n = Math.min(o.counters.P1P1, o.counters.M1M1); o.counters.P1P1 -= n; o.counters.M1M1 -= n; this.touch(); }
          if (M.isCreature(o)) {
            const t = M.toughness(o);
            if (t <= 0) { this.move(o, 'graveyard'); changed = true; continue; }
            if ((o.damage >= t || (o.deathtouched && o.damage > 0)) && !M.hasKW(o, 'Indestructible')) {
              if (o.regen > 0) { o.regen--; o.tapped = true; o.damage = 0; o.deathtouched = false; o.attacking = null; this.touch(); continue; }
              this.move(o, 'graveyard'); changed = true; continue;
            }
          }
          if (M.hasType(o, 'Planeswalker') && !M.isCreature(o) && (o.counters.LOYALTY || 0) <= 0) { this.move(o, 'graveyard'); changed = true; continue; }
          if (M.hasType(o, 'Battle') && (o.counters.DEFENSE || 0) <= 0 && o.face.raw.df) { this.move(o, 'graveyard'); changed = true; continue; }
          if (M.hasType(o, 'Aura')) {
            const host = this.byId(o.attachedTo);
            if (!host || host.zone !== 'battlefield') { this.move(o, 'graveyard'); changed = true; continue; }
          }
          if (M.hasType(o, 'Equipment') && o.attachedTo) {
            const host = this.byId(o.attachedTo);
            if (!host || host.zone !== 'battlefield' || !M.isCreature(host)) { o.attachedTo = null; this.touch(); }
          }
          if (M.hasType(o, 'Saga') && o.sagaTotal && (o.counters.LORE || 0) >= o.sagaTotal && !this.stack.some(s => s.obj === o && s.chapter) && !this.pendingTriggers.some(t => t.src === o)) {
            this.sacrifice(o); changed = true; continue;
          }
        }
        // legend rule
        const legends = {};
        for (const o of this.battlefield) if (M.hasType(o, 'Legendary')) { const k = o.controller.id + '|' + o.name; (legends[k] = legends[k] || []).push(o); }
        for (const k in legends) if (legends[k].length > 1) {
          const list = legends[k].sort((a, b) => b.enteredTurn - a.enteredTurn || b.id - a.id);
          for (const o of list.slice(1)) { this.move(o, 'graveyard'); changed = true; }
        }
      }
    }

    // ---------------------------------------------------------------- main loop
    async start() {
      try {
        // decide first player
        this.active = this.players[Math.floor(this.rng() * 2)];
        this.log(`${this.active.name} will go first.`, 'big');
        for (const pl of this.players) await this.mulligan(pl);
        let first = true;
        while (!this.over) {
          await this.takeTurn(first);
          first = false;
          this.active = this.opponent(this.active);
        }
      } catch (e) {
        if (e instanceof GameOver) { this.over = true; this.onChange(); return this.winner; }
        throw e;
      }
      return this.winner;
    }

    async mulligan(pl) {
      let count = 0;
      for (;;) {
        pl.library.push(...pl.hand.splice(0)); for (const o of pl.library) o.zone = 'library';
        shuffle(pl.library, this.rng);
        this.draw(pl, 7);
        if (count >= 4) break;
        const keep = await this.ask(pl, { type: 'mulligan', hand: pl.hand.slice(), count, freeMulligan: this.mode === 'commander' && count === 0 });
        if (keep) break;
        count++;
        this.log(`${pl.name} mulligans.`);
      }
      const free = this.mode === 'commander' ? 1 : 0;
      const toBottom = Math.max(0, count - free);
      if (toBottom > 0) {
        const chosen = await this.ask(pl, { type: 'chooseCards', prompt: `Put ${toBottom} card(s) on the bottom of your library`, cards: pl.hand.slice(), min: toBottom, max: toBottom, purpose: 'bottom' });
        for (const o of chosen) { pl.hand.splice(pl.hand.indexOf(o), 1); pl.library.push(o); o.zone = 'library'; }
      }
      this.log(`${pl.name} keeps ${pl.hand.length} cards.`);
    }

    async takeTurn(first) {
      this.turn++;
      const ap = this.active;
      this.log(`— Turn ${this.turn}: ${ap.name} —`, 'turn');
      for (const pl of this.players) { pl.landsPlayed = 0; pl.lifeGainedThisTurn = 0; pl.lifeLostThisTurn = 0; }
      this.spellsCastThisTurn = [];
      this.creatureDiedThisTurn = false;
      // untap
      this.step = 'untap';
      for (const o of this.battlefield) {
        if (o.controller === ap) {
          o.sickness = false;
          o.loyaltyUsed = false;
          if (o.tapped && !o.doesntUntap) o.tapped = false;
          o.doesntUntap = false;
        }
        o.dealtDamageThisTurn = false;
      }
      this.touch();
      // upkeep
      await this.runStep('upkeep');
      // draw
      this.step = 'draw';
      if (!first || this.mode === 'commander' && false) this.draw(ap, 1);
      await this.runStep('draw', true);
      // main 1
      await this.runStep('main1');
      // combat
      await this.combat();
      // main 2
      await this.runStep('main2');
      // end
      await this.runStep('end');
      // cleanup
      this.step = 'cleanup';
      while (ap.hand.length > 7) {
        const n = ap.hand.length - 7;
        const chosen = await this.ask(ap, { type: 'chooseCards', prompt: `Discard ${n} card(s) to hand size`, cards: ap.hand.slice(), min: n, max: n, purpose: 'discard' });
        for (const o of chosen) this.discard(ap, o);
        if (!chosen.length) break;
      }

      else if ((m = /^AddCounter<(\d+|X)\/(\w+)(?:\/[^>]*)?>$/.exec(t))) c.addCounter = { n: m[1] === 'X' ? 0 : +m[1], type: m[2] };
      else if ((m = /^SubCounter<(\d+|X)\/(\w+)(?:\/[^>]*)?>$/.exec(t))) c.subCounter = { n: m[1] === 'X' ? 0 : +m[1], type: m[2], x: m[1] === 'X' };
      else if ((m = /^Exile<1\/CARDNAME>$/.exec(t))) c.exileSelf = true;
      else if ((m = /^ExileFromGrave<(\d+)\/([^/>]+)(?:\/[^>]*)?>$/.exec(t))) { if (m[2] === 'CARDNAME') c.exileSelf = true; else c.exileGrave = { n: +m[1], valid: m[2] }; }
      else if ((m = /^tapXType<(\d+)\/([^/>]+)(?:\/[^>]*)?>$/.exec(t))) c.tapType = { n: +m[1], valid: m[2] };
      else if ((m = /^Return<1\/CARDNAME>$/.exec(t))) c.returnSelf = true;
      else if ((m = /^PayEnergy<(\d+)>$/.exec(t))) c.energy = +m[1];
      else if (/^Draw<1\/You>$/.test(t)) c.drawFirst = true;
      else c.unsupported = (c.unsupported || []).concat(t);
    }
    c.mana = M.parseMana(manaToks.join(' '));
    c.mana.none = false;
    return c;
  };

  M.canPayCost = function (g, pl, src, cost, extraGeneric, opts) {
    if (!cost || cost.unsupported) return false;
    if (cost.tap && (src.tapped || (M.isCreature(src) && g.isSick(src)))) return false;
    if (cost.untap && (!src.tapped || (M.isCreature(src) && g.isSick(src)))) return false;
    if (cost.payLife && pl.life < cost.payLife) return false;
    if (cost.subCounter && !cost.subCounter.x && (src.counters[cost.subCounter.type] || 0) < cost.subCounter.n) return false;
    if (cost.sac) for (const s of cost.sac) if (g.battlefield.filter(o => o.controller === pl && M.matchValid(s.valid, o, { game: g, src, ctrl: pl })).length < s.n) return false;
    if (cost.discard) { const n = pl.hand.filter(o => o !== src && (cost.discard.valid === 'Hand' || M.matchValid(cost.discard.valid, o, { game: g, src, ctrl: pl }))).length; if (cost.discard.valid !== 'Hand' && n < cost.discard.n) return false; }
    if (cost.exileGrave && pl.graveyard.filter(o => o !== src && M.matchValid(cost.exileGrave.valid, o, { game: g, src, ctrl: pl })).length < cost.exileGrave.n) return false;
    if (cost.tapType && g.battlefield.filter(o => o.controller === pl && !o.tapped && o !== src && M.matchValid(cost.tapType.valid, o, { game: g, src, ctrl: pl })).length < cost.tapType.n) return false;
    if (cost.energy && (pl.energy || 0) < cost.energy) return false;
    const mana = cost.mana;
    if (mana.generic || mana.pips.length || extraGeneric) {
      // exclude the source itself from mana sources if it taps as part of cost
      let srcs = M.manaSources(g, pl);
      if (cost.tap || cost.sacSelf) srcs = srcs.filter(s => s.obj !== src);
      if (opts && opts.excludeSources) srcs = srcs.filter(s => !opts.excludeSources.includes(s.obj));
      if (!M.planPayment(g, pl, mana, extraGeneric || 0, { sources: srcs })) return false;
    }
    return true;
  };

  M.payMana = function (g, pl, mana, extraGeneric, excludeObjs, keepColors) {
    let srcs = M.manaSources(g, pl);
    if (excludeObjs) srcs = srcs.filter(s => !excludeObjs.includes(s.obj));
    const plan = M.planPayment(g, pl, mana, extraGeneric || 0, { sources: srcs, keepColors });
    if (!plan) return false;
    pl.pool = plan.pool;
    for (const u of plan.uses) {
      const s = u.src;
      const o = s.obj;
      if (s.ab) {
        o.tapped = true;
        g.fire({ type: 'tap', card: o });
        g.fire({ type: 'tapmana', card: o });
        // pain lands etc.
        if (s.ab.p.SubAbility && o.face.svars[s.ab.p.SubAbility]) {
          const sv = o.face.svars[s.ab.p.SubAbility];
          const sp = M.parseParams(sv);
          if (sp.DB === 'DealDamage' && /You/.test(sp.Defined || '')) g.dealDamage(o, pl, M.evalNum(sp.NumDmg || '1', { game: g, src: o, ctrl: pl }, o.face));
          else if (sp.DB === 'LoseLife') g.loseLife(pl, M.evalNum(sp.LifeAmount || '1', { game: g, src: o, ctrl: pl }, o.face));
        }
        if (s.sac) g.sacrifice(o);
      } else { o.tapped = true; g.fire({ type: 'tap', card: o }); g.fire({ type: 'tapmana', card: o }); }
      const extra = s.amount - u.colors.length;
      if (extra > 0) { const c = [...s.colors][0]; pl.pool[c] = (pl.pool[c] || 0) + extra; }
    }
    if (plan.life) g.loseLife(pl, plan.life);
    g.touch();
    return true;
  };

  M.payCost = async function (g, pl, src, cost, extraGeneric, item) {
    const ctx = { game: g, src, ctrl: pl };
    // choose non-mana parts first (so they don't get tapped for mana)
    let sacChosen = [], discChosen = [], exChosen = [], tapChosen = [];
    if (cost.sac) for (const s of cost.sac) {
      const cands = g.battlefield.filter(o => o.controller === pl && M.matchValid(s.valid, o, ctx) && !sacChosen.includes(o));
      const ch = await g.ask(pl, { type: 'chooseCards', prompt: `Sacrifice ${s.n} (${s.valid})`, cards: cands, min: s.n, max: s.n, purpose: 'sacrifice', card: src });
      if (!ch || ch.length < s.n) return false;
      sacChosen.push(...ch);
    }
    if (cost.discard) {
      const cands = pl.hand.filter(o => o !== src && (cost.discard.valid === 'Hand' || M.matchValid(cost.discard.valid, o, ctx)));
      if (cost.discard.valid === 'Hand') discChosen = cands;
      else {
        const ch = await g.ask(pl, { type: 'chooseCards', prompt: `Discard ${cost.discard.n} card(s)`, cards: cands, min: cost.discard.n, max: cost.discard.n, purpose: 'discard', card: src });
        if (!ch || ch.length < cost.discard.n) return false;
        discChosen = ch;
      }
    }
    if (cost.exileGrave) {
      const cands = pl.graveyard.filter(o => o !== src && M.matchValid(cost.exileGrave.valid, o, ctx));
      const ch = await g.ask(pl, { type: 'chooseCards', prompt: `Exile ${cost.exileGrave.n} from your graveyard`, cards: cands, min: cost.exileGrave.n, max: cost.exileGrave.n, purpose: 'exile', card: src });
      if (!ch || ch.length < cost.exileGrave.n) return false;
      exChosen = ch;
    }
    if (cost.tapType) {
      const cands = g.battlefield.filter(o => o.controller === pl && !o.tapped && o !== src && M.matchValid(cost.tapType.valid, o, ctx));
      const ch = await g.ask(pl, { type: 'chooseCards', prompt: `Tap ${cost.tapType.n} untapped (${cost.tapType.valid})`, cards: cands, min: cost.tapType.n, max: cost.tapType.n, purpose: 'tap', card: src });
      if (!ch || ch.length < cost.tapType.n) return false;
      tapChosen = ch;
    }
    const exclude = [].concat(sacChosen, tapChosen, (cost.tap || cost.sacSelf) ? [src] : []);
    const mana = cost.mana;
    if (mana.generic || mana.pips.length || extraGeneric) {
      if (!M.payMana(g, pl, mana, extraGeneric, exclude)) return false;
    }
    if (cost.tap) { src.tapped = true; g.fire({ type: 'tap', card: src }); }
    if (cost.untap) src.tapped = false;
    if (cost.payLife) g.loseLife(pl, cost.payLife);
    if (cost.energy) pl.energy -= cost.energy;
    if (cost.addCounter) { src.counters[cost.addCounter.type] = (src.counters[cost.addCounter.type] || 0) + cost.addCounter.n; }
    if (cost.subCounter) {
      let n = cost.subCounter.n;
      if (cost.subCounter.x) { n = item ? item.x : 0; }
      src.counters[cost.subCounter.type] = (src.counters[cost.subCounter.type] || 0) - n;
    }
    for (const o of tapChosen) { o.tapped = true; g.fire({ type: 'tap', card: o }); }
    if (item) { item.sacrificed = sacChosen.slice(); item.discarded = discChosen.slice(); }
    for (const o of sacChosen) g.sacrifice(o);
    for (const o of discChosen) g.discard(pl, o);
    for (const o of exChosen) g.move(o, 'exile');
    if (cost.sacSelf) { if (item) item.sacrificed = (item.sacrificed || []).concat([src]); item && (item.lkiPower = M.power(src)); g.sacrifice(src); }
    if (cost.discardSelf) g.discard(pl, src);
    if (cost.exileSelf) g.move(src, 'exile');
    if (cost.returnSelf) g.move(src, 'hand');
    g.touch();
    return true;
  };

  // ---------------------------------------------------------------- spells: info
  function spellAbility(f) {
    return f.abilities.find(a => a.kind === 'SP' && !a.p.NonBasicSpell && !/Flash/.test(a.p.Cost || '_')) || f.abilities.find(a => a.kind === 'SP');
  }
  M.spellAbility = spellAbility;
  function isPermanentFace(f) { return !(f.types.includes('Instant') || f.types.includes('Sorcery')); }
  M.isPermanentFace = isPermanentFace;

  // castable faces from a card in a given zone
  M.castableFaces = function (o) {
    const alt = o.def.alt;
    const faces = o.def.faces;
    if (alt === 'Split') return [0, 1];
    if (alt === 'Modal') return [0, 1];
    if (alt === 'Adventure' || alt === 'Omen') return o.adventure ? [0] : [0, 1];
    return [0];
  };

  function reduceCost(g, pl, o, f) {
    let r = 0;
    for (const src of g.battlefield.concat(g.effects)) {
      for (const st of src.face.statics) {
        const p = st.p;
        if (!/ReduceCost|RaiseCost/.test(p.Mode || '')) continue;
        if (p.Type && !/Spell/.test(p.Type)) continue;
        const ctx = { game: g, src, ctrl: src.controller };
        if (p.Activator && !M.matchValid(p.Activator, pl, ctx)) continue;
        if (p.ValidCard) {
          // evaluate card-valid against the card in hand (face types)
          const saveFi = o.faceIdx; o.faceIdx = o.def.faces.indexOf(f.raw) >= 0 ? o.def.faces.indexOf(f.raw) : 0;
          const ok = M.matchValid(p.ValidCard, o, ctx);
          o.faceIdx = saveFi;
          if (!ok) continue;
        }
        if (!M.checkConditions(p, ctx, src.face)) continue;
        const amt = M.evalNum(p.Amount || '1', ctx, src.face);
        r += /Raise/.test(p.Mode) ? -amt : amt;
      }
    }
    // self reduction (e.g. affinity) — static on card itself with EffectZone All
    for (const st of f.statics) {
      const p = st.p;
      if (/ReduceCost/.test(p.Mode || '') && /All|Hand|Stack/.test(p.EffectZone || '') && (p.ValidCard || '').includes('Self')) {
        r += M.evalNum(p.Amount || '1', { game: g, src: o, ctrl: pl }, f);
      }
    }
    const aff = f.keywords.find(k => k.startsWith('Affinity:'));
    if (aff) { const t = aff.split(':')[1]; r += g.battlefield.filter(x => x.controller === pl && M.matchValid(t, x, { game: g, src: o, ctrl: pl })).length; }
    return r;
  }

  M.spellCostInfo = function (g, pl, o, faceIdx, from, opts) {
    const f = M.face(o.def.faces[faceIdx] || o.def.faces[0]);
    let mana = f.cost;
    if (from === 'graveyard') {
      const fb = f.keywords.find(k => k.startsWith('Flashback:'));
      if (fb) mana = M.parseMana(fb.slice('Flashback:'.length).split('|')[0]);
    }
    if (mana.none) return null;
    let extra = 0;
    if (from === 'command') extra += 2 * (pl.cmdCasts[o.id] || 0);
    extra -= reduceCost(g, pl, o, f);
    const sa = spellAbility(f);
    let addl = null;
    if (sa && sa.p.Cost) { addl = M.parseAbilityCost(sa.p.Cost); addl.mana = M.parseMana(''); addl.mana.none = false; }
    // generic reduction can't go below 0; reductions can eat into generic only
    const m2 = { generic: mana.generic, pips: mana.pips.slice(), x: mana.x, raw: mana.raw };
    if (extra < 0) { m2.generic = Math.max(0, m2.generic + extra); extra = 0; }
    return { face: f, mana: m2, extra, addl };
  };

  M.canCastNow = function (g, pl, o, f) {
    const instantSpeed = f.types.includes('Instant') || f.keywords.includes('Flash') || g.battlefield.some(src => src.controller === pl && src.face.statics.some(st => /CastWithFlash/.test(st.p.Mode || '') && M.matchValid(st.p.ValidCard || 'Card', o, { game: g, src, ctrl: pl })));
    if (instantSpeed) return true;
    return g.active === pl && (g.step === 'main1' || g.step === 'main2') && g.stack.length === 0;
  };

  function castBlocked(g, pl, o) {
    for (const src of g.battlefield.concat(g.effects)) for (const st of src.face.statics) {
      if (!/CantBeCast/.test(st.p.Mode || '')) continue;
      const ctx = { game: g, src, ctrl: src.controller };
      if (st.p.Caster && !M.matchValid(st.p.Caster, pl, ctx)) continue;
      if (st.p.ValidCard && !M.matchValid(st.p.ValidCard, o, ctx)) continue;
      if (!M.checkConditions(st.p, ctx, src.face)) continue;
      return true;
    }
    return false;
  }

  // ---------------------------------------------------------------- legal actions
  M.legalActions = function (g, pl) {
    const acts = [];
    if (g.over) return acts;
    // lands
    if (g.canPlayLand(pl)) {
      for (const o of pl.hand) {
        const faces = o.def.alt === 'Modal' ? [0, 1] : [0];
        for (const fi of faces) { const f = M.face(o.def.faces[fi]); if (f.types.includes('Land')) acts.push({ kind: 'land', card: o, faceIdx: fi, label: `Play ${f.name}` }); }
      }
    }
    const zonesToCast = [['hand', pl.hand], ['command', pl.command.filter(x => !x.emblem)], ['graveyard', pl.graveyard.filter(x => x.def.faces.some(r => (r.K || []).some(k => k.startsWith('Flashback:'))))], ['exile', pl.exile.filter(x => x.adventure)]];
    for (const [from, list] of zonesToCast) {
      for (const o of list) {
        if (castBlocked(g, pl, o)) continue;
        for (const fi of M.castableFaces(o)) {
          if (from === 'exile' && fi !== 0) continue;
          const f = M.face(o.def.faces[fi] || o.def.faces[0]);
          if (f.types.includes('Land')) continue;
          if (from === 'graveyard' && !f.keywords.some(k => k.startsWith('Flashback:'))) continue;
          if (!M.canCastNow(g, pl, o, f)) continue;
          const info = M.spellCostInfo(g, pl, o, fi, from);
          if (!info) continue;
          if (info.addl && !M.canPayCost(g, pl, o, info.addl, 0)) continue;
          if (!M.planPayment(g, pl, info.mana, info.extra)) continue;
          if (!quickTargetsOK(g, pl, o, f)) continue;
          acts.push({ kind: 'cast', card: o, faceIdx: fi, from, label: `Cast ${f.name}${from === 'graveyard' ? ' (flashback)' : from === 'command' ? ' (from command zone)' : from === 'exile' ? ' (from adventure)' : ''}` });
        }
      }
    }
    // activated abilities
    for (const o of g.battlefield) {
      if (o.controller !== pl) continue;
      const abs = M.activatedAbilities(g, o, 'battlefield');
      for (const ab of abs) if (M.canActivate(g, pl, o, ab)) acts.push({ kind: 'activate', card: o, ab, label: ab.label });
    }
    for (const o of pl.hand) for (const ab of M.activatedAbilities(g, o, 'hand')) if (M.canActivate(g, pl, o, ab)) acts.push({ kind: 'activate', card: o, ab, label: ab.label });
    for (const o of pl.graveyard) for (const ab of M.activatedAbilities(g, o, 'graveyard')) if (M.canActivate(g, pl, o, ab)) acts.push({ kind: 'activate', card: o, ab, label: ab.label });
    return acts;
  };

  function quickTargetsOK(g, pl, o, f) {
    // check that a targeted spell has at least one target for its first node
    const sa = spellAbility(f);
    if (M.hasType({ face: f, def: o.def, pumps: [], counters: {} }, 'Aura') || f.sub.includes('Aura')) {
      const en = f.keywords.find(k => k.startsWith('Enchant:'));
      if (en) {
        const valid = en.split(':')[1];
        const fake = { isStackItem: true, obj: o, controller: pl, node: null };
        const node = { p: { ValidTgts: valid }, face: f };
        return M.targetCandidates(g, fake, node, pl).length > 0;
      }
      return true;
    }
    if (!sa) return true;
    const node = M.buildTree(sa.str, f);
    if (!node) return true;
    if (node.choices) return true;
    if (!M.nodeNeedsTargets(node)) return true;
    const min = node.p.TargetMin != null ? M.evalNum(node.p.TargetMin, { game: g, src: o, ctrl: pl }, f) : 1;
    if (min === 0) return true;
    const fake = { isStackItem: true, obj: o, controller: pl, node, x: 0 };
    return M.targetCandidates(g, fake, node, pl).length >= min;
  }

  // abilities usable from a zone, including keyword-derived ones
  M.activatedAbilities = function (g, o, zone) {
    const f = o.face;
    const key = zone + ':' + o.faceIdx;
    o._abCache = o._abCache || {};
    if (o._abCache[key]) return o._abCache[key];
    const out = [];
    for (const ab of f.abilities) {
      if (ab.kind !== 'AB') continue;
      const p = ab.p;
      const azone = (p.ActivationZone || 'Battlefield').toLowerCase();
      if (azone !== zone) continue;
      if (p.API === 'ManaReflected' && zone === 'battlefield') continue;
      if (p.API === 'Mana' && zone === 'battlefield') {
        // simple tap-mana abilities are auto-used for payment; others are shown
        const parts = (p.Cost || '').trim().split(/\s+/);
        if (parts.length === 1 && parts[0] === 'T') continue;
        if (/Sac<1\/CARDNAME/.test(p.Cost || '') && parts.length <= 2) continue;
      }
      out.push({ str: ab.str, p, cost: M.parseAbilityCost(p.Cost), label: abilityLabel(o, ab.str, p), pw: p.Planeswalker === 'True', idx: ab.idx });
    }
    for (const k of f.keywords) {
      const parts = k.split(':');
      if (parts[0] === 'Equip' && zone === 'battlefield') {
        const cost = parts[1];
        const valid = parts[2] && !/^\d/.test(parts[2]) && parts[2].includes('.') ? parts[2] : 'Creature.YouCtrl';
        out.push({ str: `AB$ Attach | Cost$ ${cost} | ValidTgts$ ${valid} | SorcerySpeed$ True`, p: M.parseParams(`AB$ Attach | Cost$ ${cost} | ValidTgts$ ${valid} | SorcerySpeed$ True`), cost: M.parseAbilityCost(cost), label: `Equip {${cost}}`, kw: 'Equip' });
      }
      if (parts[0] === 'Cycling' && zone === 'hand') {
        const cost = parts[1];
        out.push({ str: 'AB$ Draw | NumCards$ 1', p: { AB: 'Draw', NumCards: '1' }, cost: Object.assign(M.parseAbilityCost(cost), { discardSelf: true }), label: `Cycling {${cost}}`, kw: 'Cycling', instant: true });
      }
      if (parts[0] === 'TypeCycling' && zone === 'hand') {
        const type = parts[1], cost = parts[2];
        const s = `AB$ ChangeZone | Origin$ Library | Destination$ Hand | ChangeType$ ${type} | ChangeNum$ 1`;
        out.push({ str: s, p: M.parseParams(s), cost: Object.assign(M.parseAbilityCost(cost), { discardSelf: true }), label: `${type}cycling {${cost}}`, kw: 'Cycling', instant: true });
      }
      if (parts[0] === 'Crew' && zone === 'battlefield') {
        const n = +parts[1] || 1;
        out.push({ str: `AB$ Crew | Power$ ${n}`, p: { AB: 'Crew', Power: String(n) }, cost: M.parseAbilityCost(''), label: `Crew ${n}`, kw: 'Crew', instant: true });
      }
      if (parts[0] === 'Unearth' && zone === 'graveyard') {
        const cost = parts[1];
        out.push({ str: 'AB$ ChangeZone | Defined$ Self | Origin$ Graveyard | Destination$ Battlefield | Unearth$ True', p: M.parseParams('AB$ ChangeZone | Defined$ Self | Origin$ Graveyard | Destination$ Battlefield | Unearth$ True'), cost: M.parseAbilityCost(cost), label: `Unearth {${cost}}`, kw: 'Unearth', sorcery: true });
      }
      if (parts[0] === 'Ninjutsu' || parts[0] === 'Level up') { /* not implemented */ }
    }
    o._abCache[key] = out;
    return out;
  };
  function abilityLabel(o, str, p) {
    const cost = (p.Cost || '').replace(/AddCounter<(\d+)\/LOYALTY>/, '+$1').replace(/SubCounter<(\w+)\/LOYALTY>/, '−$1').replace(/Sac<1\/CARDNAME[^>]*>/, 'Sac').replace(/\bT\b/, '⟳');
    const ox = o.face.oracle.split('\n');
    // try to find the oracle line for this ability
    let desc = '';
    if (p.Planeswalker) {
      const sign = /AddCounter<(\d+)/.exec(p.Cost || ''); const sub = /SubCounter<(\w+)/.exec(p.Cost || '');
      const tag = sign ? `[+${sign[1]}]` : sub ? `[−${sub[1]}]` : '[0]';
      const line = ox.find(l => l.startsWith(tag) || l.startsWith(tag.replace('−', '-')));
      desc = line || '';
    } else {
      const apiName = { Draw: 'Draw', DealDamage: 'Damage', Pump: 'Pump', Token: 'Token', Destroy: 'Destroy', GainLife: 'Gain life', PutCounter: 'Counters', ChangeZone: 'Move', Mana: 'Mana', Scry: 'Scry' }[p.API] || p.API;
      desc = apiName;
    }
    return desc && p.Planeswalker ? desc : `${cost || '—'}: ${desc}`;
  }

  M.canActivate = function (g, pl, o, ab) {
    const p = ab.p;
    if (ab.cost.unsupported) return false;
    const sorcery = ab.sorcery || p.SorcerySpeed === 'True' || ab.pw;
    if (sorcery && !(g.active === pl && (g.step === 'main1' || g.step === 'main2') && !g.stack.length)) return false;
    if (ab.pw && o.loyaltyUsed) return false;
    if (p.ActivationLimit && (o._actCount || {})[ab.str] >= +p.ActivationLimit) return false;
    if (p.PlayerTurn === 'True' && g.active !== pl) return false;
    if (!M.checkConditions(p, { game: g, src: o, ctrl: pl }, o.face)) return false;
    if (ab.kw === 'Crew') {
      if (M.isCreature(o)) return false;
      const pw = g.battlefield.filter(x => x.controller === pl && x !== o && M.isCreature(x) && !x.tapped).reduce((a, x) => a + Math.max(0, M.power(x)), 0);
      if (pw < +p.Power) return false;
      return true;
    }
    if (ab.kw === 'Equip') {
      if (!g.battlefield.some(x => x.controller === pl && M.isCreature(x) && x.id !== o.attachedTo)) return false;
    }
    if (!M.canPayCost(g, pl, o, ab.cost, 0)) return false;
    // targets available?
