    const special = 'https://scryfall.com/search?q=' + encodeURIComponent(`${exact} prefer:atypical`);
    const all = 'https://scryfall.com/search?unique=art&order=released&as=grid&q=' + encodeURIComponent(exact);
    return `<div class="artlinks"><a class="btn artbtn" href="${special}" target="_blank" rel="noopener">View art on Scryfall <span aria-hidden="true">↗</span></a><a class="link" href="${all}" target="_blank" rel="noopener">All printings</a></div><p class="muted small artnote">Opens the printing with the most unusual frame (borderless, extended art, showcase and so on), or the regular one if there's nothing special.</p>`;
  }
  function safeUrl(u) { return typeof u === 'string' && /^https:\/\/[^'"()\s<>]+$/.test(u) ? u : null; }
  function artBlock(a, name) {
    const src = safeUrl(a.full);
    if (!src) return '';
    return `<figure class="fullcard"><img src="${src}" alt="${esc(name)}" loading="lazy" decoding="async"><figcaption>${esc(a.label)}${a.set ? ' · ' + esc(a.set) : ''}${a.artist ? ' · Art by ' + esc(a.artist) : ''}</figcaption></figure>`;
  }
  function fullArtHTML(o, def, i) {
    if (!M.Art || !M.Art.isOn()) return '';
    if (o && (o.isToken || o.emblem || o.effect)) return '';
    const key = M.Art.keyOf(def);
    if (!key) return '';
    const a = M.Art.forDef(def, i, true);
    if (a) return artBlock(a, def.faces[i] ? def.faces[i].n : key);
    if (!M.Art.pending(key)) return '';
    return `<div class="fullcard pending" data-artkey="${esc(key)}" data-artface="${i}"><span>Loading art…</span></div>`;
  }
  function fillArtSlots(key) {
    document.querySelectorAll('.fullcard.pending[data-artkey]').forEach(el => {
      if (key && el.dataset.artkey !== key) return;
      const def = DATA.cards[el.dataset.artkey] || Object.values(DATA.cards).find(d => M.Art.keyOf(d) === el.dataset.artkey);
      if (!def) { el.remove(); return; }
      const i = +el.dataset.artface || 0;
      const a = M.Art.forDef(def, i, false);
      if (a) el.outerHTML = artBlock(a, def.faces[i] ? def.faces[i].n : el.dataset.artkey);
      else if (!M.Art.pending(el.dataset.artkey)) el.remove();
    });
  }
  let artTimer = null;
  if (M.Art) M.Art.onUpdate(key => {
    fillArtSlots(key);
    clearTimeout(artTimer);
    artTimer = setTimeout(() => {
      if (G) scheduleRender();
      if (UI.pending && UI.pending.req.type === 'mulligan' && UI.sheet) openPromptSheet(UI.pending.req);
    }, 300);
  });
  function cardDetailHTML(o, def, faceIdx) {
    const faces = (o ? o.def : def).faces;
    let html = '';
    faces.forEach((raw, i) => {
      if (o && o.zone === 'battlefield' && i !== o.faceIdx && o.def.alt !== 'Split') return;
      const f = M.face(raw);
      const live = o && o.zone === 'battlefield' && i === o.faceIdx;
      const pt = live && M.isCreature(o) ? `${M.power(o)}/${M.toughness(o)}` : (f.power != null ? `${f.power}/${f.toughness}` : '');
      const loy = live && o.counters.LOYALTY != null ? o.counters.LOYALTY : f.loyalty;
      html += `<div class="face-pair">${fullArtHTML(o, o ? o.def : def, i)}<div class="bigcard ${colorClass(live ? o : null, f)}">
        <div class="bc-top"><span class="bc-name">${esc(f.name)}</span><span class="bc-cost">${costHTML(f.cost)}</span></div>
        <div class="bc-type">${esc(f.raw.t || '')}</div>
        <div class="bc-text">${oracleHTML(f.oracle) || '<span class="muted">No rules text.</span>'}</div>
        <div class="bc-foot">${pt ? `<span class="bc-pt">${pt}</span>` : ''}${loy != null && f.types.includes('Planeswalker') ? `<span class="bc-loy">${loy}</span>` : ''}</div>
      </div></div>`;
    });
    if (o && o.zone === 'battlefield') {
      const bits = [];
      const ch = M.chars(o);
      for (const [k, v] of Object.entries(o.counters)) if (v) bits.push(`${v} ${k === 'P1P1' ? '+1/+1' : k === 'M1M1' ? '−1/−1' : k.toLowerCase()} counter${v > 1 ? 's' : ''}`);
      if (o.damage) bits.push(`${o.damage} damage marked`);
      if (o.tapped) bits.push('tapped');
      if (o.sickness && M.isCreature(o) && !M.hasKW(o, 'Haste')) bits.push('summoning sick');
      const extraKw = [...ch.kws].filter(k => !o.face.keywords.some(x => x.split(':')[0] === k));
      if (extraKw.length) bits.push('has ' + extraKw.join(', '));
      const host = G && G.byId(o.attachedTo); if (host) bits.push('attached to ' + host.name);
      const att = G ? G.battlefield.filter(x => x.attachedTo === o.id) : []; if (att.length) bits.push('equipped/enchanted by ' + att.map(x => x.name).join(', '));
      if (o.isCommander) bits.push('commander');
      if (o.controller !== o.owner) bits.push(`owned by ${o.owner.name}`);
      if (bits.length) html += `<div class="bc-state">${esc(bits.join(' · '))}</div>`;
    }
    if (o && o.isCommander && o.zone === 'command') html += `<div class="bc-state">In the command zone · commander tax {${2 * (o.owner.cmdCasts[o.id] || 0)}}</div>`;
    const isReal = !(o && (o.isToken || o.emblem || o.effect)) && !(o && /^Manifested /.test(o.name));
    if (isReal) html += artLinksHTML((o ? o.def : def).faces[0].n);
    return html;
  }

  // ---------------------------------------------------------------- start game
  async function startGame() {
    if ((S.mine && S.mine.custom) || (S.theirs && S.theirs.custom)) {
      try { await ensureAll(); } catch (e) { return; }
      for (const side of ['mine', 'theirs']) {
        const v = S[side];
        if (!v || !v.custom) continue;
        const d = M.Decks.store.get(v.deckId);
        if (!d) { S[side] = null; continue; }
        const p = M.Decks.playable(d);
        if (!p.ok) { flash(`${d.name}: ${p.why}`); renderSetup(); return; }
        S[side] = customView(d);
      }
      if (!S.mine) { renderSetup(); return; }
    }
    const pool = DATA.decks.filter(d => d.mode === S.mode);
    const mine = S.mine;
    const theirs = S.theirs && S.theirs.mode === S.mode ? S.theirs : pool[Math.floor(Math.random() * pool.length)];
    S.lastTheirs = theirs;
    UI = { pending: null, sel: [], blocks: [], attacks: new Map(), log: [], showLog: false, sheet: null, blockerSel: null, stopAll: UI.stopAll };
    HUMAN = { isAI: false, ask: humanAsk };
    AIP = { isAI: true, async ask(g, pl, req) { const r = await M.AI.controller.ask(g, pl, req); const acted = (req.type === 'priority' && r && r.kind !== 'pass') || (req.type === 'attackers' && r && r.length) || (req.type === 'blockers' && r && r.length); if (acted) { scheduleRender(); await sleep(520 * S.speed); } else if (req.type === 'priority') { await sleep(0); } return r; } };
    G = new M.Game({
      db: { cards: DATA.cards, tokens: DATA.tokens }, mode: S.mode, decks: [mine, theirs], controllers: [HUMAN, AIP], names: ['You', 'Computer'],
      startingLife: S.mode === 'commander' ? S.life : 20,
      log: (msg, cls) => { msg = youGrammar(msg); UI.log.push({ msg, cls, turn: G ? G.turn : 0 }); if (UI.log.length > 600) UI.log.splice(0, 100); scheduleRender(); },
      onChange: scheduleRender,
    });
    document.body.classList.add('in-game');
    if (M.Art && M.Art.isOn()) {
      const defs = [];
      for (const d of [mine, theirs]) for (const nm of d.main.map(x => x[1]).concat(d.commander || [])) if (DATA.cards[nm]) defs.push(DATA.cards[nm]);
      M.Art.prefetch(defs);
    }
    renderGame();
    G.start().then(w => { renderGame(); showGameOver(w); }).catch(e => { console.error(e); UI.log.push({ msg: 'Game error: ' + e.message, cls: 'err' }); renderGame(); });
  }

  function youGrammar(m) {
    return m.replace(/\bYou (doesn't|has|is|[a-z]+)\b/g, (all, v) => {
      if (v === "doesn't") return "You don't";
      if (v === 'has') return 'You have';
      if (v === 'is') return 'You are';
      if (/ies$/.test(v)) return 'You ' + v.slice(0, -3) + 'y';
      if (/(ches|shes|sses|xes)$/.test(v)) return 'You ' + v.slice(0, -2);
      if (/[^s]s$/.test(v) && !['was', 'his', 'this'].includes(v)) return 'You ' + v.slice(0, -1);
      return all;
    });
  }
  function showGameOver(w) {
    const you = w && w.id === 0;
    openSheet(`<div class="over ${you ? 'win' : 'loss'}"><div class="over-k">${w ? (you ? 'Victory' : 'Defeat') : 'Draw'}</div><p>${w ? (you ? 'You won' : 'The computer won') : 'Nobody won'} on turn ${G.turn}.</p>
      <div class="over-btns"><button class="btn primary" id="rematch">Rematch</button><button class="btn" id="newgame">Choose new decks</button><button class="btn ghost" id="reviewBtn">Review the board</button></div></div>`, { noClose: true });
    $('#rematch').onclick = () => { closeSheet(); S.theirs = S.theirs || S.lastTheirs; startGame(); };
    $('#newgame').onclick = () => { closeSheet(); renderSetup(); };
    $('#reviewBtn').onclick = () => { closeSheet(); UI.over = true; renderGame(); };
  }

  // ---------------------------------------------------------------- human controller
  function humanAsk(g, pl, req) {
    return new Promise(resolve => {
      if (req.type === 'priority') {
        const acts = M.legalActions(g, pl);
        req.acts = acts;
        if (!shouldStop(g, pl, acts)) { resolve({ kind: 'pass' }); return; }
      }
      if (req.type === 'targets' && req.candidates.length === req.min && req.min === req.max && req.candidates.length === 1 && !req.candidates[0].isPlayer && false) { resolve(req.candidates.slice()); return; }
      UI.pending = { req, resolve };
      UI.sel = [];
      UI.attacks = new Map();
      UI.blocks = [];
      UI.blockerSel = null;
      if (req.type === 'attackers') {
        // preselect nothing
      }
      renderGame();
      openPromptSheet(req);
    });
  }
  function answer(v) {
    const p = UI.pending;
    if (!p) return;
    UI.pending = null;
    UI.sel = [];
    closeSheet();
    p.resolve(v);
    scheduleRender();
  }
  function shouldStop(g, pl, acts) {
    if (!acts.length) return false;
    if (UI.stopAll) return true;
    const top = g.stack[g.stack.length - 1];
    if (top) return top.controller !== pl;
    const mine = g.active === pl;
    if (mine) {
      if (g.step === 'main2' && UI.endTurn === g.turn) return false;
      if (g.step === 'main1' || g.step === 'main2') return true;
      if (g.step === 'blockers' || g.step === 'beginCombat') return acts.some(a => a.kind === 'cast' || a.kind === 'activate');
      return false;
    }
    return ['attackers', 'blockers', 'end'].includes(g.step);
  }

  // modal prompts for non-board choices
  function openPromptSheet(req) {
    const t = req.type;
    if (t === 'mulligan') {
      openSheet(`<div class="sheet-head"><h3>Opening hand</h3><div class="muted">${req.count ? `Mulligan ${req.count}: you'll put ${Math.max(0, req.count - (G.mode === 'commander' ? 1 : 0))} card(s) on the bottom.` : (G.mode === 'commander' ? 'Your first mulligan is free.' : 'Keep these seven, or shuffle and draw a new hand.')}</div></div>
        <div class="tiles">${req.hand.map(o => tileHTML(o, { big: true })).join('')}</div>
        <div class="sheet-actions"><button class="btn" id="mullBtn">Mulligan</button><button class="btn primary" id="keepBtn">Keep hand</button></div>`, { noClose: true, onClick: e => { const c = e.target.closest('[data-oid]'); if (c) inspect(G.byId(+c.dataset.oid), true); } });
      $('#keepBtn').onclick = () => answer(true);
      $('#mullBtn').onclick = () => answer(false);
      return;
    }
    if (t === 'yesno') {
      openSheet(`<div class="sheet-head"><h3>${esc(req.prompt)}</h3></div>${req.card ? `<div class="tiles">${tileHTML(req.card, { big: true })}</div>` : ''}<div class="sheet-actions"><button class="btn" id="noBtn">No</button><button class="btn primary" id="yesBtn">Yes</button></div>`, { noClose: true });
      $('#yesBtn').onclick = () => answer(true);
      $('#noBtn').onclick = () => answer(false);
      return;
    }
    if (t === 'x') {
      openSheet(`<div class="sheet-head"><h3>${esc(req.prompt)}</h3><div class="muted">You can afford up to X = ${req.max}.</div></div>
        <div class="xpick"><button class="btn" id="xm">−</button><output id="xv">${req.max}</output><button class="btn" id="xp">+</button></div>
        <div class="sheet-actions"><button class="btn ghost" id="xc">Cancel</button><button class="btn primary" id="xok">Confirm</button></div>`, { noClose: true });
      let v = req.max;
      const upd = () => { $('#xv').textContent = v; };
      $('#xm').onclick = () => { v = Math.max(0, v - 1); upd(); };
      $('#xp').onclick = () => { v = Math.min(req.max, v + 1); upd(); };
      $('#xok').onclick = () => answer(v);
      $('#xc').onclick = () => answer(null);
      return;
    }
    if (t === 'modes') {
      const sel = new Set();
      const draw = () => {
        openSheet(`<div class="sheet-head"><h3>Choose ${req.min === req.max ? req.max : `${req.min}–${req.max}`} mode${req.max > 1 ? 's' : ''}</h3><div class="muted">${esc(req.item.obj.name)}</div></div>
          <div class="modes-list">${req.options.map((o, i) => `<button class="modeopt ${sel.has(i) ? 'on' : ''}" data-i="${i}">${esc(modeText(req.item.obj, o, i))}</button>`).join('')}</div>
          <div class="sheet-actions"><button class="btn ghost" id="mc">Cancel</button><button class="btn primary" id="mok" ${sel.size >= req.min && sel.size <= req.max ? '' : 'disabled'}>Confirm</button></div>`, { noClose: true, onClick: e => { const b = e.target.closest('[data-i]'); if (!b) return; const i = +b.dataset.i; if (sel.has(i)) sel.delete(i); else { if (sel.size >= req.max) sel.delete([...sel][0]); sel.add(i); } draw(); } });
        $('#mok').onclick = () => answer([...sel].map(i => req.options[i]));
        $('#mc').onclick = () => answer(null);
      };
      draw();
      return;
    }
    if (t === 'scry') {
      const bottom = new Set();
      const draw = () => {
        openSheet(`<div class="sheet-head"><h3>${req.surveil ? 'Surveil' : 'Scry'} ${req.cards.length}</h3><div class="muted">Tap a card to send it ${req.surveil ? 'to your graveyard' : 'to the bottom'}. The rest stay on top in this order.</div></div>
          <div class="tiles">${req.cards.map(o => `<div class="scrywrap ${bottom.has(o) ? 'down' : ''}">${tileHTML(o, { big: true })}<span class="scrylbl">${bottom.has(o) ? (req.surveil ? 'Graveyard' : 'Bottom') : 'Top'}</span></div>`).join('')}</div>
          <div class="sheet-actions"><button class="btn primary" id="sok">Done</button></div>`, { noClose: true, onClick: e => { const c = e.target.closest('[data-oid]'); if (!c) return; const o = G.byId(+c.dataset.oid); bottom.has(o) ? bottom.delete(o) : bottom.add(o); draw(); } });
        $('#sok').onclick = () => answer({ top: req.cards.filter(o => !bottom.has(o)), bottom: [...bottom] });
      };
      draw();
      return;
    }
    if (t === 'chooseCards') {
      const sel = new Set();
      const onBoard = req.cards.every(o => o.zone === 'battlefield');
      if (onBoard && req.purpose !== 'search') { renderGame(); return; } // board selection mode
      const draw = () => {
        const ok = sel.size >= req.min && sel.size <= req.max && (req.purpose !== 'crew' || [...sel].reduce((a, o) => a + M.power(o), 0) >= req.need);
        const cards = req.cards.slice().sort((a, b) => a.name.localeCompare(b.name));
        openSheet(`<div class="sheet-head"><h3>${esc(req.prompt)}</h3><div class="muted">${req.min === req.max ? `Choose ${req.min}` : `Choose ${req.min ? req.min + '–' : 'up to '}${req.max}`} · ${sel.size} selected</div></div>
          ${req.reveal ? `<div class="muted small">Their hand: ${req.reveal.map(o => esc(o.name)).join(', ')}</div>` : ''}
          <div class="tiles ${cards.length > 12 ? 'dense' : ''}">${cards.map(o => `<div class="selwrap ${sel.has(o) ? 'on' : ''}">${tileHTML(o, { big: cards.length <= 12 })}</div>`).join('')}</div>
          <div class="sheet-actions">${req.min === 0 ? '<button class="btn ghost" id="cnone">Choose none</button>' : ''}<button class="btn primary" id="cok" ${ok ? '' : 'disabled'}>Confirm</button></div>`, { noClose: true, wide: true, onClick: e => { const c = e.target.closest('[data-oid]'); if (!c) return; const o = G.byId(+c.dataset.oid); if (sel.has(o)) sel.delete(o); else { if (sel.size >= req.max) sel.delete([...sel][0]); sel.add(o); } draw(); } });
        $('#cok').onclick = () => answer([...sel]);
        const cn = $('#cnone'); if (cn) cn.onclick = () => answer([]);
      };
      draw();
      return;
    }
    if (t === 'targets') {
      const offBoard = req.candidates.some(c => !c.isPlayer && !c.isStackItem && c.zone !== 'battlefield');
      if (!offBoard) { renderGame(); return; }
      const sel = new Set();
      const draw = () => {
        openSheet(`<div class="sheet-head"><h3>${esc(req.prompt)}</h3><div class="muted">${sel.size}/${req.max} chosen</div></div>
          <div class="tiles ${req.candidates.length > 12 ? 'dense' : ''}">${req.candidates.map(c => c.isPlayer ? `<button class="ptile ${sel.has(c) ? 'on' : ''}" data-pid="${c.id}">${esc(c.name)}</button>` : `<div class="selwrap ${sel.has(c) ? 'on' : ''}">${tileHTML(c, { big: req.candidates.length <= 12, showZone: true })}</div>`).join('')}</div>
          <div class="sheet-actions"><button class="btn ghost" id="tc">Cancel</button><button class="btn primary" id="tok" ${sel.size >= req.min ? '' : 'disabled'}>Confirm</button></div>`, { noClose: true, wide: true, onClick: e => { const c = e.target.closest('[data-oid],[data-pid]'); if (!c) return; const x = c.dataset.pid != null ? G.players[+c.dataset.pid] : G.byId(+c.dataset.oid); if (sel.has(x)) sel.delete(x); else { if (sel.size >= req.max) sel.delete([...sel][0]); sel.add(x); } draw(); } });
        $('#tok').onclick = () => answer([...sel]);
        $('#tc').onclick = () => answer(null);
      };
      draw();
    }
  }
  function modeText(o, node, i) {
    const lines = o.face.oracle.split('\n').filter(l => /^[•●]/.test(l.trim()));
    if (lines[i]) return lines[i].replace(/^[•●]\s*/, '');
    return node.api;
  }

  // ---------------------------------------------------------------- rendering
  let rq = false;
  function scheduleRender() { if (rq) return; rq = true; requestAnimationFrame(() => { rq = false; if (G) renderGame(); }); }

  function tileHTML(o, opts) {
    opts = opts || {};
    const f = o.face;
    const bf = o.zone === 'battlefield';
    const cls = ['tile', colorClass(bf ? o : null, f)];
    if (opts.big) cls.push('big');
    if (bf && o.tapped) cls.push('tapped');
    if (opts.hl) cls.push('hl');
    if (opts.sel) cls.push('sel');
    if (opts.playable) cls.push('playable');
    if (bf && o.attacking) cls.push('attacking');
    if (bf && o.blocking.length) cls.push('blocking');
    let pt = '';
    if (bf && M.isCreature(o)) {
      const p = M.power(o), t = M.toughness(o);
      const bp = parseInt(f.power, 10), bt = parseInt(f.toughness, 10);
      pt = `<span class="t-pt ${p > bp || t > bt ? 'up' : (p < bp || t < bt ? 'down' : '')}">${p}/${t - o.damage}${o.damage ? '<i>*</i>' : ''}</span>`;
    } else if (f.power != null && !bf) pt = `<span class="t-pt">${esc(f.power)}/${esc(f.toughness)}</span>`;
    let loy = '';
    if (bf && M.hasType(o, 'Planeswalker')) loy = `<span class="t-loy">${o.counters.LOYALTY || 0}</span>`;
    else if (!bf && f.loyalty != null) loy = `<span class="t-loy">${f.loyalty}</span>`;
    const badges = [];
    if (bf) {
      for (const [k, v] of Object.entries(o.counters)) if (v && k !== 'LOYALTY' && k !== 'LORE') badges.push(`<b class="bdg">${k === 'P1P1' ? '+' + v : k === 'M1M1' ? '−' + v : v + ' ' + k.slice(0, 3).toLowerCase()}</b>`);
      if (o.counters.LORE) badges.push(`<b class="bdg">${o.counters.LORE} lore</b>`);
      if (o.sickness && M.isCreature(o) && !M.hasKW(o, 'Haste') && o.controller === G.active) badges.push('<b class="bdg zz">zz</b>');
      const kws = ['Flying', 'Deathtouch', 'Lifelink', 'Trample', 'First Strike', 'Double Strike', 'Vigilance', 'Haste', 'Hexproof', 'Indestructible', 'Menace', 'Reach', 'Defender'].filter(k => M.isCreature(o) && M.hasKW(o, k));
      if (kws.length) badges.push(`<b class="bdg kw">${kws.map(k => KW_ABBR[k]).join('')}</b>`);
      if (G.battlefield.some(x => x.attachedTo === o.id)) badges.push('<b class="bdg att">⚭</b>');
    }
    const typeShort = (f.raw.t || '').replace(/Legendary /, '').replace(/ — .*/, '');
    const art = M.Art && M.Art.isOn() ? M.Art.forObj(o, true) : null;
    const zoneTag = `${opts.showZone && o.zone !== 'battlefield' ? `<div class="t-zone">${esc(o.owner.name)} · ${o.zone}</div>` : ''}${bf && o.attacking && !o.attacking.isPlayer ? `<div class="t-zone">→ ${esc(o.attacking.name)}</div>` : ''}`;
    if (art && opts.big && safeUrl(art.full)) {
      cls.push('imgcard');
      return `<div class="${cls.join(' ')}" data-oid="${o.id}" title="${esc(f.name)}"><img src="${safeUrl(art.full)}" alt="${esc(f.name)}" loading="lazy" decoding="async"><div class="t-bot">${badges.join('')}${bf ? pt + loy : ''}</div>${zoneTag}</div>`;
    }
    if (art && safeUrl(art.crop)) {
      cls.push('has-art');
      return `<div class="${cls.join(' ')}" data-oid="${o.id}" title="${esc(f.name)}${art.artist ? ' · Art by ' + esc(art.artist) : ''}">
      <div class="t-top"><span class="t-name">${esc(f.name)}</span></div>
      <div class="t-art" style="background-image:url('${safeUrl(art.crop)}')"></div>
      <div class="t-mid">${f.types.includes('Land') ? landPips(o) : costHTML(f.cost)}</div>
      <div class="t-bot">${badges.join('')}${pt}${loy}</div>
      ${zoneTag}
    </div>`;
    }
    return `<div class="${cls.join(' ')}" data-oid="${o.id}" title="${esc(f.name)}">
      <div class="t-top"><span class="t-name">${esc(f.name)}</span></div>
      ${opts.big ? `<div class="t-cost">${costHTML(f.cost)}</div><div class="t-type">${esc(f.raw.t || '')}</div><div class="t-text">${oracleHTML(f.oracle.length > 180 ? f.oracle.slice(0, 170) + '…' : f.oracle)}</div>` : `<div class="t-mid">${f.types.includes('Land') ? landPips(o) : costHTML(f.cost)}</div><div class="t-type">${esc(typeShort)}</div>`}
      <div class="t-bot">${badges.join('')}${pt}${loy}</div>
      ${opts.showZone && o.zone !== 'battlefield' ? `<div class="t-zone">${esc(o.owner.name)} · ${o.zone}</div>` : ''}
      ${bf && o.attacking && !o.attacking.isPlayer ? `<div class="t-zone">→ ${esc(o.attacking.name)}</div>` : ''}
    </div>`;
  }
  const KW_ABBR = { Flying: '🜁', Deathtouch: '☠', Lifelink: '♥', Trample: '⇶', 'First Strike': '⚔', 'Double Strike': '⚔⚔', Vigilance: '◉', Haste: '»', Hexproof: '⛉', Indestructible: '◆', Menace: '⚠', Reach: '↟', Defender: '▣' };
  function landPips(o) {
    const s = new Set();
    for (const [t, c] of Object.entries(M.BASIC_MANA)) if (o.face.sub.includes(t)) s.add(c);
    for (const ab of o.face.abilities) if (ab.p.API === 'Mana' || ab.p.API === 'ManaReflected') { const pr = ab.p.Produced || 'Any'; if (/Any|ColorIdentity/.test(pr) || ab.p.API === 'ManaReflected') s.add('★'); else pr.replace('Combo', '').trim().split(/\s+/).forEach(c => s.add(c)); }
    return [...s].map(c => c === '★' ? '<span class="pip p-H">✶</span>' : pip(c)).join('');
  }

  function actionsFor(o) {
    const p = UI.pending;
    if (!p || p.req.type !== 'priority') return [];
    return (p.req.acts || []).filter(a => a.card === o);
  }

  function boardMode() {
    const p = UI.pending;
    if (!p) return null;
    const t = p.req.type;
    if (t === 'attackers' || t === 'blockers') return t;
    if (t === 'targets' && !p.req.candidates.some(c => !c.isPlayer && !c.isStackItem && c.zone !== 'battlefield')) return 'targets';
    if (t === 'chooseCards' && p.req.cards.every(o => o.zone === 'battlefield') && p.req.purpose !== 'search') return 'choose';
    if (t === 'priority') return 'priority';
    return null;
  }

  function renderGame() {
    if (!G) return;
    const me = G.players[0], ai = G.players[1];
    const mode = boardMode();
    const req = UI.pending && UI.pending.req;
    const hlSet = new Set();
    const selSet = new Set(UI.sel);
    if (mode === 'targets') req.candidates.forEach(c => hlSet.add(c));
    if (mode === 'choose') req.cards.forEach(c => hlSet.add(c));
    if (mode === 'attackers') req.candidates.forEach(c => hlSet.add(c));
    if (mode === 'blockers') { req.candidates.forEach(c => hlSet.add(c)); req.attackers.forEach(c => hlSet.add(c)); }
    if (mode === 'attackers') for (const a of UI.attacks.keys()) selSet.add(a);
    if (mode === 'blockers') { for (const b of UI.blocks) selSet.add(b.blocker); if (UI.blockerSel) selSet.add(UI.blockerSel); }
    const playable = new Set();
    if (mode === 'priority') for (const a of req.acts || []) playable.add(a.card);

    const bfHTML = (pl) => {
      const mine = G.battlefield.filter(o => o.controller === pl);
      const lands = mine.filter(o => M.isLand(o) && !M.isCreature(o));
      const creatures = mine.filter(o => M.isCreature(o));
      const others = mine.filter(o => !M.isLand(o) && !M.isCreature(o) && !(o.attachedTo && G.byId(o.attachedTo) && G.byId(o.attachedTo).zone === 'battlefield' && M.hasType(o, 'Aura')));
      const t = o => tileHTML(o, { hl: hlSet.has(o), sel: selSet.has(o), playable: playable.has(o) });
      const landGroups = groupLands(lands, hlSet, selSet, playable);
      return `<div class="row creatures">${creatures.map(t).join('') || '<span class="empty">No creatures</span>'}</div>
        ${others.length ? `<div class="row others">${others.map(t).join('')}</div>` : ''}
        <div class="row lands">${landGroups}</div>`;
    };
    const blockLines = mode === 'blockers' ? UI.blocks.map(b => `${esc(b.blocker.name)} → ${esc(b.attacker.name)}`).join(' · ') : '';
    const stackHTML = G.stack.length ? `<div class="stack">${G.stack.slice().reverse().map((s, i) => `<button class="stk ${s.controller.id === 0 ? 'me' : 'ai'} ${hlSet.has(s) ? 'hl' : ''} ${selSet.has(s) ? 'sel' : ''}" data-sid="${s.id}"><span class="stk-who">${s.controller.id === 0 ? 'You' : 'AI'}</span><span class="stk-what">${esc(M.describeItem(G, s))}</span>${i === 0 ? '<span class="stk-top">resolves next</span>' : ''}</button>`).join('')}</div>` : '';
    const lastLogs = UI.log.slice(-3).reverse();
    $('#app').innerHTML = `
    <div class="table">
      ${playerBar(ai, false, hlSet, selSet)}
      <section class="bf bf-ai">${bfHTML(ai)}</section>
      <div class="midline">
        ${phaseBar()}
        ${stackHTML}
        <div class="ticker">${lastLogs.map((l, i) => `<div class="tk ${l.cls} ${i ? 'old' : ''}">${esc(l.msg)}</div>`).join('')}</div>
      </div>
      <section class="bf bf-me">${bfHTML(me)}</section>
      ${playerBar(me, true, hlSet, selSet)}
      <section class="hand">${me.hand.map(o => tileHTML(o, { playable: playable.has(o), hl: hlSet.has(o), sel: selSet.has(o) })).join('') || '<span class="empty">Your hand is empty</span>'}</section>
      <div class="prompt">${promptHTML(mode, req, blockLines)}</div>
      <button class="logbtn" id="logBtn" aria-label="Game log">Log</button>
      <button class="menubtn" id="menuBtn" aria-label="Menu">☰</button>
      ${UI.showLog ? `<aside class="logpane"><div class="lp-head"><b>Game log</b><button class="btn ghost sm" id="logClose">Close</button></div><div class="lp-body">${UI.log.slice().reverse().map(l => `<div class="lg ${l.cls}">${esc(l.msg)}</div>`).join('')}</div></aside>` : ''}
    </div>`;
    bindGame(mode, req);
  }

  function groupLands(lands, hlSet, selSet, playable) {
    // group identical, untouched lands into stacks
    const groups = [];
    const map = new Map();
    for (const o of lands) {
      const special = hlSet.has(o) || selSet.has(o) || playable.has(o) || Object.keys(o.counters).some(k => o.counters[k]) || G.battlefield.some(x => x.attachedTo === o.id);
      const key = special ? 'u' + o.id : o.name + '|' + o.tapped;
      if (!map.has(key)) { map.set(key, []); groups.push(key); }
      map.get(key).push(o);
    }
    return groups.map(k => {
      const g = map.get(k);
      const o = g[0];
      return `<div class="lstack" data-n="${g.length}">${tileHTML(o, { hl: hlSet.has(o), sel: selSet.has(o), playable: playable.has(o) })}${g.length > 1 ? `<span class="lcount">×${g.length}</span>` : ''}</div>`;
    }).join('') || '<span class="empty">No lands</span>';
  }

  function playerBar(pl, isMe, hlSet, selSet) {
    const active = G.active === pl;
    const cmd = pl.command.filter(o => !o.emblem);
    const cmdDmg = Object.entries(pl.cmdDamage).filter(([, v]) => v > 0).map(([id, v]) => `${v}`).join('/');
    return `<div class="pbar ${isMe ? 'me' : 'ai'} ${active ? 'active' : ''}">
      <button class="pl-life ${hlSet.has(pl) ? 'hl' : ''} ${selSet.has(pl) ? 'sel' : ''}" data-pid="${pl.id}"><span class="pl-name">${esc(pl.name)}</span><span class="life">${pl.life}</span></button>
      <div class="pl-zones">
        ${!isMe ? `<span class="zc" title="Cards in hand">✋ ${pl.hand.length}</span>` : ''}
        <span class="zc" title="Library">▤ ${pl.library.length}</span>
        <button class="zc zbtn" data-zone="graveyard" data-zp="${pl.id}" title="Graveyard">⚰ ${pl.graveyard.length}</button>
        ${pl.exile.length ? `<button class="zc zbtn" data-zone="exile" data-zp="${pl.id}" title="Exile">⊘ ${pl.exile.length}</button>` : ''}
        ${pl.poison ? `<span class="zc poison" title="Poison">☣ ${pl.poison}</span>` : ''}
        ${cmdDmg ? `<span class="zc cmd" title="Commander damage taken">⚔ ${cmdDmg}</span>` : ''}
        ${Object.values(pl.pool).some(v => v) ? `<span class="zc pool">${Object.entries(pl.pool).filter(([, v]) => v).map(([c, v]) => pip(c).repeat(v)).join('')}</span>` : ''}
      </div>
      <div class="cmdzone">${cmd.map(o => `<button class="cmdchip ${colorClass(null, o.face)} ${UI.pending && UI.pending.req.type === 'priority' && (UI.pending.req.acts || []).some(a => a.card === o) ? 'playable' : ''}" data-oid="${o.id}"><span>${esc(o.name)}</span>${pl.cmdCasts[o.id] ? `<i>+${2 * pl.cmdCasts[o.id]}</i>` : ''}</button>`).join('')}</div>
    </div>`;
  }

  function phaseBar() {
    const steps = [['upkeep', 'Upkp'], ['draw', 'Draw'], ['main1', 'Main'], ['attackers', 'Atk'], ['blockers', 'Blk'], ['damage', 'Dmg'], ['main2', 'Main 2'], ['end', 'End']];
    const cur = G.step === 'firstStrike' ? 'damage' : G.step === 'beginCombat' ? 'attackers' : G.step === 'endCombat' ? 'damage' : G.step === 'cleanup' ? 'end' : G.step === 'untap' ? 'upkeep' : G.step;
    return `<div class="phases ${G.active && G.active.id === 0 ? 'mine' : 'theirs'}"><span class="turnlbl">T${G.turn} · ${G.active ? (G.active.id === 0 ? 'Your turn' : "Computer's turn") : ''}</span>${steps.map(([k, l]) => `<span class="ph ${k === cur ? 'on' : ''}">${l}</span>`).join('')}</div>`;
  }

  function promptHTML(mode, req, blockLines) {
    if (G.over) return `<div class="pmsg">Game over.</div><div class="pbtns"><button class="btn primary" id="pNew">New game</button></div>`;
    if (!req) return `<div class="pmsg wait">${G.active && G.active.id === 1 ? 'Computer is thinking…' : 'Resolving…'}</div>`;
    const t = req.type;
    if (mode === 'priority') {
      const top = G.stack[G.stack.length - 1];
      let msg, btn;
      if (top) { msg = `${top.controller.id === 0 ? 'Your' : "Computer's"} ${top.kind === 'spell' ? top.face.name : 'ability'} is on the stack. Respond, or let it resolve.`; btn = 'Let it resolve'; }
      else if (G.active.id === 0 && G.step === 'main1') { msg = 'Your main phase. Tap a glowing card to play it.'; btn = G.battlefield.some(o => G.canAttack(o)) ? 'Go to combat' : 'End turn'; }
      else if (G.active.id === 0 && G.step === 'main2') { msg = 'Second main phase.'; btn = 'End turn'; }
      else if (G.active.id === 1 && G.step === 'attackers') { msg = 'The computer is attacking. Cast instants now, or continue to blocks.'; btn = 'Continue'; }
      else if (G.step === 'blockers') { msg = 'Blocks are set. Last chance for combat tricks.'; btn = 'To damage'; }
      else if (G.active.id === 1 && G.step === 'end') { msg = "Computer's end step. Cast instants now, or pass."; btn = 'Pass'; }
      else { msg = `${M.STEP_NAMES[G.step]}.`; btn = 'Continue'; }
      return `<div class="pmsg">${esc(msg)}</div><div class="pbtns"><label class="stopall"><input type="checkbox" id="stopAll" ${UI.stopAll ? 'checked' : ''}> Stop at every step</label><button class="btn primary" id="pPass">${btn}</button></div>`;
    }
    if (t === 'attackers') {
      const n = UI.attacks.size;
      return `<div class="pmsg">Declare attackers: tap creatures to attack${req.defenders.length > 1 ? ' (tap again to aim at a planeswalker)' : ''}.</div><div class="pbtns"><button class="btn ghost" id="aAll">All</button><button class="btn" id="aNone">No attack</button><button class="btn primary" id="aOk" ${n ? '' : 'disabled'}>Attack with ${n}</button></div>`;
    }
    if (t === 'blockers') {
      const inc = req.attackers.filter(a => a.attacking === G.players[0]).reduce((s, a) => s + Math.max(0, M.power(a)), 0);
      return `<div class="pmsg">${UI.blockerSel ? `Now tap the attacker ${esc(UI.blockerSel.name)} should block.` : `Blocks: tap your creature, then an attacker. Incoming: ${inc} damage.`}${blockLines ? `<div class="blines">${blockLines}</div>` : ''}</div><div class="pbtns"><button class="btn" id="bClear" ${UI.blocks.length ? '' : 'disabled'}>Clear</button><button class="btn primary" id="bOk">${UI.blocks.length ? 'Confirm blocks' : 'No blocks'}</button></div>`;
    }
    if (mode === 'targets') {
      return `<div class="pmsg">${esc(req.prompt)} <b>${UI.sel.length}/${req.max}</b></div><div class="pbtns"><button class="btn ghost" id="tCancel">Cancel</button><button class="btn primary" id="tOk" ${UI.sel.length >= req.min ? '' : 'disabled'}>Confirm</button></div>`;
    }
    if (mode === 'choose') {
      const crewOk = req.purpose !== 'crew' || UI.sel.reduce((a, o) => a + M.power(o), 0) >= req.need;
      return `<div class="pmsg">${esc(req.prompt)} <b>${UI.sel.length}/${req.max}</b></div><div class="pbtns">${req.min === 0 ? '<button class="btn ghost" id="cNone">None</button>' : ''}<button class="btn primary" id="cOk" ${UI.sel.length >= req.min && UI.sel.length <= req.max && crewOk ? '' : 'disabled'}>Confirm</button></div>`;
    }
    return `<div class="pmsg">Make your choice.</div><div class="pbtns"><button class="btn" id="reopen">Show choice</button></div>`;
  }

  // ---------------------------------------------------------------- interactions
  let pressTimer = null, longPressed = false;
  function bindGame(mode, req) {
    const app = $('#app');
    app.onclick = e => {
      if (longPressed) { longPressed = false; return; }
      const zb = e.target.closest('[data-zone]');
      if (zb) { showZone(G.players[+zb.dataset.zp], zb.dataset.zone); return; }
      const pc = e.target.closest('[data-pid]');
      const oc = e.target.closest('[data-oid]');
      const sc = e.target.closest('[data-sid]');
      if (mode === 'targets') {
        let thing = null;
        if (pc) thing = G.players[+pc.dataset.pid];
        else if (oc) thing = G.byId(+oc.dataset.oid);
        else if (sc) thing = G.stack.find(s => s.id === +sc.dataset.sid);
        if (thing && req.candidates.includes(thing)) {
          const i = UI.sel.indexOf(thing);
          if (i >= 0) UI.sel.splice(i, 1); else { if (UI.sel.length >= req.max) UI.sel.shift(); UI.sel.push(thing); }
          if (req.max === 1 && req.min === 1 && UI.sel.length === 1) { answer(UI.sel.slice()); return; }
          renderGame(); return;
        }
        if (oc) { inspect(G.byId(+oc.dataset.oid)); return; }
        return;
      }
      if (mode === 'choose') {
        if (oc) { const o = G.byId(+oc.dataset.oid); if (req.cards.includes(o)) { const i = UI.sel.indexOf(o); if (i >= 0) UI.sel.splice(i, 1); else { if (UI.sel.length >= req.max) UI.sel.shift(); UI.sel.push(o); } renderGame(); return; } inspect(o); }
        return;
      }
      if (mode === 'attackers') {
        if (oc) {
          const o = G.byId(+oc.dataset.oid);
          if (req.candidates.includes(o)) {
            const defs = req.defenders;
            if (!UI.attacks.has(o)) UI.attacks.set(o, defs[0]);
            else { const i = defs.indexOf(UI.attacks.get(o)); if (i + 1 < defs.length) UI.attacks.set(o, defs[i + 1]); else UI.attacks.delete(o); }
            o._aimLabel = UI.attacks.has(o) && !UI.attacks.get(o).isPlayer ? UI.attacks.get(o).name : null;
            renderGame(); return;
          }
          inspect(o);
        }
        return;
      }
      if (mode === 'blockers') {
        if (oc) {
          const o = G.byId(+oc.dataset.oid);
          if (req.candidates.includes(o) && o.controller.id === 0) {
            const ex = UI.blocks.findIndex(b => b.blocker === o);
            if (ex >= 0) { UI.blocks.splice(ex, 1); UI.blockerSel = null; }
            else UI.blockerSel = UI.blockerSel === o ? null : o;
            renderGame(); return;
          }
          if (req.attackers.includes(o) && UI.blockerSel) {
            if (G.canBlock(UI.blockerSel, o)) { UI.blocks.push({ blocker: UI.blockerSel, attacker: o }); UI.blockerSel = null; renderGame(); }
            else flash(`${UI.blockerSel.name} can't block ${o.name}.`);
            return;
          }
          inspect(o);
        }
        return;
      }
      if (oc) { inspect(G.byId(+oc.dataset.oid)); return; }
      if (sc) { const s = G.stack.find(x => x.id === +sc.dataset.sid); if (s) inspect(s.obj, false, s); }
    };
    app.onpointerdown = e => {
      const oc = e.target.closest('[data-oid]');
      if (!oc) return;
      clearTimeout(pressTimer);
      pressTimer = setTimeout(() => { longPressed = true; inspect(G.byId(+oc.dataset.oid), true); }, 520);
    };
    app.onpointerup = app.onpointercancel = app.onpointerleave = () => clearTimeout(pressTimer);
    const on = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };
    on('pPass', e => { if (G.step === 'main1' && G.active.id === 0 && /End turn/.test(e.target.textContent)) UI.endTurn = G.turn; answer({ kind: 'pass' }); });
    on('stopAll', e => { UI.stopAll = e.target.checked; });
    on('aAll', () => { for (const c of req.candidates) UI.attacks.set(c, req.defenders[0]); renderGame(); });
    on('aNone', () => answer([]));
    on('aOk', () => answer([...UI.attacks].map(([attacker, defender]) => ({ attacker, defender }))));
    on('bClear', () => { UI.blocks = []; UI.blockerSel = null; renderGame(); });
    on('bOk', () => answer(UI.blocks.slice()));
    on('tCancel', () => answer(null));
    on('tOk', () => answer(UI.sel.slice()));
    on('cNone', () => answer([]));
    on('cOk', () => answer(UI.sel.slice()));
    on('reopen', () => openPromptSheet(req));
    on('pNew', () => renderSetup());
    on('logBtn', () => { UI.showLog = !UI.showLog; renderGame(); });
    on('logClose', () => { UI.showLog = false; renderGame(); });
    on('menuBtn', openMenu);
  }

  function flash(msg) {
    document.querySelectorAll('.toast.flash').forEach(t => t.remove());
    const el = document.createElement('div'); el.className = 'toast flash'; el.textContent = msg; document.body.appendChild(el);
    setTimeout(() => el.remove(), 1800);
  }

  function inspect(o, force, item) {
    if (!o) return;
    const acts = actionsFor(o);
    let html = cardDetailHTML(o);
    if (item) html = `<div class="bc-state">On the stack: ${esc(M.describeItem(G, item))}</div>` + html;
    if (acts.length) html += `<div class="acts">${acts.map((a, i) => `<button class="btn ${a.kind === 'land' || a.kind === 'cast' ? 'primary' : ''}" data-act="${i}">${esc(a.label)}</button>`).join('')}</div>`;
    else if (UI.pending && UI.pending.req.type === 'priority' && o.controller === G.players[0] && (o.zone === 'hand' || o.zone === 'battlefield' || o.zone === 'command')) html += `<div class="muted small acts-none">${whyNot(o)}</div>`;
    openSheet(html, { onClick: e => { const b = e.target.closest('[data-act]'); if (!b) return; const a = acts[+b.dataset.act]; closeSheet(); answer(a); } });
  }
  function whyNot(o) {
    if (o.zone === 'hand' && M.isLand(o)) return G.players[0].landsPlayed ? "You've already played a land this turn." : 'Lands can only be played in your main phase with an empty stack.';
    if (o.zone === 'hand' || o.zone === 'command') return "You can't cast this right now (timing, mana, or no legal targets).";
    return 'No abilities available right now.';
  }
  function showZone(pl, zone) {
    const cards = pl[zone].slice().reverse();
    openSheet(`<div class="sheet-head"><h3>${esc(pl.name)} · ${zone}</h3><div class="muted">${cards.length} card${cards.length === 1 ? '' : 's'}${zone === 'graveyard' ? ', most recent first' : ''}</div></div><div class="tiles ${cards.length > 12 ? 'dense' : ''}">${cards.map(o => tileHTML(o, { big: cards.length <= 12, playable: actionsFor(o).length > 0 })).join('') || '<span class="muted">Empty</span>'}</div>`, { wide: true, onClick: e => { const c = e.target.closest('[data-oid]'); if (c) inspect(G.byId(+c.dataset.oid)); } });
  }
  function openMenu() {
    const unsup = [...G.unsupported];
    openSheet(`<div class="sheet-head"><h3>Game menu</h3><div class="muted">${esc(G.players[0].deck.name)} vs ${esc(G.players[1].deck.name)}</div></div>
      <div class="menu-list">
        <button class="btn" id="mConcede">Concede and choose new decks</button>
        <button class="btn" id="mRestart">Restart this matchup</button>
        <label class="stopall"><input type="checkbox" id="mStop" ${UI.stopAll ? 'checked' : ''}> Stop at every step (full priority control)</label>
        ${M.Art && M.Art.enabled ? `<label class="stopall"><input type="checkbox" id="mArt" ${M.Art.isOn() ? 'checked' : ''}> Show card art</label>` : ''}
      </div>
      <div class="help"><h4>How to play</h4><ul>
        <li>Glowing cards can be played. Tap a card to see it and its actions; press and hold any card to read it.</li>
        <li>Mana is tapped for you automatically, picking the lands you're least likely to need.</li>
        <li>Combat: tap creatures to attack. To block, tap your creature, then the attacker.</li>
        <li>The game stops for you when you can respond to the computer. Turn on "stop at every step" for full control.</li>
      </ul>
      ${unsup.length ? `<p class="muted small">Some rare card mechanics in this game aren't implemented yet and were skipped: ${esc(unsup.join(', '))}.</p>` : ''}</div>`);
    $('#mConcede').onclick = () => { closeSheet(); const p = UI.pending; G.over = true; UI.pending = null; renderSetup(); };
    $('#mRestart').onclick = () => { closeSheet(); G.over = true; UI.pending = null; S.theirs = G.players[1].deck; startGame(); };
    $('#mStop').onchange = e => { UI.stopAll = e.target.checked; };
    const ma = $('#mArt'); if (ma) ma.onchange = e => { M.Art.setOn(e.target.checked); renderGame(); };
  }

  M.UIH = { esc, pip, costHTML, oracleHTML, openSheet, closeSheet, cardDetailHTML, flash, renderSetup, ensureAll, customView, S, data: () => DATA };
  window.addEventListener('DOMContentLoaded', boot);
})(MTG);

/* MTG — deck builder and importer screens. Uses helpers exported by ui.js as M.UIH. */
(function (M) {

  const GROUP_ORDER = ['Creatures', 'Planeswalkers', 'Instants & sorceries', 'Artifacts & enchantments', 'Other', 'Lands'];
  const BASICS = [['W', 'Plains'], ['U', 'Island'], ['B', 'Swamp'], ['R', 'Mountain'], ['G', 'Forest'], ['C', 'Wastes']];
  const TYPES = [['', 'Any type'], ['Creature', 'Creature'], ['Instant', 'Instant'], ['Sorcery', 'Sorcery'], ['Artifact', 'Artifact'], ['Enchantment', 'Enchantment'], ['Planeswalker', 'Planeswalker'], ['Land', 'Land'], ['Battle', 'Battle'], ['Legendary', 'Legendary'], ['commander', 'Can be a commander']];

  let B = null; // builder state
  let saveTimer = null;

  // ---------------------------------------------------------------- entry points
  M.Builder = {
    async open(deck, opts) {
      opts = opts || {};
      await H().ensureAll();
      deck = D.clone(deck);
      B = {
        deck, tab: 'deck', results: [], limit: 60,
        f: { q: '', colors: new Set(), type: '', mv: '', std: deck.mode !== 'commander', inId: true },
        saved: D.store.get(deck.id) ? 'saved' : 'new', issuesOpen: false,
      };
      if (deck.mode === 'commander' && !deck.commander.length) { B.f.type = 'commander'; B.tab = 'search'; }
      if (!deck.main.length && deck.mode !== 'commander') B.tab = 'search';
      render();
      if (opts.importResult) showImportResult(opts.importResult);
      if (B.saved === 'new') queueSave(0);
    },
    async openImport(intoDeck) { await H().ensureAll(); importSheet(intoDeck || null); },
    async newDeck(mode) { await M.Builder.open(D.blank(mode)); },
    isOpen: () => !!B,
  };

  // ---------------------------------------------------------------- saving
  function queueSave(delay) {
    B.saved = 'saving';
    renderSaveState();
    clearTimeout(saveTimer);
    const deck = B.deck;
    saveTimer = setTimeout(async () => {
      const where = await D.store.save(deck);
      if (B && B.deck === deck) { B.saved = where; renderSaveState(); }
    }, delay == null ? 600 : delay);
  }
  function changed() { queueSave(); renderDeck(); renderStatus(); renderResults(); }
  function saveLabel() {
    switch (B.saved) {
      case 'saving': return 'Saving…';
      case 'cloud': return 'Saved to your account';
      case 'local': return 'Saved in this browser';
      case 'memory': return 'Not saved: this browser is blocking storage';
      case 'saved': return D.store.mode === 'cloud' ? 'Saved to your account' : 'Saved in this browser';
      default: return '';
    }
  }
  function renderSaveState() { const el = $('#bdSaved'); if (el) { el.textContent = saveLabel(); el.classList.toggle('warn', B.saved === 'memory'); } }

  // ---------------------------------------------------------------- render
  function render() {
    const { esc } = H();
    const d = B.deck;
    document.body.classList.remove('in-game');
    $('#app').innerHTML = `
    <div class="builder tab-${B.tab}">
      <header class="bd-head">
        <button class="btn ghost sm" id="bdBack">‹ Decks</button>
        <input id="bdName" class="bd-name" value="${esc(d.name)}" aria-label="Deck name" maxlength="80" autocomplete="off">
        <div class="seg" role="radiogroup" aria-label="Format">
          <button class="${d.mode === 'constructed' ? 'on' : ''}" data-fmt="constructed" role="radio" aria-checked="${d.mode === 'constructed'}">Standard</button>
          <button class="${d.mode === 'commander' ? 'on' : ''}" data-fmt="commander" role="radio" aria-checked="${d.mode === 'commander'}">Commander</button>
        </div>
        <div class="bd-actions"><span id="bdSaved" class="bd-saved"></span><button class="btn sm" id="bdMore" aria-label="More deck actions">⋯</button><button class="btn primary sm" id="bdPlay">Play</button></div>
      </header>
      <div class="bd-status" id="bdStatus"></div>
      <div class="bd-tabs" role="tablist"><button data-tab="search" class="${B.tab === 'search' ? 'on' : ''}" role="tab">Add cards</button><button data-tab="deck" class="${B.tab === 'deck' ? 'on' : ''}" role="tab" id="bdDeckTab">Deck</button></div>
      <div class="bd-body">
        <section class="bd-search" aria-label="Card search">
          <div class="bd-filters">
            <input id="bdQ" type="search" placeholder="Search ${D.index.list.length.toLocaleString()} cards by name, type or rules text" autocomplete="off" value="${esc(B.f.q)}">
            <div class="bd-frow">
              <div class="colorchips" id="bdColors">${['W', 'U', 'B', 'R', 'G', 'C'].map(c => `<button class="cchip ${B.f.colors.has(c) ? 'on' : ''}" data-fc="${c}" aria-label="${c === 'C' ? 'Colorless' : M.COLOR_NAME[c]}" aria-pressed="${B.f.colors.has(c)}">${H().pip(c)}</button>`).join('')}</div>
              <select id="bdType" aria-label="Card type">${TYPES.map(([v, l]) => `<option value="${v}" ${B.f.type === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
              <select id="bdMV" aria-label="Mana value"><option value="">Any mana value</option>${['0', '1', '2', '3', '4', '5', '6', '7+'].map(v => `<option value="${v}" ${B.f.mv === v ? 'selected' : ''}>MV ${v}</option>`).join('')}</select>
            </div>
            <div class="bd-frow" id="bdToggles"></div>
          </div>
          <div class="bd-results" id="bdResults"></div>
        </section>
        <section class="bd-deck" id="bdDeck" aria-label="Deck list"></section>
      </div>
    </div>`;
    bind();
    renderToggles(); renderStatus(); renderDeck(); renderResults(); renderSaveState();
  }

  function renderToggles() {
    const d = B.deck;
    const el = $('#bdToggles');
    el.innerHTML = d.mode === 'commander'
      ? `<label class="chk"><input type="checkbox" id="bdInId" ${B.f.inId ? 'checked' : ''} ${d.commander.length ? '' : 'disabled'}> Only my commander's colors</label>`
      : `<label class="chk"><input type="checkbox" id="bdStd" ${B.f.std ? 'checked' : ''}> Standard-legal only</label>`;
    const a = $('#bdInId'); if (a) a.onchange = e => { B.f.inId = e.target.checked; B.limit = 60; renderResults(); };
    const s = $('#bdStd'); if (s) s.onchange = e => { B.f.std = e.target.checked; B.limit = 60; renderResults(); };
  }

  function renderStatus() {
    const { pip, esc } = H();
    const d = B.deck;
    const total = D.count(d);
    const target = d.mode === 'commander' ? 100 : 60;
    const issues = D.validate(d);
    const errs = issues.filter(i => i.level === 'error').length;
    const fmt = d.mode === 'commander' ? 'Commander' : 'Standard';
    const cols = d.mode === 'commander' && d.commander.length ? [...D.identity(d)] : D.colorsOf(d);
    const chip = !issues.length ? `<span class="vchip ok">Legal for ${fmt}</span>` : `<button class="vchip ${errs ? 'bad' : 'warn'}" id="bdIssues" aria-expanded="${B.issuesOpen}">${issues.length} ${issues.length === 1 ? 'issue' : 'issues'} ${B.issuesOpen ? '▴' : '▾'}</button>`;
    $('#bdStatus').innerHTML = `
      <span class="bd-count ${total === target || (d.mode !== 'commander' && total > target) ? 'good' : ''}"><b>${total}</b> / ${target}${d.mode === 'constructed' ? '+' : ''} cards</span>
      <span class="dpips">${(cols.length ? cols : ['C']).map(pip).join('')}</span>
      ${chip}
      ${B.issuesOpen && issues.length ? `<ul class="issues">${issues.map(i => `<li class="${i.level}">${esc(i.text)}</li>`).join('')}</ul>` : ''}`;
    const ib = $('#bdIssues'); if (ib) ib.onclick = () => { B.issuesOpen = !B.issuesOpen; renderStatus(); };
    const dt = $('#bdDeckTab'); if (dt) dt.textContent = `Deck (${total})`;
  }

  function sortRows(rows) {
    return rows.slice().sort((a, b) => {
      const A = D.info(a[1]), Bi = D.info(b[1]);
      return (A.cmc - Bi.cmc) || A.name.localeCompare(Bi.name);
    });
  }

  function renderDeck() {
    const { esc, costHTML } = H();
    const d = B.deck;
    const groups = {};
    for (const row of d.main) { const i = D.info(row[1]); const g = i ? i.group : 'Other'; (groups[g] = groups[g] || []).push(row); }
    let html = '';
    if (d.mode === 'commander') {
      const one = d.commander.length === 1 ? D.info(d.commander[0]) : null;
      html += `<div class="bd-group cmd"><h4>Commander</h4>${d.commander.map(k => {
        const i = D.info(k);
        return `<div class="bd-row"><button class="bd-x" data-uncmd="${esc(k)}" aria-label="Remove ${esc(k)} as commander">✕</button><button class="bd-rname" data-info="${esc(k)}">${esc(i ? i.name : k)}</button><span class="r-cost">${i ? costHTML(M.parseMana(i.cost)) : ''}</span></div>`;
      }).join('') || '<p class="hint">Search for a legendary creature, open it, and choose <b>Make commander</b>.</p>'}
      ${one && one.partner ? `<p class="hint">${esc(one.name)} can have a ${one.partner.kind === 'chooseBg' ? 'Background' : one.partner.kind === 'companionOfDoctor' ? 'Doctor' : 'partner'}. Open that card and choose <b>Add as partner</b>.</p>` : ''}</div>`;
    }
    for (const g of GROUP_ORDER) {
      const rows = groups[g];
      if (!rows) continue;
      const n = rows.reduce((a, x) => a + x[0], 0);
      html += `<div class="bd-group"><h4>${g} <span class="muted">${n}</span></h4>${sortRows(rows).map(([q, k]) => {
        const i = D.info(k);
        return `<div class="bd-row"><div class="stepper"><button data-dec="${esc(k)}" aria-label="Remove one ${esc(k)}">−</button><span>${q}</span><button data-inc="${esc(k)}" aria-label="Add one ${esc(k)}">+</button></div><button class="bd-rname" data-info="${esc(k)}">${esc(i ? i.name : k)}</button><span class="r-cost">${i && !i.isLand ? costHTML(M.parseMana(i.cost)) : ''}</span></div>`;
      }).join('')}</div>`;
    }
    if (!d.main.length) html += `<p class="hint">${d.mode === 'commander' ? 'Then add 99 more cards.' : 'Add cards from the search, or import a list from the ⋯ menu.'}</p>`;
    // lands tools
    html += `<div class="bd-group"><h4>Basic lands</h4><div class="basics">${BASICS.map(([c, n]) => `<button class="btn sm" data-inc="${n}" aria-label="Add a ${n}">${H().pip(c)} +1</button>`).join('')}</div>
      <button class="btn sm" id="bdFill" ${D.count(d) >= (d.mode === 'commander' ? 100 : 60) ? 'disabled' : ''}>Fill to ${d.mode === 'commander' ? 100 : 60} with basic lands</button></div>`;
    html += curveHTML(d);
    $('#bdDeck').innerHTML = html;
    const fill = $('#bdFill'); if (fill) fill.onclick = () => { const n = D.fillLands(d); if (n) { H().flash(`Added ${n} basic lands.`); changed(); } };
  }

  function curveHTML(d) {
    const curve = new Array(8).fill(0);
    let spells = 0, mv = 0, lands = 0;
    for (const [n, k] of d.main.concat(d.mode === 'commander' ? d.commander.map(c => [1, c]) : [])) {
      const i = D.info(k); if (!i) continue;
      if (i.isLand) { lands += n; continue; }
      curve[Math.min(7, i.cmc)] += n; spells += n; mv += i.cmc * n;
    }
    const max = Math.max(1, ...curve);
    return `<div class="bd-group stats"><h4>Mana curve</h4>
      <div class="curve" role="img" aria-label="Mana curve: ${curve.map((c, i) => `${c} at ${i === 7 ? '7 or more' : i}`).join(', ')}">${curve.map((c, i) => `<div class="cv"><span class="cv-n">${c || ''}</span><i style="height:${Math.round(c / max * 100)}%"></i><span class="cv-l">${i === 7 ? '7+' : i}</span></div>`).join('')}</div>
      <p class="muted small">${spells} spells · ${lands} lands · average mana value ${spells ? (mv / spells).toFixed(2) : '–'}</p></div>`;
  }

  // ---------------------------------------------------------------- search
  function search() {
    const f = B.f, d = B.deck;
    const q = D.norm(f.q);
    const id = d.mode === 'commander' && d.commander.length && f.inId ? D.identity(d) : null;
    const out = [];
    for (const i of D.index.list) {
      if (f.type) {
        if (f.type === 'commander') { if (!i.canCommand && !(i.background && d.commander.length === 1)) continue; }
        else if (!i.typeN.includes(f.type.toLowerCase())) continue;
      }
      if (f.mv) { if (i.isLand) continue; if (f.mv === '7+' ? i.cmc < 7 : i.cmc !== +f.mv) continue; }
      if (f.colors.size) {
        if (i.colors.size === 0) { if (!f.colors.has('C')) continue; }
        else { let ok = true; for (const c of i.colors) if (!f.colors.has(c)) { ok = false; break; } if (!ok) continue; }
      }
      if (id) { let ok = true; for (const c of i.ci) if (!id.has(c)) { ok = false; break; } if (!ok) continue; }
      if (d.mode !== 'commander' && f.std && !i.std) continue;
      if (d.mode === 'commander' && i.cmdBanned) continue;
      let score = 0;
      if (q) {
        if (i.nameN === q) score = 0;
        else if (i.nameN.startsWith(q)) score = 1;
        else if (i.nameN.includes(q)) score = 2;
        else if (i.typeN.includes(q)) score = 3;
        else if (i.textN.includes(q)) score = 4;
        else continue;
      }
      out.push([score, i]);
    }
    out.sort((a, b) => a[0] - b[0] || a[1].name.localeCompare(b[1].name));
    return out.map(x => x[1]);
  }

  function renderResults() {
    const { esc, costHTML } = H();
    const el = $('#bdResults');
    if (!el) return;
    const f = B.f;
    const anyFilter = f.q.trim() || f.colors.size || f.type || f.mv;
    if (!anyFilter) { el.innerHTML = `<p class="hint">Type a card name, or pick a color, type or mana value to browse.${B.deck.mode === 'constructed' && f.std ? ' Only cards legal in current Standard are shown; untick the box to see everything.' : ''}</p>`; return; }
    const res = search();
    B.results = res;
    const shown = res.slice(0, B.limit);
    const d = B.deck;
    el.innerHTML = `<div class="muted small res-count">${res.length.toLocaleString()} card${res.length === 1 ? '' : 's'}</div>` + shown.map(i => {
      const q = D.qty(d, i.key) + (d.commander.includes(i.key) ? 1 : 0);
      return `<div class="bd-res"><button class="bd-rmain" data-info="${esc(i.key)}"><span class="r-name">${esc(i.name)}</span><span class="r-type">${esc(i.type)}</span></button><span class="r-cost">${i.isLand ? '' : costHTML(M.parseMana(i.cost))}</span>${q ? `<span class="r-qty" aria-label="${q} in deck">${q}</span>` : '<span class="r-qty empty"></span>'}<button class="r-add" data-inc="${esc(i.key)}" aria-label="Add ${esc(i.name)}">+</button></div>`;
    }).join('') + (res.length > shown.length ? `<button class="btn ghost more" id="bdMoreRes">Show more (${(res.length - shown.length).toLocaleString()} left)</button>` : '') + (!res.length ? '<p class="hint">No cards match. Try fewer filters.</p>' : '');
    const m = $('#bdMoreRes'); if (m) m.onclick = () => { B.limit += 60; renderResults(); };
  }

  // ---------------------------------------------------------------- actions
  function addCard(key, n) {
    const d = B.deck, i = D.info(key);
    if (!i) return;
    if (d.mode === 'commander' && d.commander.includes(key)) { H().flash(`${i.name} is your commander.`); return; }
    const cur = D.qty(d, key);
    const lim = i.limit != null ? i.limit : (d.mode === 'commander' ? 1 : 4);
    if (cur + n > lim) {
      if (cur >= lim) { H().flash(d.mode === 'commander' ? `Commander decks allow one copy of ${i.name}.` : `You already have ${lim} copies of ${i.name}.`); return; }
      n = lim - cur;
    }
    D.setQty(d, key, cur + n);
    changed();
  }
  function makeCommander(key, asPartner) {
    const d = B.deck;
    const i = D.info(key);
    if (asPartner) d.commander.push(key); else d.commander = [key];
    D.setQty(d, key, 0);
    if (B.f.type === 'commander') { B.f.type = ''; const t = $('#bdType'); if (t) t.value = ''; }
    renderToggles();
    if (!asPartner && /^New Commander deck$/.test(d.name)) { d.name = i.name.split(',')[0] + ' deck'; const n = $('#bdName'); if (n) n.value = d.name; }
    H().flash(`${i.name} is now your commander.`);
    changed();
  }

  function cardSheet(key) {
    const { esc, pip, cardDetailHTML, openSheet, closeSheet } = H();
    const i = D.info(key); if (!i) return;
    const d = B.deck;
    const q = D.qty(d, key);
    const isCmd = d.commander.includes(key);
    const lim = i.limit != null ? i.limit : (d.mode === 'commander' ? 1 : 4);
    const btns = [];
    if (!isCmd) {
      btns.push(`<button class="btn primary" data-sa="add1">Add 1</button>`);
      if (d.mode !== 'commander' && lim > 1 && q < lim) btns.push(`<button class="btn" data-sa="addMax">Add ${lim === Infinity ? 4 : lim - q > 0 ? lim - q : lim}${lim === Infinity ? '' : ' (playset)'}</button>`);
      if (q) btns.push(`<button class="btn" data-sa="rem1">Remove 1</button>`);
      if (q > 1) btns.push(`<button class="btn ghost" data-sa="remAll">Remove all</button>`);
    }
    if (d.mode === 'commander') {
      if (isCmd) btns.push(`<button class="btn" data-sa="uncmd">Stop using as commander</button>`);
      else {
        if (i.canCommand) btns.push(`<button class="btn" data-sa="cmd">Make commander</button>`);
        if (D.canAddSecondCommander(d, key)) btns.push(`<button class="btn" data-sa="partner">Add as partner</button>`);
      }
    }
    const legal = [`Standard: ${i.std ? 'legal' : 'not legal'}`, `Commander: ${i.cmdBanned ? 'banned' : 'legal'}`];
    const html = `${cardDetailHTML(null, i.def)}
      <div class="bd-legal small"><span>${legal.join(' · ')}</span><span>Color identity ${(i.ci.size ? [...i.ci] : ['C']).map(pip).join('')}</span>${q || isCmd ? `<span><b>${isCmd ? 'Commander' : q + ' in deck'}</b></span>` : ''}</div>
      <div class="acts row">${btns.join('')}</div>`;
    openSheet(html, {
      onClick: e => {
        const b = e.target.closest('[data-sa]'); if (!b) return;
        const a = b.dataset.sa;
        if (a === 'add1') addCard(key, 1);
        if (a === 'addMax') addCard(key, lim === Infinity ? 4 : Math.max(1, lim - q));
        if (a === 'rem1') { D.setQty(d, key, q - 1); changed(); }
        if (a === 'remAll') { D.setQty(d, key, 0); changed(); }
        if (a === 'cmd') makeCommander(key, false);
        if (a === 'partner') makeCommander(key, true);
        if (a === 'uncmd') { d.commander = d.commander.filter(c => c !== key); renderToggles(); changed(); }
        closeSheet();
      },
    });
  }

  function moreSheet() {
    const { openSheet, closeSheet, esc } = H();
    openSheet(`<div class="sheet-head"><h3>${esc(B.deck.name)}</h3></div>
      <div class="menu-list">
        <button class="btn" data-m="export">Copy deck list (export)</button>
        <button class="btn" data-m="import">Import a list into this deck</button>
        <button class="btn" data-m="dup">Duplicate deck</button>
        <button class="btn" data-m="clear">Remove all cards</button>
        <button class="btn danger" data-m="delete">Delete deck</button>
      </div>`, {
      onClick: e => {
        const b = e.target.closest('[data-m]'); if (!b) return;
        const m = b.dataset.m;
        if (m === 'export') exportSheet();
        if (m === 'import') importSheet(B.deck);
        if (m === 'dup') { const c = D.clone(B.deck); c.id = D.newId(); c.name = B.deck.name + ' (copy)'; c.created = Date.now(); M.Builder.open(c); closeSheet(); H().flash('Duplicated.'); }
        if (m === 'clear') confirmSheet('Remove every card from this deck?', 'Remove all', () => { B.deck.main = []; B.deck.commander = []; renderToggles(); changed(); });
        if (m === 'delete') confirmSheet(`Delete “${B.deck.name}”? This can't be undone.`, 'Delete deck', async () => { clearTimeout(saveTimer); await D.store.remove(B.deck.id); const S = H().S; if (S.mine && S.mine.deckId === B.deck.id) S.mine = null; if (S.theirs && S.theirs.deckId === B.deck.id) S.theirs = null; B = null; H().renderSetup(); H().flash('Deck deleted.'); });
      },
    });
  }
  function confirmSheet(text, label, fn) {
    const { openSheet, closeSheet, esc } = H();
    openSheet(`<div class="sheet-head"><h3>${esc(text)}</h3></div><div class="sheet-actions"><button class="btn ghost" id="cfNo">Cancel</button><button class="btn danger" id="cfYes">${esc(label)}</button></div>`);
    $('#cfNo').onclick = closeSheet;
    $('#cfYes').onclick = () => { closeSheet(); fn(); };
  }

  function exportSheet() {
    const { openSheet, esc, flash } = H();
    const txt = D.exportText(B.deck);
    openSheet(`<div class="sheet-head"><h3>Deck list</h3><div class="muted">Works with Arena, Moxfield, Archidekt and most deck sites.</div></div>
      <textarea id="expText" class="bigtext" readonly rows="14">${esc(txt)}</textarea>
      <div class="sheet-actions"><button class="btn primary" id="expCopy">Copy</button></div>`);
    $('#expCopy').onclick = async () => {
      const ta = $('#expText');
      try { await navigator.clipboard.writeText(txt); flash('Copied.'); }
      catch (e) { ta.focus(); ta.select(); flash('Selected. Press copy on your keyboard or menu.'); }
    };
  }

  // ---------------------------------------------------------------- import
  function importSheet(intoDeck) {
    const { openSheet, closeSheet, esc, flash } = H();
    openSheet(`<div class="sheet-head"><h3>${intoDeck ? 'Import into this deck' : 'Import a deck'}</h3><div class="muted">Paste a list exported from Arena, MTGO, Moxfield, Archidekt, TappedOut and similar sites, or choose a file.</div></div>
      <textarea id="impText" class="bigtext" rows="12" placeholder="Commander&#10;1 Krenko, Mob Boss&#10;&#10;Deck&#10;1 Sol Ring&#10;1 Goblin Bombardment&#10;38 Mountain&#10;…"></textarea>
      <div class="imp-row"><label class="btn sm filebtn">Choose file<input type="file" id="impFile" accept=".txt,.dek,.dck,.csv,.cod,text/plain,text/csv"></label><span class="muted small" id="impFileName">.txt, .dek, .dck or .csv</span></div>
      ${intoDeck ? '<p class="muted small">This replaces the cards in the current deck.</p>' : ''}
      <div class="sheet-actions"><button class="btn ghost" id="impCancel">Cancel</button><button class="btn primary" id="impGo">Import</button></div>`, { wide: true });
    $('#impFile').onchange = e => {
      const file = e.target.files && e.target.files[0]; if (!file) return;
      if (file.size > 2e6) { flash('That file is too large to be a deck list.'); return; }
      const r = new FileReader();
      r.onload = () => { $('#impText').value = String(r.result || ''); $('#impFileName').textContent = file.name; if (!B || !intoDeck) { const base = file.name.replace(/\.[^.]+$/, ''); $('#impText').dataset.name = base; } };
      r.readAsText(file);
    };
    $('#impCancel').onclick = closeSheet;
    $('#impGo').onclick = () => {
      const text = $('#impText').value;
      if (!text.trim()) { flash('Paste a deck list first.'); return; }
      const res = D.parseText(text);
      const n = res.main.reduce((a, x) => a + x[0], 0) + res.commander.length;
      if (!n) { showImportFailure(res); return; }
      let deck;
      if (intoDeck) { deck = B.deck; deck.main = res.main; deck.commander = res.commander; deck.side = res.side; deck.mode = res.mode; if (res.name) deck.name = res.name; }
      else {
        deck = D.blank(res.mode);
        deck.main = res.main; deck.commander = res.commander; deck.side = res.side;
        deck.name = res.name || $('#impText').dataset.name || (res.commander.length ? D.info(res.commander[0]).name.split(',')[0] + ' deck' : 'Imported deck');
      }
      closeSheet();
      M.Builder.open(deck, { importResult: res }).then(() => queueSave(0));
    };
  }
  function showImportFailure(res) {
    const { openSheet, esc } = H();
    openSheet(`<div class="sheet-head"><h3>No cards recognized</h3><div class="muted">Each line should look like “4 Lightning Bolt”. ${res.unknown.length ? 'These names weren\'t found:' : ''}</div></div>${res.unknown.length ? `<ul class="unknown">${res.unknown.slice(0, 30).map(u => `<li>${esc(u.line)}</li>`).join('')}</ul>` : ''}`);
  }
  function showImportResult(res) {
    const { openSheet, esc } = H();
    const n = res.main.reduce((a, x) => a + x[0], 0) + res.commander.length;
    const unk = res.unknown.reduce((a, u) => a + u.n, 0);
    if (!unk && !res.notes.length) { H().flash(`Imported ${n} cards.`); return; }
    openSheet(`<div class="sheet-head"><h3>Imported ${n} card${n === 1 ? '' : 's'}</h3><div class="muted">As a ${res.mode === 'commander' ? 'Commander' : 'Standard'} deck.</div></div>
      ${res.notes.length ? `<ul class="notes">${res.notes.map(t => `<li>${esc(t)}</li>`).join('')}</ul>` : ''}
      ${unk ? `<div><h4 class="h4">Not found (${unk} card${unk === 1 ? '' : 's'})</h4><p class="muted small">These aren't in the game's card pool yet, or are spelled differently. Search for them by hand if they're close matches.</p><ul class="unknown">${res.unknown.map(u => `<li>${u.n} ${esc(u.name)}</li>`).join('')}</ul></div>` : ''}
      <div class="sheet-actions"><button class="btn primary" id="irOk">Continue to deck</button></div>`);
    $('#irOk').onclick = H().closeSheet;
  }

  // ---------------------------------------------------------------- events
  function bind() {
    const d = B.deck;
    $('#bdBack').onclick = async () => {
      clearTimeout(saveTimer);
      if (!d.main.length && !d.commander.length) await D.store.remove(d.id);
      else await D.store.save(d);
      B = null;
      const S = H().S;
      if (d.main.length || d.commander.length) { S.mode = d.mode; S.type = 'mine'; }
      H().renderSetup();
    };
    const nameEl = $('#bdName');
    nameEl.oninput = () => { d.name = nameEl.value.trim() || 'Untitled deck'; queueSave(); };
    document.querySelectorAll('[data-fmt]').forEach(b => b.onclick = () => {
      if (d.mode === b.dataset.fmt) return;
      d.mode = b.dataset.fmt;
      if (d.mode === 'constructed' && d.commander.length) { for (const c of d.commander) D.setQty(d, c, D.qty(d, c) + 1); d.commander = []; }
      B.f.std = d.mode !== 'commander';
      if (d.mode === 'commander' && !d.commander.length) B.f.type = 'commander';
      queueSave(); render();
    });
    document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { B.tab = b.dataset.tab; const root = $('.builder'); root.classList.toggle('tab-search', B.tab === 'search'); root.classList.toggle('tab-deck', B.tab === 'deck'); document.querySelectorAll('[data-tab]').forEach(x => x.classList.toggle('on', x.dataset.tab === B.tab)); });
    $('#bdMore').onclick = moreSheet;
    $('#bdPlay').onclick = async () => {
      clearTimeout(saveTimer);
      await D.store.save(d);
      const p = D.playable(d);
      if (!p.ok) { H().flash(p.why); return; }
      const S = H().S;
      S.mode = d.mode; S.type = 'all'; S.mine = H().customView(D.store.get(d.id) || d); S.pick = 'theirs';
      B = null;
      H().renderSetup();
      H().flash('Deck selected. Pick an opponent or start the game.');
    };
    let t = null;
    const q = $('#bdQ');
    q.oninput = () => { clearTimeout(t); t = setTimeout(() => { B.f.q = q.value; B.limit = 60; renderResults(); }, 120); };
    $('#bdType').onchange = e => { B.f.type = e.target.value; B.limit = 60; renderResults(); };
    $('#bdMV').onchange = e => { B.f.mv = e.target.value; B.limit = 60; renderResults(); };
    $('#bdColors').onclick = e => { const b = e.target.closest('[data-fc]'); if (!b) return; const c = b.dataset.fc; B.f.colors.has(c) ? B.f.colors.delete(c) : B.f.colors.add(c); b.classList.toggle('on'); b.setAttribute('aria-pressed', B.f.colors.has(c)); B.limit = 60; renderResults(); };
    $('.bd-body').onclick = e => {
      const inc = e.target.closest('[data-inc]'); if (inc) { addCard(inc.dataset.inc, 1); return; }
      const dec = e.target.closest('[data-dec]'); if (dec) { const k = dec.dataset.dec; D.setQty(d, k, D.qty(d, k) - 1); changed(); return; }
      const un = e.target.closest('[data-uncmd]'); if (un) { d.commander = d.commander.filter(c => c !== un.dataset.uncmd); renderToggles(); changed(); return; }
      const info = e.target.closest('[data-info]'); if (info) { cardSheet(info.dataset.info); }
    };
  }
})(MTG);

</script>
</body>
</html>
