<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Planeswalker's Table</title>
<meta name="description" content="Play Magic: The Gathering against a computer opponent in Standard or 1v1 Commander with any preconstructed deck.">
<meta name="theme-color" content="#0f1d1c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Planeswalker">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700;800&family=IBM+Plex+Mono:wght@500;600;700&family=Marcellus+SC&display=swap">
<style>:root{color-scheme:dark}*,*::before,*::after{box-sizing:border-box}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<style>/* Layout: one-screen game table — opponent on top, you at the bottom, a hand rail and a prompt bar; setup is a single scrolling column. */
:root {
  --mat: #0f1d1c;
  --mat-2: #162a29;
  --mat-3: #1e3634;
  --line: #2c4744;
  --ink: #ece6d6;
  --muted: #94a7a2;
  --brass: #d1a952;
  --brass-ink: #1b1608;
  --you: #7cbbe0;
  --foe: #e08a6c;
  --good: #8fcf8a;
  --bad: #ef7a6a;
  --f-display: "Marcellus SC", "Palatino Linotype", Palatino, Georgia, serif;
  --f-body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --tile-w: 64px;
  --tile-h: 88px;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--mat); color: var(--ink); font-family: var(--f-body); font-size: 15px; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--mat); }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
/* the app always covers the whole screen; only the top is kept clear of the status bar.
   The bottom bars add the home-indicator space themselves, so nothing is left blank below them. */
#app { position: fixed; inset: 0; overflow-y: auto; overscroll-behavior: contain; padding-top: env(safe-area-inset-top, 0px); }
@media (display-mode: standalone) { #app { padding-top: calc(env(safe-area-inset-top, 0px) + 10px); } body::before { height: calc(env(safe-area-inset-top, 0px) + 10px); } }
.muted { color: var(--muted); }
.small { font-size: 13px; }

/* ---------- buttons */
.btn { padding: 9px 14px; border-radius: 8px; background: var(--mat-3); border: 1px solid var(--line); color: var(--ink); font-weight: 600; letter-spacing: .01em; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--brass); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--brass); color: var(--brass-ink); border-color: var(--brass); }
.btn.ghost { background: transparent; }
.btn.big { padding: 12px 22px; font-size: 16px; }
.btn.sm { padding: 5px 10px; font-size: 13px; }
.link { color: var(--brass); text-decoration: underline; text-underline-offset: 3px; font-size: 13px; padding: 0; }

/* ---------- loading */
.loading { height: 100%; display: grid; place-content: center; text-align: center; gap: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.ld-title { font-family: var(--f-display); font-size: 30px; color: var(--brass); }
.ld-sub { color: var(--muted); }
.ld-bar { width: 220px; height: 3px; background: var(--mat-3); margin: 8px auto 0; overflow: hidden; border-radius: 2px; }
.ld-bar i { display: block; height: 100%; width: 40%; background: var(--brass); animation: ld 1.1s ease-in-out infinite; }
@keyframes ld { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }

/* ---------- setup */
.setup { max-width: 980px; margin: 0 auto; padding-block: 20px calc(40px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 18px; }
.setup-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px; }
.brand { display: flex; gap: 12px; align-items: center; }
.brand-mark { font-size: 34px; color: var(--brass); line-height: 1; }
.brand h1 { font-family: var(--f-display); font-weight: 400; font-size: 28px; margin: 0; letter-spacing: .02em; text-wrap: balance; }
.brand p { margin: 2px 0 0; color: var(--muted); }
.modes { display: flex; gap: 6px; background: var(--mat-2); padding: 4px; border-radius: 12px; border: 1px solid var(--line); }
.mode { padding: 8px 16px; border-radius: 9px; text-align: left; display: grid; }
.mode b { font-family: var(--f-display); font-weight: 400; font-size: 18px; }
.mode small { color: var(--muted); font-size: 12px; }
.mode.on { background: var(--mat-3); box-shadow: inset 0 0 0 1px var(--brass); }
.mode.on b { color: var(--brass); }
.matchup { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: stretch; }
.slot { background: var(--mat-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; cursor: pointer; min-width: 0; }
.slot.active { border-color: var(--brass); }
.slot-lbl { text-transform: uppercase; letter-spacing: .12em; font-size: 11px; color: var(--muted); margin-bottom: 6px; }
.slot-empty { color: var(--muted); font-style: italic; }
.ds-name { font-family: var(--f-display); font-size: 19px; }
.ds-meta { color: var(--muted); font-size: 13px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.ds-cmd { font-size: 14px; margin-top: 2px; }
.vs { align-self: center; font-family: var(--f-display); color: var(--brass); font-size: 20px; }
.start-row { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 12px; justify-content: flex-end; align-items: center; }
.lifesel { color: var(--muted); font-size: 14px; display: flex; gap: 6px; align-items: center; }
select, input[type=search] { background: var(--mat-2); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: inherit; }
.browser { display: grid; gap: 10px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.filters input { flex: 1 1 240px; min-width: 0; }
.colorchips { display: flex; gap: 4px; }
.cchip { padding: 3px; border-radius: 50%; opacity: .45; }
.cchip.on { opacity: 1; box-shadow: 0 0 0 2px var(--brass); }
.cchip .pip { width: 22px; height: 22px; font-size: 12px; }
.count { color: var(--muted); font-size: 13px; }
.count b { color: var(--ink); }
.decklist { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 6px; }
.drow { display: flex; justify-content: space-between; gap: 10px; text-align: left; padding: 9px 12px; border-radius: 9px; background: var(--mat-2); border: 1px solid transparent; min-width: 0; }
.drow:hover { border-color: var(--line); }
.dr-main { display: grid; min-width: 0; }
.dr-name { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dr-sub { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dr-side { display: grid; justify-items: end; gap: 2px; flex: none; }
.dr-year { font-family: var(--f-num); font-size: 11px; color: var(--muted); }
.dpips { display: inline-flex; gap: 2px; }
.tag { font-size: 10px; text-transform: uppercase; letter-spacing: .1em; padding: 1px 6px; border-radius: 4px; margin-left: 4px; vertical-align: 2px; }
.tag.you { background: var(--you); color: #0b1a22; }
.tag.ai { background: var(--foe); color: #2a0f06; }
.none { color: var(--muted); padding: 20px 0; }

/* ---------- mana pips */
.pip { display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; font-family: var(--f-num); font-size: 9.5px; font-weight: 700; color: #1b1a17; background: #cfc8b8; box-shadow: inset 0 -1px 0 rgba(0,0,0,.25); vertical-align: -3px; flex: none; }
.p-W { background: #f3ecd2; } .p-U { background: #8fc1e6; } .p-B { background: #a49aa6; } .p-R { background: #ec9274; } .p-G { background: #8fc98a; } .p-C { background: #d3d6da; } .p-H { background: linear-gradient(135deg, #e2c46a, #b98fd0); }

/* ---------- card colors (card faces are light parchment tints) */
.c-W { --cf: #ece4c8; --ce: #b9a874; }
.c-U { --cf: #b8d3e8; --ce: #4f86b3; }
.c-B { --cf: #c2bac2; --ce: #5d5160; }
.c-R { --cf: #edc0ae; --ce: #b8553a; }
.c-G { --cf: #bfd8b5; --ce: #4d8a4a; }
.c-M { --cf: #e9d79c; --ce: #b38f2a; }
.c-A { --cf: #cfd3d7; --ce: #7a8590; }
.c-L { --cf: #d6c8ad; --ce: #8b7552; }

/* ---------- game table */
body.in-game { overflow: hidden; }
.table { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto minmax(0, 1fr) auto auto auto; position: relative; padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.pbar { display: flex; align-items: center; gap: 10px; padding: 6px 12px; background: var(--mat-2); border-block: 1px solid var(--line); min-width: 0; flex-wrap: wrap; }
.pbar.active.me { box-shadow: inset 3px 0 0 var(--you); }
.pbar.active.ai { box-shadow: inset 3px 0 0 var(--foe); }
.pl-life { display: flex; align-items: baseline; gap: 8px; padding: 2px 10px 2px 6px; border-radius: 8px; }
.pl-name { font-family: var(--f-display); font-size: 15px; }
.pbar.me .pl-name { color: var(--you); } .pbar.ai .pl-name { color: var(--foe); }
.life { font-family: var(--f-num); font-weight: 600; font-size: 22px; font-variant-numeric: tabular-nums; }
.pl-zones { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.zc { font-family: var(--f-num); font-size: 12.5px; color: var(--muted); background: var(--mat); border: 1px solid var(--line); border-radius: 6px; padding: 2px 7px; }
.zbtn:hover { color: var(--ink); }
.zc.poison { color: var(--good); } .zc.cmd { color: var(--bad); }
.zc.pool { display: inline-flex; gap: 2px; }
.cmdzone { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; }
.cmdchip { background: var(--cf); color: #1a1712; border-radius: 6px; padding: 3px 9px; font-weight: 700; font-size: 13px; border: 2px solid var(--ce); max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
.cmdchip i { font-style: normal; font-family: var(--f-num); font-size: 11px; opacity: .7; }
.bf { overflow-y: auto; padding: 8px 12px; display: flex; flex-direction: column; gap: 6px; background: radial-gradient(ellipse at 50% 0%, var(--mat-2), var(--mat) 70%); }
.bf-ai { flex-direction: column-reverse; background: radial-gradient(ellipse at 50% 100%, var(--mat-2), var(--mat) 70%); }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: flex-start; min-height: 30px; flex-shrink: 0; }
.row.lands .tile { height: calc(var(--tile-h) * .6); }
.row.lands .t-type { display: none; }
.row.lands { gap: 4px; }
.empty { color: var(--muted); font-size: 12px; font-style: italic; opacity: .6; align-self: center; }
.midline { display: grid; gap: 4px; padding: 5px 12px; background: var(--mat); border-block: 1px dashed var(--line); }
.phases { display: flex; gap: 3px; align-items: center; overflow-x: auto; scrollbar-width: none; }
.turnlbl { font-family: var(--f-display); font-size: 13px; margin-right: 6px; white-space: nowrap; }
.phases.mine .turnlbl { color: var(--you); } .phases.theirs .turnlbl { color: var(--foe); }
.ph { font-size: 11px; padding: 2px 6px; border-radius: 4px; color: var(--muted); white-space: nowrap; text-transform: uppercase; letter-spacing: .06em; }
.ph.on { background: var(--brass); color: var(--brass-ink); font-weight: 700; }
.ticker { display: grid; gap: 1px; font-size: 13px; min-height: 18px; }
.tk { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tk.old { color: var(--muted); font-size: 12px; }
.tk.turn { color: var(--brass); }
.tk.err, .lg.err { color: #c9b07a; font-style: italic; }
.stack { display: flex; flex-direction: column; gap: 3px; }
.stk { display: flex; gap: 8px; align-items: center; text-align: left; background: var(--mat-3); border: 1px solid var(--line); border-radius: 7px; padding: 5px 9px; font-size: 13.5px; min-width: 0; }
.stk.me { border-left: 3px solid var(--you); } .stk.ai { border-left: 3px solid var(--foe); }
.stk-who { font-family: var(--f-display); font-size: 12px; color: var(--muted); }
.stk-what { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stk-top { font-size: 11px; color: var(--brass); white-space: nowrap; }
.stk.hl { box-shadow: 0 0 0 2px var(--brass); } .stk.sel { background: var(--brass); color: var(--brass-ink); }
.hand { display: flex; gap: 6px; overflow-x: auto; padding: 8px 12px; background: var(--mat-2); border-top: 1px solid var(--line); min-height: calc(var(--tile-h) + 16px); }
.hand .tile { flex: none; }
.prompt { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 8px 12px calc(8px + env(safe-area-inset-bottom, 0px)); background: #0a1514; border-top: 1px solid var(--line); }
.pmsg { font-size: 14.5px; flex: 1 1 220px; min-width: 0; }
.pmsg.wait { color: var(--muted); font-style: italic; }
.pmsg b { font-family: var(--f-num); color: var(--brass); }
.blines { font-size: 12.5px; color: var(--brass); margin-top: 2px; }
.pbtns { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.stopall { font-size: 12.5px; color: var(--muted); display: flex; gap: 5px; align-items: center; }
.logbtn, .menubtn { position: absolute; top: 6px; right: max(12px, env(safe-area-inset-right, 0px)); background: var(--mat-3); border: 1px solid var(--line); border-radius: 7px; padding: 4px 9px; font-size: 13px; z-index: 3; }
.logbtn { right: calc(max(12px, env(safe-area-inset-right, 0px)) + 44px); }
.pbar.ai { padding-right: 110px; }
.logpane { position: absolute; right: 0; top: 0; bottom: 0; width: min(380px, 92vw); background: var(--mat-2); border-left: 1px solid var(--line); z-index: 5; display: flex; flex-direction: column; box-shadow: -10px 0 30px rgba(0,0,0,.4); }
.lp-head { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.lp-body { overflow-y: auto; padding: 8px 12px; display: grid; gap: 3px; font-size: 13.5px; align-content: start; }
.lg.turn { color: var(--brass); margin-top: 6px; font-family: var(--f-display); }
.lg.big { font-weight: 700; }
.lg.combat { color: #f0c3a8; } .lg.cast { color: #d4e4ef; }

/* ---------- card tiles */
.tile { width: var(--tile-w); height: var(--tile-h); background: var(--cf); color: #1b1914; border-radius: 6px; border: 2px solid var(--ce); padding: 3px 4px; display: flex; flex-direction: column; gap: 1px; position: relative; cursor: pointer; transition: transform .15s ease, box-shadow .15s ease; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; overflow: hidden; }
.t-name { font-weight: 800; font-size: 10px; line-height: 1.12; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.t-mid { display: flex; flex-wrap: wrap; gap: 1px; }
.t-mid .pip { width: 12px; height: 12px; font-size: 7.5px; vertical-align: 0; }
.t-type { font-size: 8.5px; opacity: .7; line-height: 1.1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.t-bot { margin-top: auto; display: flex; flex-wrap: wrap; gap: 2px; justify-content: flex-end; align-items: flex-end; }
.t-pt { font-family: var(--f-num); font-weight: 700; font-size: 11px; background: rgba(255,255,255,.75); border-radius: 4px; padding: 0 3px; }
.t-pt.up { color: #1e6a1a; } .t-pt.down { color: #a3261a; }
.t-pt i { font-style: normal; color: #a3261a; }
.t-loy { font-family: var(--f-num); font-weight: 700; font-size: 11px; background: #2b2722; color: #f0e7cf; border-radius: 4px 4px 9px 9px; padding: 0 4px; }
.bdg { font-size: 8.5px; font-weight: 800; background: #2b2722; color: #f2ead4; border-radius: 3px; padding: 0 3px; line-height: 13px; }
.bdg.zz { background: #4c6676; }
.bdg.kw { background: rgba(0,0,0,.55); letter-spacing: 1px; }
.t-zone { position: absolute; left: 0; right: 0; bottom: 0; font-size: 8.5px; background: rgba(0,0,0,.65); color: #f0e6cc; text-align: center; padding: 1px; }
.tile.tapped { transform: rotate(9deg) translateY(3px); filter: saturate(.55) brightness(.78); }
.tile.playable { box-shadow: 0 0 0 2px var(--brass), 0 0 14px rgba(209,169,82,.55); }
.tile.hl { box-shadow: 0 0 0 2px var(--you), 0 0 12px rgba(124,187,224,.6); }
.tile.sel { box-shadow: 0 0 0 3px var(--brass), 0 0 16px rgba(209,169,82,.9); transform: translateY(-4px); }
.tile.tapped.sel { transform: rotate(9deg) translateY(-2px); }
.tile.attacking { outline: 2px solid var(--foe); outline-offset: 2px; }
.tile.blocking { outline: 2px solid var(--you); outline-offset: 2px; }
.tile.big { --tile-w: 150px; --tile-h: 210px; padding: 7px 8px; gap: 3px; cursor: pointer; }
.tile.big .t-name { font-size: 13px; -webkit-line-clamp: 2; }
.tile.big .t-type { font-size: 10.5px; white-space: normal; }
.tile.big .t-text { font-size: 10.5px; line-height: 1.25; overflow: hidden; flex: 1; }
.tile.big .t-text .pip, .tile.big .t-cost .pip { width: 13px; height: 13px; font-size: 8px; }
.tile.big .t-pt { font-size: 13px; }
.lstack { position: relative; }
.lstack[data-n]:not([data-n="1"]) .tile { box-shadow: 3px -3px 0 -1px var(--cf), 3px -3px 0 0 var(--ce); }
.lcount { position: absolute; top: -6px; right: -6px; background: var(--brass); color: var(--brass-ink); font-family: var(--f-num); font-weight: 700; font-size: 11px; border-radius: 9px; padding: 0 5px; z-index: 1; }
.pl-life.hl { box-shadow: 0 0 0 2px var(--you); } .pl-life.sel { background: var(--brass); color: var(--brass-ink); }

/* ---------- sheets */
.sheet-wrap { position: fixed; inset: 0; background: rgba(4,10,10,.62); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { position: relative; background: var(--mat-2); border: 1px solid var(--line); border-radius: 16px 16px 0 0; width: min(560px, 100%); max-height: 88%; display: flex; flex-direction: column; box-shadow: 0 -10px 40px rgba(0,0,0,.5); animation: up .18s ease-out; padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet.wide { width: min(900px, 100%); }
@keyframes up { from { transform: translateY(30px); opacity: .6; } to { transform: none; opacity: 1; } }
@media (min-width: 760px) { .sheet-wrap { align-items: center; } .sheet { border-radius: 16px; } }
.sheet-body { overflow-y: auto; padding: 18px max(16px, env(safe-area-inset-right, 0px)) 18px max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 14px; }
.sheet-x { position: absolute; top: 8px; right: 10px; font-size: 18px; color: var(--muted); padding: 6px; z-index: 1; }
.sheet-back { position: absolute; top: 10px; left: 12px; color: var(--brass); font-size: 14px; z-index: 1; }
.sheet-head h3 { font-family: var(--f-display); font-weight: 400; font-size: 21px; margin: 0 28px 2px 0; text-wrap: balance; }
.sheet-actions { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; position: sticky; bottom: -18px; background: var(--mat-2); padding-block: 10px 18px; margin-bottom: -18px; box-shadow: 0 -10px 12px -8px rgba(0,0,0,.45); }
.tiles { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.tiles.dense .tile { --tile-w: 92px; --tile-h: 120px; }
.selwrap.on .tile, .scrywrap.down .tile { box-shadow: 0 0 0 3px var(--brass); }
.scrywrap { display: grid; justify-items: center; gap: 4px; }
.scrywrap.down .tile { opacity: .6; }
.scrylbl { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.ptile { padding: 14px 20px; border-radius: 10px; background: var(--mat-3); border: 1px solid var(--line); font-family: var(--f-display); font-size: 17px; }
.ptile.on { background: var(--brass); color: var(--brass-ink); }
.bigcard { background: var(--cf); color: #1b1914; border: 3px solid var(--ce); border-radius: 12px; padding: 12px 14px; display: grid; gap: 8px; }
.bc-top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.bc-name { font-family: var(--f-display); font-size: 21px; line-height: 1.1; }

          const node = M.buildTree(t.str, t.face);
          if (!node) continue;
          const item = { isStackItem: true, kind: 'trigger', obj: t.src, controller: t.ctrl, node, trig: t.trig, desc: t.desc, x: t.src.xPaid || 0, kicked: t.src.kicked, id: M.uid(), face: t.face, chapter: t.chapter, srcZcc: t.src.zcc };
          if (t.optional) {
            const yes = await this.ask(t.ctrl, { type: 'yesno', prompt: `Use ${t.src.name}'s triggered ability?`, card: t.src, item });
            if (!yes) continue;
          }
          const ok = await M.chooseTargetsForTree(this, item, t.ctrl);
          if (!ok) continue;
          // Trigger cost (e.g. "Cost$ 1")
          if (node.p.Cost && node.kind !== 'SP') {
            const cost = M.parseAbilityCost(node.p.Cost);
            if (cost && (cost.mana.generic || cost.mana.pips.length)) {
              const can = M.canPayCost(this, t.ctrl, t.src, cost, 0);
              if (!can) continue;
              const pay = await this.ask(t.ctrl, { type: 'yesno', prompt: `Pay ${node.p.Cost} for ${t.src.name}?`, card: t.src, item });
              if (!pay) continue;
              if (!(await M.payCost(this, t.ctrl, t.src, cost, 0, item))) continue;
            }
          }
          this.stack.push(item);
          this.log(`${t.ctrl.name}: ${t.desc} → ${M.describeItem(this, item)}`, 'trig');
          this.touch();
        }
      }
    }

    // ---------------------------------------------------------------- state-based actions
    checkSBA() {
      this.returnExiledUntilLeaves();
      let changed = true, loops = 0;
      while (changed && loops++ < 20) {
        changed = false;
        for (const pl of this.players) {
          if (pl.lost) continue;
          if (pl.isHorde) {
            if (!pl.library.length && !this.battlefield.some(o => o.controller === pl && M.isCreature(o)) && !this.stack.some(s => s.controller === pl) && !this.pendingTriggers.some(t => t.ctrl === pl)) {
              pl.lost = true;
              this.log('The horde is destroyed: its library is empty and it has no creatures left.', 'big');
            }
            continue;
          }
          if (pl.life <= 0 || pl.poison >= 10 || pl.drewFromEmpty || Object.values(pl.cmdDamage).some(v => v >= 21)) {
            pl.lost = true;
            const why = pl.life <= 0 ? 'life total reached 0' : pl.poison >= 10 ? '10 poison counters' : pl.drewFromEmpty ? 'drew from an empty library' : '21 commander damage';
            this.log(`${pl.name} loses (${why}).`, 'big');
          }
        }
        if (this.players.some(p => p.lost)) {
          const alive = this.players.filter(p => !p.lost);
          this.over = true;
          this.winner = alive.length === 1 ? alive[0] : null;
          throw new GameOver(this.winner);
        }
        for (const o of this.battlefield.slice()) {
          if (o.zone !== 'battlefield') continue;
          // +1/+1 and -1/-1 annihilate
          if (o.counters.P1P1 > 0 && o.counters.M1M1 > 0) { const n = Math.min(o.counters.P1P1, o.counters.M1M1); o.counters.P1P1 -= n; o.counters.M1M1 -= n; this.touch(); }
          if (M.isCreature(o)) {
            const t = M.toughness(o);
            if (t <= 0) { this.move(o, 'graveyard'); changed = true; continue; }
            if ((o.damage >= t || (o.deathtouched && o.damage > 0)) && !M.hasKW(o, 'Indestructible')) {
              if (o.regen > 0) { o.regen--; o.tapped = true; o.damage = 0; o.deathtouched = false; o.attacking = null; this.touch(); continue; }
              this.move(o, 'graveyard'); changed = true; continue;
            }
          }
          if (M.hasType(o, 'Planeswalker') && !M.isCreature(o) && (o.counters.LOYALTY || 0) <= 0) { this.move(o, 'graveyard'); changed = true; continue; }
          if (M.hasType(o, 'Battle') && (o.counters.DEFENSE || 0) <= 0 && o.face.raw.df) { this.move(o, 'graveyard'); changed = true; continue; }
          if (M.hasType(o, 'Aura')) {
            const host = this.byId(o.attachedTo);
            if (!host || host.zone !== 'battlefield') { this.move(o, 'graveyard'); changed = true; continue; }
          }
          if (M.hasType(o, 'Equipment') && o.attachedTo) {
            const host = this.byId(o.attachedTo);
            if (!host || host.zone !== 'battlefield' || !M.isCreature(host)) { o.attachedTo = null; this.touch(); }
          }
          if (M.hasType(o, 'Saga') && o.sagaTotal && (o.counters.LORE || 0) >= o.sagaTotal && !this.stack.some(s => s.obj === o && s.chapter) && !this.pendingTriggers.some(t => t.src === o)) {
            this.sacrifice(o); changed = true; continue;
          }
        }
        // legend rule
        const legends = {};
        for (const o of this.battlefield) if (M.hasType(o, 'Legendary')) { const k = o.controller.id + '|' + o.name; (legends[k] = legends[k] || []).push(o); }
        for (const k in legends) if (legends[k].length > 1) {
          const list = legends[k].sort((a, b) => b.enteredTurn - a.enteredTurn || b.id - a.id);
          for (const o of list.slice(1)) { this.move(o, 'graveyard'); changed = true; }
        }
      }
    }

    // ---------------------------------------------------------------- main loop
    async start() {
      try {
        // decide first player
        if (this.mode === 'horde') {
          this.active = this.players[0];
          this.log(`You have a ${this.hordeHeadStart}-turn head start before the horde arrives. Prepare your defenses.`, 'big');
          const extras = [];
          if (this.survivorDraw > 1) extras.push(`you draw ${this.survivorDraw} cards each turn`);
          if (this.hordeRevealCap) extras.push(`the horde reveals at most ${this.hordeRevealCap} cards a turn`);
          if (!this.hordeHaste) extras.push(`horde creatures don't have haste`);
          if (extras.length) this.log(`Rules for this game: ${extras.join('; ')}.`);
          await this.mulligan(this.players[0]);
        } else {
          this.active = this.players[Math.floor(this.rng() * 2)];
          this.log(`${this.active.name} will go first.`, 'big');
          for (const pl of this.players) await this.mulligan(pl);
        }
        let first = true;
        while (!this.over) {
          await this.takeTurn(first);
          first = false;
          this.active = this.opponent(this.active);
        }
      } catch (e) {
        if (e instanceof GameOver) { this.over = true; this.onChange(); return this.winner; }
        throw e;
      }
      return this.winner;
    }

    async mulligan(pl) {
      let count = 0;
      for (;;) {
        pl.library.push(...pl.hand.splice(0)); for (const o of pl.library) o.zone = 'library';
        shuffle(pl.library, this.rng);
        this.draw(pl, 7);
        if (count >= 4) break;
        const keep = await this.ask(pl, { type: 'mulligan', hand: pl.hand.slice(), count, freeMulligan: (this.mode === 'commander' || (this.mode === 'horde' && pl.command.length > 0)) && count === 0 });
        if (keep) break;
        count++;
        this.log(`${pl.name} mulligans.`);
      }
      const free = (this.mode === 'commander' || (this.mode === 'horde' && pl.command.length > 0)) ? 1 : 0;
      const toBottom = Math.max(0, count - free);
      if (toBottom > 0) {
        const chosen = await this.ask(pl, { type: 'chooseCards', prompt: `Put ${toBottom} card(s) on the bottom of your library`, cards: pl.hand.slice(), min: toBottom, max: toBottom, purpose: 'bottom' });
        for (const o of chosen) { pl.hand.splice(pl.hand.indexOf(o), 1); pl.library.push(o); o.zone = 'library'; }
      }
      this.log(`${pl.name} keeps ${pl.hand.length} cards.`);
    }

    async takeTurn(first) {
      this.turn++;
      const ap = this.active;
      if (ap.isHorde && this.hordeSleep > 0) {
        // the horde is still gathering: no turn of its own, and the turn counter doesn't advance
        this.turn--;
        this.hordeSleep--;
        this.log(this.hordeSleep ? `The horde gathers… ${this.hordeSleep + 1} more turns before it arrives.` : 'The horde gathers… it arrives after your next turn!', 'turn');
        this.touch();
        return;
      }
      if (ap.isHorde) this.hordeArrived = true;
      this.log(`— Turn ${this.turn}: ${ap.name} —`, 'turn');
      for (const pl of this.players) { pl.landsPlayed = 0; pl.lifeGainedThisTurn = 0; pl.lifeLostThisTurn = 0; pl.drawnThisTurn = 0; pl.attackedThisTurn = false; if (this.battlefield.filter(o => o.controller === pl).length >= 10) pl.blessing = true; }
      this.turnLog = [];
      this.spellsCastThisTurn = [];
      this.creatureDiedThisTurn = false;
      // untap
      this.step = 'untap';
      for (const o of this.battlefield) {
        if (o.controller === ap) {
          o.sickness = false;
          o.loyaltyUsed = false;
          if (o.tapped && !o.doesntUntap && !this.replacements('Untap').some(r => r.p.Layer === 'CantHappen' && M.matchValid(r.p.ValidCard || 'Card.Self', o, r.ctx))) o.tapped = false;
          o.doesntUntap = false;
        }
        o.dealtDamageThisTurn = false;
      }
      this.touch();
      // upkeep
      await this.runStep('upkeep');
      // draw
      this.step = 'draw';
      if (!first || this.mode === 'commander' && false) this.draw(ap, this.mode === 'horde' && !ap.isHorde ? this.survivorDraw : 1);
      await this.runStep('draw', true);
      // main 1
      await this.runStep('main1');
      // combat
      await this.combat();
      // main 2
      await this.runStep('main2');
      // end
      await this.runStep('end');
      // cleanup
      this.step = 'cleanup';
      while (ap.hand.length > 7) {
        const n = ap.hand.length - 7;
        const chosen = await this.ask(ap, { type: 'chooseCards', prompt: `Discard ${n} card(s) to hand size`, cards: ap.hand.slice(), min: n, max: n, purpose: 'discard' });
        for (const o of chosen) this.discard(ap, o);
        if (!chosen.length) break;
      }
      for (const o of this.battlefield) { o.damage = 0; o.deathtouched = false; o.pumps = o.pumps.filter(p => p.until !== 'eot'); if (o.crewed) o.crewed = false; if (o._revertTo) { o.controller = o._revertTo; o._revertTo = null; } }
      for (const pl of this.players) { pl._failed = null; pl.preventShield = 0; }
      for (const o of this.battlefield) o.preventShield = 0;
      this.effects = this.effects.filter(e => e.duration === 'Permanent' || (e.duration === 'UntilHostLeavesPlay' && e.host && e.host.zone === 'battlefield'));
      for (const pl of this.players) for (const o of pl.hand) o.pumps = [];
      this.touch();
      await this.processTriggers();
      if (this.stack.length) await this.priority();
    }

    async runStep(step, skipPhaseEvent) {
      this.step = step;
      this.emptyPools();
      this.touch();
      if (step === 'main1') {
        // saga lore
        for (const o of this.battlefield.slice()) if (o.controller === this.active && M.hasType(o, 'Saga')) this.addLore(o);
        if (this.active.rad > 0) this.radiation(this.active);
      }
      this.fire({ type: 'phase', step, player: this.active });
      if (step === 'main1' && this.active.isHorde) { await this.processTriggers(); await this.hordeReveal(); }
      await this.priority();
    }
    emptyPools() { for (const pl of this.players) for (const c in pl.pool) pl.pool[c] = 0; }

    // Priority loop until both pass with empty stack
    async priority() {
      let pl = this.active;
      let passes = 0;
      let guard = 0;
      while (guard++ < 2000) {
        this.checkSBA();
        await this.processTriggers();
        this.checkSBA();
        const action = await this.ask(pl, { type: 'priority', step: this.step });
        if (!action || action.kind === 'pass') {
          passes++;
          if (passes >= 2) {
            if (!this.stack.length) return;
            await this.resolveTop();
            passes = 0;
            pl = this.active;
            continue;
          }
          pl = this.opponent(pl);
          continue;
        }
        const ok = await this.perform(pl, action);
        if (ok) passes = 0;
        else if (pl.ctl.isAI) M.AI.noteFailed(this, pl, action);
        this.checkSBA();
      }
    }

    // ---------------------------------------------------------------- actions
    async perform(pl, action) {
      try {
        if (action.kind === 'land') return this.playLand(pl, action.card, action.faceIdx);
        if (action.kind === 'cast') return await M.castSpell(this, pl, action);
        if (action.kind === 'activate') return await M.activate(this, pl, action);
      } catch (e) {
        if (e instanceof GameOver) throw e;
        console.error(e);
        this.log(`(rules error: ${e.message})`, 'err');
        this.touch();
      }
      return false;
    }
    canPlayLand(pl) { return this.active === pl && (this.step === 'main1' || this.step === 'main2') && !this.stack.length && pl.landsPlayed < 1; }
    playLand(pl, o, faceIdx) {
      if (!this.canPlayLand(pl)) return false;
      pl.landsPlayed++;
      pl.hand.splice(pl.hand.indexOf(o), 1);
      o.zone = 'hand';
      this.log(`${pl.name} plays ${M.faceName(o, faceIdx)}.`, 'land');
      o.zone = 'limbo';
      this.move(o, 'battlefield', { controller: pl, faceIdx: faceIdx || 0 });
      this.fire({ type: 'landPlayed', card: o, player: pl });
      return true;
    }

    async resolveTop() {
      const item = this.stack.pop();
      if (!item) return;
      this.touch();
      try { await M.resolveItem(this, item); }
      catch (e) { if (e instanceof GameOver) throw e; console.error(e); this.log(`(rules error resolving ${item.obj && item.obj.name}: ${e.message})`, 'err'); if (item.kind === 'spell' && item.obj.zone === 'stack') { item.obj.zone = 'limbo'; this.move(item.obj, 'graveyard'); } }
      this.touch();
    }

    // ---------------------------------------------------------------- combat
    canAttack(o) {
      if (!M.isCreature(o) || o.tapped || o.controller !== this.active) return false;
      if (o.sickness && !M.hasKW(o, 'Haste')) return false;
      if (M.hasKW(o, 'Defender')) return false;
      if (M.chars(o).cantAttack) return false;
      return true;
    }
    canBlock(b, a) {
      if (!M.isCreature(b) || b.tapped || M.chars(b).cantBlock) return false;
      const ach = M.chars(a);
      if (ach.cantBeBlocked) return false;
      for (const cb of ach.cantBlockBy) if (cb.valid && M.matchValid(cb.valid, b, { game: this, src: cb.src, ctrl: cb.src.controller })) return false;
      if (M.hasKW(a, 'Flying') && !(M.hasKW(b, 'Flying') || M.hasKW(b, 'Reach'))) return false;
      if (M.hasKW(a, 'Shadow') && !M.hasKW(b, 'Shadow')) return false;
      if (!M.hasKW(a, 'Shadow') && M.hasKW(b, 'Shadow')) return false;
      if (M.hasKW(a, 'Horsemanship') && !M.hasKW(b, 'Horsemanship')) return false;
      if (M.hasKW(a, 'Fear') && !(M.hasType(b, 'Artifact') || M.colorsOf(b).has('B'))) return false;
      if (M.hasKW(a, 'Intimidate') && !(M.hasType(b, 'Artifact') || [...M.colorsOf(b)].some(c => M.colorsOf(a).has(c)))) return false;
      if (M.hasKW(a, 'Skulk') && M.power(b) > M.power(a)) return false;
      if (this.protectedFrom(a, b)) return false;
      for (const lt of M.landwalks(a)) if (this.battlefield.some(x => x.controller === b.controller && M.hasType(x, lt))) return false;
      return true;
    }
    async combat() {
      const ap = this.active, dp = this.opponent(ap);
      this.step = 'beginCombat';
      this.fire({ type: 'phase', step: 'beginCombat', player: ap });
      await this.priority();
      const possible = this.battlefield.filter(o => this.canAttack(o));
      if (!possible.length) { this.step = 'endCombat'; return; }
      this.step = 'attackers';
      this.touch();
      const defenders = [dp].concat(this.battlefield.filter(o => o.controller === dp && (M.hasType(o, 'Planeswalker') || M.hasType(o, 'Battle'))));
      let decl = await this.ask(ap, { type: 'attackers', candidates: possible, defenders });
      decl = (decl || []).filter(d => possible.includes(d.attacker) && d.attacker.zone === 'battlefield');
      // must attack
      for (const o of possible) if (M.chars(o).mustAttack && !decl.some(d => d.attacker === o)) decl.push({ attacker: o, defender: dp });
      if (!decl.length) { this.step = 'endCombat'; this.touch(); return; }
      for (const d of decl) {
        const o = d.attacker;
        o.attacking = d.defender || dp;
        o.attackedTurn = this.turn;
        ap.attackedThisTurn = true;
        if (!M.hasKW(o, 'Vigilance')) { o.tapped = true; }
      }
      this.touch();
      this.log(`${ap.name} attacks with ${decl.map(d => d.attacker.name + (d.defender && !d.defender.isPlayer ? ` (→ ${d.defender.name})` : '')).join(', ')}.`, 'combat');
      for (const d of decl) this.fire({ type: 'attacks', card: d.attacker, defender: d.attacker.attacking, defPlayer: dp, count: decl.length });
      this.fire({ type: 'attackersDeclared', player: ap, attackers: decl.map(d => d.attacker), defPlayer: dp });
      await this.priority();
      // blockers
      const attackers = this.battlefield.filter(o => o.attacking);
      if (!attackers.length) { this.endCombat(); return; }
      this.step = 'blockers';
      this.touch();
      const blockersCand = this.battlefield.filter(o => o.controller === dp && M.isCreature(o) && !o.tapped && !M.chars(o).cantBlock && attackers.some(a => this.canBlock(o, a)));
      let blocks = [];
      if (blockersCand.length) blocks = (await this.ask(dp, { type: 'blockers', candidates: blockersCand, attackers })) || [];
      // validate
      const byAtt = new Map();
      const usedBlockers = new Set();
      for (const b of blocks) {
        if (!b.blocker || !b.attacker || usedBlockers.has(b.blocker)) continue;
        if (!this.canBlock(b.blocker, b.attacker)) continue;
        usedBlockers.add(b.blocker);
        if (!byAtt.has(b.attacker)) byAtt.set(b.attacker, []);
        byAtt.get(b.attacker).push(b.blocker);
      }
      for (const [a, bs] of byAtt) {
        if (M.hasKW(a, 'Menace') && bs.length < 2) { byAtt.delete(a); continue; }
        // "can't be blocked except by two or more" / "by more than one"
        const mm = this.staticsOf('MinMaxBlocker').filter(s => M.matchValid(s.p.ValidCard || 'Card.Self', a, s.ctx));
        if (mm.some(s => s.p.Min && bs.length < +s.p.Min)) { byAtt.delete(a); continue; }
        for (const s of mm) if (s.p.Max && bs.length > +s.p.Max) bs.length = +s.p.Max;
      }
      for (const [a, bs] of byAtt) {
        a.wasBlocked = true;
        a.blockedBy = bs.map(b => b.id);
        for (const b of bs) b.blocking = [a.id];
      }
      this.touch();
      if (byAtt.size) this.log(`${dp.name} blocks: ${[...byAtt].map(([a, bs]) => `${bs.map(b => b.name).join(' + ')} → ${a.name}`).join('; ')}.`, 'combat');
      else this.log(`${dp.name} doesn't block.`, 'combat');
      for (const [a, bs] of byAtt) { for (const b of bs) { this.fire({ type: 'blocks', card: b, attacker: a }); this.fire({ type: 'blockedBy', card: a, blocker: b }); } this.fire({ type: 'blocked', card: a, blockers: bs }); }
      for (const a of attackers) if (!a.wasBlocked) this.fire({ type: 'unblocked', card: a });
      await this.priority();
      // damage
      const all = this.battlefield.filter(o => o.attacking || o.blocking.length);
      const hasFS = all.some(o => M.hasKW(o, 'First Strike') || M.hasKW(o, 'Double Strike'));
      if (hasFS) {
        this.step = 'firstStrike';
        this.combatDamage(true);
        this.checkSBA();
        await this.priority();
      }
      this.step = 'damage';
      this.combatDamage(false, hasFS);
      this.checkSBA();
      await this.priority();
      this.endCombat();
    }
    endCombat() {
      this.step = 'endCombat';
      for (const o of this.battlefield) { o.attacking = null; o.blocking = []; o.blockedBy = []; o.wasBlocked = false; }
      this.touch();
    }
    combatDamage(firstStrikeStep, hadFS) {
      const deals = (o) => {
        const fs = M.hasKW(o, 'First Strike'), ds = M.hasKW(o, 'Double Strike');
        if (firstStrikeStep) return fs || ds;
        if (!hadFS) return true;
        return ds || !fs && !o._dealtFS;
      };
      const events = [];
      const attackers = this.battlefield.filter(o => o.attacking);
      for (const a of attackers) {
        if (!deals(a)) continue;
        if (firstStrikeStep) a._dealtFS = true;
        let dmg = Math.max(0, M.power(a));
        if (dmg <= 0) continue;
        const blockers = a.blockedBy.map(id => this.byId(id)).filter(b => b && b.zone === 'battlefield');
        if (a.wasBlocked && !blockers.length) {
          if (M.hasKW(a, 'Trample')) events.push([a, a.attacking, dmg]);
          continue;
        }
        if (!a.wasBlocked) { events.push([a, a.attacking, dmg]); continue; }
        // assign lethal in order
        const dt = M.hasKW(a, 'Deathtouch');
        for (let i = 0; i < blockers.length; i++) {
          const b = blockers[i];
          const lethal = Math.max(0, dt ? (b.damage > 0 ? 0 : 1) : M.toughness(b) - b.damage);
          const last = i === blockers.length - 1;
          let give = last && !M.hasKW(a, 'Trample') ? dmg : Math.min(dmg, Math.max(lethal, 0));
          if (give > 0) events.push([a, b, give]);
          dmg -= give;
          if (dmg <= 0) break;
        }
        if (dmg > 0 && M.hasKW(a, 'Trample')) events.push([a, a.attacking, dmg]);
      }
      for (const b of this.battlefield.filter(o => o.blocking.length)) {
        if (!deals(b)) continue;
        if (firstStrikeStep) b._dealtFS = true;
        const a = this.byId(b.blocking[0]);
        if (!a || a.zone !== 'battlefield') continue;
        const dmg = Math.max(0, M.power(b));
        if (dmg > 0) events.push([b, a, dmg]);
      }
      if (this.fogTurn === this.turn) { events.length = 0; }
      for (const [s, t, n] of events) {
        let tgt = t;
        if (tgt && !tgt.isPlayer && tgt.zone !== 'battlefield') continue;
        this.dealDamage(s, tgt, n, true);
      }
      if (!firstStrikeStep) for (const o of this.battlefield) o._dealtFS = false;
      if (events.length) {
        const toPlayers = events.filter(e => e[1] && e[1].isPlayer);
        const total = toPlayers.reduce((a, e) => a + e[2], 0);
        if (total) this.log(`Combat damage: ${toPlayers[0][1].name} takes ${total}.`, 'combat');
      }
    }
  }
  M.Game = Game;

  function matchLKI(valid, card, lki, ctx) {
    // evaluate validity using last-known information
    const fakeCtx = Object.assign({}, ctx);
    const saved = { controller: card.controller, zone: card.zone, counters: card.counters, isToken: card.isToken };

      if (fb) mana = M.parseMana(fb.slice('Flashback:'.length).split('|')[0]);
    }
    if (mana.none) return null;
    let extra = 0;
    if (from === 'command') extra += 2 * (pl.cmdCasts[o.id] || 0);
    extra -= reduceCost(g, pl, o, f);
    const sa = spellAbility(f);
    let addl = null;
    if (sa && sa.p.Cost) { addl = M.parseAbilityCost(sa.p.Cost); addl.mana = M.parseMana(''); addl.mana.none = false; }
    // generic reduction can't go below 0; reductions can eat into generic only
    const m2 = { generic: mana.generic, pips: mana.pips.slice(), x: mana.x, raw: mana.raw };
    if (extra < 0) { m2.generic = Math.max(0, m2.generic + extra); extra = 0; }
    // Delve: exile cards from your graveyard to pay for generic mana
    let delve = 0;
    if (f.keywords.includes('Delve')) { delve = Math.min(m2.generic, pl.graveyard.filter(x => x !== o).length); m2.generic -= delve; }
    return { face: f, mana: m2, extra, addl, delve };
  };

  M.canCastNow = function (g, pl, o, f) {
    const instantSpeed = f.types.includes('Instant') || f.keywords.includes('Flash') || g.battlefield.some(src => src.controller === pl && src.face.statics.some(st => /CastWithFlash/.test(st.p.Mode || '') && M.matchValid(st.p.ValidCard || 'Card', o, { game: g, src, ctrl: pl, lenient: true })));
    if (instantSpeed) return true;
    return g.active === pl && (g.step === 'main1' || g.step === 'main2') && g.stack.length === 0;
  };

  function castBlocked(g, pl, o) {
    for (const src of g.battlefield.concat(g.effects)) for (const st of src.face.statics) {
      if (!/CantBeCast/.test(st.p.Mode || '')) continue;
      const ctx = { game: g, src, ctrl: src.controller };
      if (st.p.Caster && !M.matchValid(st.p.Caster, pl, ctx)) continue;
      if (st.p.ValidCard && !M.matchValid(st.p.ValidCard, o, ctx)) continue;
      if (!M.checkConditions(st.p, ctx, src.face)) continue;
      return true;
    }
    return false;
  }

  // ---------------------------------------------------------------- legal actions
  M.legalActions = function (g, pl) {
    const acts = [];
    if (g.over) return acts;
    // lands
    if (g.canPlayLand(pl)) {
      for (const o of pl.hand) {
        const faces = o.def.alt === 'Modal' ? [0, 1] : [0];
        for (const fi of faces) { const f = M.face(o.def.faces[fi]); if (f.types.includes('Land')) acts.push({ kind: 'land', card: o, faceIdx: fi, label: `Play ${f.name}` }); }
      }
    }
    const zonesToCast = [['hand', pl.hand], ['command', pl.command.filter(x => !x.emblem)], ['graveyard', pl.graveyard.filter(x => x.def.faces.some(r => (r.K || []).some(k => k.startsWith('Flashback:'))))], ['exile', pl.exile.filter(x => x.adventure)]];
    for (const [from, list] of zonesToCast) {
      for (const o of list) {
        if (castBlocked(g, pl, o)) continue;
        for (const fi of M.castableFaces(o)) {
          if (from === 'exile' && fi !== 0) continue;
          const f = M.face(o.def.faces[fi] || o.def.faces[0]);
          if (f.types.includes('Land')) continue;
          if (from === 'graveyard' && !f.keywords.some(k => k.startsWith('Flashback:'))) continue;
          if (!M.canCastNow(g, pl, o, f)) continue;
          const info = M.spellCostInfo(g, pl, o, fi, from);
          if (!info) continue;
          if (info.addl && !M.canPayCost(g, pl, o, info.addl, 0)) continue;
          g.costHelp = M.costHelpFor(pl, f);
          const payable = M.planPayment(g, pl, info.mana, info.extra);
          g.costHelp = null;
          if (!payable) continue;
          if (!quickTargetsOK(g, pl, o, f)) continue;
          acts.push({ kind: 'cast', card: o, faceIdx: fi, from, label: `Cast ${f.name}${from === 'graveyard' ? ' (flashback)' : from === 'command' ? ' (from command zone)' : from === 'exile' ? ' (from adventure)' : ''}` });
        }
      }
    }
    // activated abilities
    for (const o of g.battlefield) {
      if (o.controller !== pl) continue;
      const abs = M.activatedAbilities(g, o, 'battlefield');
      for (const ab of abs) if (M.canActivate(g, pl, o, ab)) acts.push({ kind: 'activate', card: o, ab, label: ab.label });
    }
    for (const o of pl.hand) for (const ab of M.activatedAbilities(g, o, 'hand')) if (M.canActivate(g, pl, o, ab)) acts.push({ kind: 'activate', card: o, ab, label: ab.label });
    for (const o of pl.graveyard) for (const ab of M.activatedAbilities(g, o, 'graveyard')) if (M.canActivate(g, pl, o, ab)) acts.push({ kind: 'activate', card: o, ab, label: ab.label });
    return acts;
  };

  function quickTargetsOK(g, pl, o, f) {
    // check that a targeted spell has at least one target for its first node
    const sa = spellAbility(f);
    if (M.hasType({ face: f, def: o.def, pumps: [], counters: {} }, 'Aura') || f.sub.includes('Aura')) {
      const en = f.keywords.find(k => k.startsWith('Enchant:'));
      if (en) {
        const valid = en.split(':')[1];
        const fake = { isStackItem: true, obj: o, controller: pl, node: null };
        const node = { p: { ValidTgts: valid }, face: f };
        return M.targetCandidates(g, fake, node, pl).length > 0;
      }
      return true;
    }
    if (!sa) return true;
    const node = M.buildTree(sa.str, f);
    if (!node) return true;
    if (node.choices) {
      // a modal spell is playable if at least one mode has what it needs to target
      const fake = { isStackItem: true, obj: o, controller: pl, node, x: 0 };
      return node.choices.some(c => ![...walk(c)].some(cc => M.nodeNeedsTargets(cc) && cc.p.TargetMin !== '0' && M.targetCandidates(g, fake, cc, pl).length === 0));
    }
    if (!M.nodeNeedsTargets(node)) return true;
    const min = node.p.TargetMin != null ? M.evalNum(node.p.TargetMin, { game: g, src: o, ctrl: pl }, f) : 1;
    if (min === 0) return true;
    const fake = { isStackItem: true, obj: o, controller: pl, node, x: 0 };
    return M.targetCandidates(g, fake, node, pl).length >= min;
  }

  // abilities usable from a zone, including keyword-derived ones
  M.activatedAbilities = function (g, o, zone) {
    const f = o.face;
    const key = zone + ':' + o.faceIdx;
    o._abCache = o._abCache || {};
    if (o._abCache[key]) return o._abCache[key];
    const out = [];
    for (const ab of f.abilities) {
      if (ab.kind !== 'AB') continue;
      const p = ab.p;
      const azone = (p.ActivationZone || 'Battlefield').toLowerCase();
      if (azone !== zone) continue;
      if (p.API === 'ManaReflected' && zone === 'battlefield') continue;
      if (p.API === 'Mana' && zone === 'battlefield') {
        // simple tap-mana abilities are auto-used for payment; others are shown
        const parts = (p.Cost || '').trim().split(/\s+/);
        if (parts.length === 1 && parts[0] === 'T') continue;
        if (/Sac<1\/CARDNAME/.test(p.Cost || '') && parts.length <= 2) continue;
      }
      out.push({ str: ab.str, p, cost: M.parseAbilityCost(p.Cost), label: abilityLabel(o, ab.str, p), pw: p.Planeswalker === 'True', idx: ab.idx });
    }
    for (const k of f.keywords) {
      const parts = k.split(':');
      if (parts[0] === 'Equip' && zone === 'battlefield') {
        const cost = parts[1];
        const valid = parts[2] && !/^\d/.test(parts[2]) && parts[2].includes('.') ? parts[2] : 'Creature.YouCtrl';
        out.push({ str: `AB$ Attach | Cost$ ${cost} | ValidTgts$ ${valid} | SorcerySpeed$ True`, p: M.parseParams(`AB$ Attach | Cost$ ${cost} | ValidTgts$ ${valid} | SorcerySpeed$ True`), cost: M.parseAbilityCost(cost), label: `Equip {${cost}}`, kw: 'Equip' });
      }
      if (parts[0] === 'Cycling' && zone === 'hand') {
        const cost = parts[1];
        out.push({ str: 'AB$ Draw | NumCards$ 1', p: { AB: 'Draw', NumCards: '1' }, cost: Object.assign(M.parseAbilityCost(cost), { discardSelf: true }), label: `Cycling {${cost}}`, kw: 'Cycling', instant: true });
      }
      if (parts[0] === 'TypeCycling' && zone === 'hand') {
        const type = parts[1], cost = parts[2];
        const s = `AB$ ChangeZone | Origin$ Library | Destination$ Hand | ChangeType$ ${type} | ChangeNum$ 1`;
        out.push({ str: s, p: M.parseParams(s), cost: Object.assign(M.parseAbilityCost(cost), { discardSelf: true }), label: `${type}cycling {${cost}}`, kw: 'Cycling', instant: true });
      }
      if (parts[0] === 'Crew' && zone === 'battlefield') {
        const n = +parts[1] || 1;
        out.push({ str: `AB$ Crew | Power$ ${n}`, p: { AB: 'Crew', Power: String(n) }, cost: M.parseAbilityCost(''), label: `Crew ${n}`, kw: 'Crew', instant: true });
      }
      if (parts[0] === 'Unearth' && zone === 'graveyard') {
        const cost = parts[1];
        out.push({ str: 'AB$ ChangeZone | Defined$ Self | Origin$ Graveyard | Destination$ Battlefield | Unearth$ True', p: M.parseParams('AB$ ChangeZone | Defined$ Self | Origin$ Graveyard | Destination$ Battlefield | Unearth$ True'), cost: M.parseAbilityCost(cost), label: `Unearth {${cost}}`, kw: 'Unearth', sorcery: true });
      }
      if (parts[0] === 'Ninjutsu' || parts[0] === 'Level up') { /* not implemented */ }
    }
    o._abCache[key] = out;
    return out;
  };
  function abilityLabel(o, str, p) {
    const cost = (p.Cost || '').replace(/AddCounter<(\d+)\/LOYALTY>/, '+$1').replace(/SubCounter<(\w+)\/LOYALTY>/, '−$1').replace(/Sac<1\/CARDNAME[^>]*>/, 'Sac').replace(/\bT\b/, '⟳');
    const ox = o.face.oracle.split('\n');
    // try to find the oracle line for this ability
    let desc = '';
    if (p.Planeswalker) {
      const sign = /AddCounter<(\d+)/.exec(p.Cost || ''); const sub = /SubCounter<(\w+)/.exec(p.Cost || '');
      const tag = sign ? `[+${sign[1]}]` : sub ? `[−${sub[1]}]` : '[0]';
      const line = ox.find(l => l.startsWith(tag) || l.startsWith(tag.replace('−', '-')));
      desc = line || '';
    } else {
      const apiName = { Draw: 'Draw', DealDamage: 'Damage', Pump: 'Pump', Token: 'Token', Destroy: 'Destroy', GainLife: 'Gain life', PutCounter: 'Counters', ChangeZone: 'Move', Mana: 'Mana', Scry: 'Scry' }[p.API] || p.API;
      desc = apiName;
    }
    return desc && p.Planeswalker ? desc : `${cost || '—'}: ${desc}`;
  }

  M.canActivate = function (g, pl, o, ab) {
    const p = ab.p;
    if (ab.cost.unsupported) return false;
    if (o.detainUntil && o.detainUntil > g.turn) return false;
    if (o.zone === 'battlefield' && g.staticsOf && g.staticsOf('CantBeActivated').some(s => M.matchValid(s.p.ValidCard || 'Card.Self', o, s.ctx) && !(s.p.ValidSA && /Activated/.test(s.p.ValidSA) && ab.p.API === 'Mana' && false))) return false;
    const sorcery = ab.sorcery || p.SorcerySpeed === 'True' || ab.pw;
    if (sorcery && !(g.active === pl && (g.step === 'main1' || g.step === 'main2') && !g.stack.length)) return false;
    if (ab.pw && o.loyaltyUsed) return false;
    if (p.ActivationLimit && (o._actCount || {})[ab.str] >= +p.ActivationLimit) return false;
    if (p.PlayerTurn === 'True' && g.active !== pl) return false;
    if (!M.checkConditions(p, { game: g, src: o, ctrl: pl }, o.face)) return false;
    if (ab.kw === 'Crew') {
      if (M.isCreature(o)) return false;
      const pw = g.battlefield.filter(x => x.controller === pl && x !== o && M.isCreature(x) && !x.tapped).reduce((a, x) => a + Math.max(0, M.power(x)), 0);
      if (pw < +p.Power) return false;
      return true;
    }
    if (ab.kw === 'Equip') {
      if (!g.battlefield.some(x => x.controller === pl && M.isCreature(x) && x.id !== o.attachedTo)) return false;
    }
    if (!M.canPayCost(g, pl, o, ab.cost, 0)) return false;
    // targets available?
    const node = M.buildTree(ab.str, o.face);
    if (node && M.nodeNeedsTargets(node)) {
      const min = node.p.TargetMin != null ? M.evalNum(node.p.TargetMin, { game: g, src: o, ctrl: pl }, o.face) : 1;
      if (min > 0) {
        const fake = { isStackItem: true, obj: o, controller: pl, node };
        if (M.targetCandidates(g, fake, node, pl).length < min) return false;
      }
    }
    return true;
  };

  // ---------------------------------------------------------------- casting
  M.castSpell = async function (g, pl, action) {
    const o = action.card;
    const fi = action.faceIdx || 0;
    const from = action.from || 'hand';
    const info = M.spellCostInfo(g, pl, o, fi, from);
    if (!info) return false;
    const f = info.face;
    const item = { isStackItem: true, kind: 'spell', obj: o, controller: pl, faceIdx: fi, face: f, x: 0, kicked: 0, from, id: M.uid() };
    // X
    let xCount = info.mana.x;
    if (xCount) {
      const avail = M.totalManaAvailable(g, pl) - M.manaValue(info.mana) - Math.max(0, info.extra);
      const x = await g.ask(pl, { type: 'x', card: o, max: Math.max(0, Math.floor(avail / xCount)), prompt: `Choose X for ${f.name}` });
      if (x == null) return false;
      item.x = Math.max(0, x | 0);
    }
    // Kicker
    let kickMana = null;
    const kk = f.keywords.find(k => k.startsWith('Kicker:'));
    if (kk) {
      const kc = M.parseMana(kk.slice(7).split(':')[0]);
      const total = { generic: info.mana.generic + kc.generic + item.x * xCount, pips: info.mana.pips.concat(kc.pips), x: 0 };
      if (!kk.slice(7).match(/[A-Z][a-z]/) && M.planPayment(g, pl, total, info.extra)) {
        const yes = await g.ask(pl, { type: 'yesno', prompt: `Pay kicker {${kk.slice(7)}} for ${f.name}?`, card: o, purpose: 'kicker' });
        if (yes) { item.kicked = 1; kickMana = kc; }
      }
    }
    // build tree
    if (isPermanentFace(f)) {
      if (f.sub.includes('Aura')) {
        const en = f.keywords.find(k => k.startsWith('Enchant:'));
        const valid = en ? en.split(':')[1] : 'Creature';
        item.node = { api: 'Attach', kind: 'SP', p: { ValidTgts: valid }, face: f, targets: [], aura: true };
      } else item.node = null;
    } else {
      const sa = spellAbility(f);
      item.node = sa ? M.buildTree(sa.str, f) : null;
    }
    // targets & modes
    if (item.node) {
      const ok = await M.chooseTargetsForTree(g, item, pl);
      if (!ok) return false;
    }
    // pay
    const mana = { generic: info.mana.generic + item.x * xCount + (kickMana ? kickMana.generic : 0), pips: info.mana.pips.concat(kickMana ? kickMana.pips : []), x: 0 };
    o.zone_before = o.zone;
    const addl = info.addl;
    g.costHelp = M.costHelpFor(pl, f);
    try {
    if (addl) {
      addl.mana = mana;
      // pay additional (sac/discard etc.) + mana together
      const savedZone = o.zone;
      if (!(await M.payCost(g, pl, o, addl, info.extra, item))) return false;
    } else if (mana.generic || mana.pips.length || info.extra > 0) {
      if (!M.payMana(g, pl, mana, info.extra, [])) return false;
    }
    } finally { g.costHelp = null; }
    if (info.delve) {
      // exile the least useful graveyard cards: lands first, then the cheapest
      const pool = pl.graveyard.filter(x => x !== o).sort((a, b) => (M.hasType(b, 'Land') - M.hasType(a, 'Land')) || (M.manaValue(a.face.cost) - M.manaValue(b.face.cost)));
      for (const x of pool.slice(0, info.delve)) { x.zone = 'graveyard'; g.removeFromZone(x); x.zone = 'limbo'; g.move(x, 'exile'); }
      g.log(`${pl.name} exiles ${info.delve} card(s) from their graveyard for delve.`);
    }
    // move to stack
    const zoneArr = from === 'hand' ? pl.hand : from === 'command' ? pl.command : from === 'graveyard' ? pl.graveyard : pl.exile;
    const i = zoneArr.indexOf(o);
    if (i >= 0) zoneArr.splice(i, 1);
    if (from === 'command') pl.cmdCasts[o.id] = (pl.cmdCasts[o.id] || 0) + 1;
    o.zone = 'stack';
    o.castInfo = { from, by: pl.id, turn: g.turn };
    o.faceIdx = fi;
    o.kicked = item.kicked;
    o.xPaid = item.x;
    if (from === 'graveyard') item.flashback = true;
    if ((o.def.alt === 'Adventure' || o.def.alt === 'Omen') && fi === 1) item.adventure = true;
    g.stack.push(item);
    g.spellsCastThisTurn.push({ player: pl, card: o });
    g.log(`${pl.name} casts ${f.name}${item.x ? ` (X=${item.x})` : ''}${item.kicked ? ' (kicked)' : ''}${M.describeTargets(item)}.`, 'cast');
    g.touch();
    g.fire({ type: 'cast', card: o, player: pl, item });
    M.fireTargeted(g, item);
    // storm: copy it for each other spell cast this turn
    if (f.keywords.includes('Storm')) {
      const n = g.spellsCastThisTurn.length - 1;
      for (let i = 0; i < n; i++) {
        const cp = Object.assign({}, item, { id: M.uid(), copy: true, kind: 'ability', obj: o });
        cp.node = M.buildTree(item.node ? item.node.str || '' : '', f) || item.node;
        if (cp.node) { cp.node.targets = []; if (!(await M.chooseTargetsForTree(g, cp, pl))) continue; }
        g.stack.push(cp);
      }
      if (n > 0) g.log(`Storm: ${f.name} is copied ${n} time${n === 1 ? '' : 's'}.`, 'cast');
    }
    // cascade
    if (f.keywords.includes('Cascade')) await M.cascade(g, pl, o);
    return true;
  };

  M.cascade = async function (g, pl, src) {
    const cmc = src.face.cmc;
    const exiled = [];
    while (pl.library.length) {
      const c = pl.library.shift(); c.zone = 'exile'; pl.exile.push(c); exiled.push(c);
      const f = c.face;
      if (!f.types.includes('Land') && f.cmc < cmc && !f.cost.none) {
        const yes = await g.ask(pl, { type: 'yesno', prompt: `Cascade: cast ${f.name} for free?`, card: c });
        if (yes) {
          pl.exile.splice(pl.exile.indexOf(c), 1);
          const item = { isStackItem: true, kind: 'spell', obj: c, controller: pl, faceIdx: 0, face: f, x: 0, kicked: 0, from: 'exile', id: M.uid() };
          if (isPermanentFace(f)) { if (f.sub.includes('Aura')) { const en = f.keywords.find(k => k.startsWith('Enchant:')); item.node = { api: 'Attach', kind: 'SP', p: { ValidTgts: en ? en.split(':')[1] : 'Creature' }, face: f, targets: [], aura: true }; } }
          else { const sa = spellAbility(f); item.node = sa ? M.buildTree(sa.str, f) : null; }
          if (!item.node || await M.chooseTargetsForTree(g, item, pl)) {
            c.zone = 'stack'; g.stack.push(item); g.log(`${pl.name} cascades into ${f.name}.`, 'cast');
            exiled.splice(exiled.indexOf(c), 1);
          } else { pl.exile.push(c); }
        }
        break;
      }
    }
    for (const c of exiled) { const i = pl.exile.indexOf(c); if (i >= 0) pl.exile.splice(i, 1); c.zone = 'library'; pl.library.push(c); }
  };

  M.activate = async function (g, pl, action) {
    const o = action.card, ab = action.ab;
    if (!M.canActivate(g, pl, o, ab)) return false;
    if (ab.kw === 'Crew') {
      const need = +ab.p.Power;
      const cands = g.battlefield.filter(x => x.controller === pl && x !== o && M.isCreature(x) && !x.tapped);
      const ch = await g.ask(pl, { type: 'chooseCards', prompt: `Tap creatures with total power ${need}+ to crew ${o.name}`, cards: cands, min: 1, max: cands.length, purpose: 'crew', need, card: o });
      if (!ch || ch.reduce((a, x) => a + M.power(x), 0) < need) return false;
      for (const x of ch) x.tapped = true;
      o.crewed = true;
      g.log(`${pl.name} crews ${o.name}.`);
      g.touch();
      return true;
    }
    const item = { isStackItem: true, kind: 'ability', obj: o, controller: pl, x: 0, kicked: o.kicked, id: M.uid(), face: o.face, ab };
    item.node = M.buildTree(ab.str, o.face);
    if (!item.node) return false;
    if (ab.cost.mana.x || (ab.cost.subCounter && ab.cost.subCounter.x)) {
      const max = ab.cost.subCounter && ab.cost.subCounter.x ? (o.counters[ab.cost.subCounter.type] || 0) : Math.max(0, M.totalManaAvailable(g, pl) - M.manaValue(ab.cost.mana));
      const x = await g.ask(pl, { type: 'x', card: o, max, prompt: `Choose X for ${o.name}` });
      if (x == null) return false;
      item.x = x | 0;
    }
    const ok = await M.chooseTargetsForTree(g, item, pl);
    if (!ok) return false;
    const cost = Object.assign({}, ab.cost);
    if (cost.mana.x) cost.mana = { generic: cost.mana.generic + item.x * cost.mana.x, pips: cost.mana.pips, x: 0 };
    if (!(await M.payCost(g, pl, o, cost, 0, item))) return false;
    if (ab.pw) o.loyaltyUsed = true;
    o._actCount = o._actCount || {}; o._actCount[ab.str] = (o._actCount[ab.str] || 0) + 1;
    // mana abilities resolve immediately
    if (ab.p.API === 'Mana') { await M.resolveItem(g, item); return true; }
    g.stack.push(item);
    g.log(`${pl.name} activates ${o.name}: ${ab.label}${M.describeTargets(item)}.`, 'cast');
    g.touch();
    if (ab.kw === 'Cycling') g.fire({ type: 'cycled', card: o, player: pl });
    M.fireTargeted(g, item);
    return true;
  };
  // "becomes the target of a spell or ability" (heroic and friends), once per thing targeted
  M.fireTargeted = function (g, item) {
    const seen = new Set();
    for (const n of walk(item.node)) for (const t of n.targets || []) {
      const th = M.refThing(t);
      if (!th || seen.has(th)) continue;
      seen.add(th);
      g.fire({ type: 'targeted', target: th, source: item.obj, item, player: item.controller });
    }
  };

  M.describeTargets = function (item) {
    const ts = [];
    for (const n of walk(item.node)) for (const t of n.targets || []) { const th = M.refThing(t); if (th) ts.push(th.isPlayer ? th.name : th.isStackItem ? (th.obj ? th.obj.name : 'ability') : th.name); }
    return ts.length ? ` targeting ${ts.join(', ')}` : '';
  };
  M.describeItem = function (g, item) {

  API.Token = async (g, node, ctx) => {

  API.ChangeZone = async (g, node, ctx) => {
    const p = node.p;
    const origin = (p.Origin || '').split(',').map(s => s.trim());
    const dest = p.Destination || 'Hand';
    const hidden = p.Hidden === 'True' || (p.ChangeType && origin.some(z => z === 'Library' || z === 'Hand') && !ownTargets(node).length && !p.Defined);
    if (hidden) {
      // search
      const who = p.DefinedPlayer ? players(resolveDefined(p.DefinedPlayer, ctx, node)) : [ctx.ctrl];
      const chooser = p.Chooser ? (players(resolveDefined(p.Chooser, ctx, node))[0] || ctx.ctrl) : ctx.ctrl;
      for (const pl of who) {
        let pool = [];
        for (const z of origin) pool.push(...(pl[ZONE[z] || z.toLowerCase()] || []));
        const valid = p.ChangeType || 'Card';
        pool = pool.filter(o => M.matchValid(valid, o, Object.assign({}, ctx, { lenient: true })));
        const num = p.ChangeNum === 'All' ? pool.length : n(p.ChangeNum, ctx, node, 1);
        const min = p.Mandatory === 'True' ? Math.min(num, pool.length) : 0;
        const picked = await chooseCards(g, chooser, pool, min, num, `Search: choose up to ${num} ${p.ChangeTypeDesc || valid}`, 'search', { dest, card: ctx.src });
        for (const o of picked) await moveTo(g, o, dest, node, ctx);
        if (picked.length) g.log(`${chooser.name} search${chooser.id === 0 && !chooser.isAI ? "" : "es"}: ${picked.map(o => (dest === 'Hand' && chooser.isAI && pl === chooser) ? 'a card' : o.name).join(', ')} → ${dest.toLowerCase()}.`);
        remember(ctx, node, picked);
        if (origin.includes('Library') && p.Shuffle !== 'False') shuffle(g, pl);
      }
      return;
    }
    // no target and nothing named: an ability that moves the card itself ("Return this to its owner's hand")
    const selfMove = !p.Defined && !p.ValidTgts && !node.parent && !p.ChangeType;
    const objs = cards(affected(node, ctx, p.Defined ? null : selfMove ? 'self' : 'parent')).filter(o => !o.isStackItem);
    const moved = [];
    for (const o of objs) {
      const fromZoneOk = !p.Origin || origin.some(z => (ZONE[z] || z.toLowerCase()) === o.zone) || p.Origin === 'Any';
      if (!fromZoneOk) continue;
      if (dest === 'Battlefield' && p.Origin === 'Battlefield' && p.Destination === 'Battlefield') continue;
      await moveTo(g, o, dest, node, ctx);
      moved.push(o);
    }
    if (moved.length) g.log(`${moved.map(o => o.name).join(', ')} → ${dest.toLowerCase()}.`);
    remember(ctx, node, moved);
  };

  API.ChangeZoneAll = async (g, node, ctx) => {
    const p = node.p;
    const origin = (p.Origin || 'Battlefield').split(',').map(s => ZONE[s.trim()] || s.trim().toLowerCase());
    const valid = p.ChangeType || 'Card';
    let pool = [];
    for (const z of origin) pool.push(...(z === 'battlefield' ? g.battlefield : g.allIn(z)));
    if (p.Defined) { const who = players(resolveDefined(p.Defined, ctx, node)); pool = pool.filter(o => who.includes(o.owner) || who.includes(o.controller)); }
    pool = pool.filter(o => M.matchValid(valid, o, ctx));

    if (pool.length) g.log(`${pool.length} card(s) → ${(p.Destination || 'graveyard').toLowerCase()}.`);

    if (origin.includes('library') && p.Shuffle !== 'False') for (const pl of g.players) shuffle(g, pl);

  API.Counter = async (g, node, ctx) => {
    const items = (node.targets || []).map(M.refThing).filter(x => x && x.isStackItem);
    const defined = node.p.Defined ? resolveDefined(node.p.Defined, ctx, node).filter(x => x && x.isStackItem) : [];
    for (const it of items.concat(defined)) {
      const i = g.stack.indexOf(it);
      if (i < 0) continue;
      // "can't be countered"
      if (it.kind === 'spell' && (g.replacements('Counter').some(r => r.p.Layer === 'CantHappen' && M.matchValid(r.p.ValidSA || 'Spell', it, r.ctx)) || (it.face.repl || []).some(r => r.p.Event === 'Counter' && /Self/.test(r.p.ValidSA || r.p.ValidCard || '')) || (it.face.keywords || []).some(k => /can't be countered/i.test(k)))) { g.log(`${it.face.name} can't be countered.`); continue; }
      g.stack.splice(i, 1);
      g.log(`${it.kind === 'spell' ? it.face.name : (it.obj ? it.obj.name + "'s ability" : 'Ability')} is countered.`, 'fizzle');
      if (it.kind === 'spell') {
        it.obj.zone = 'limbo';
        const d = node.p.Destination === 'Exile' ? 'exile' : node.p.Destination === 'Hand' ? 'hand' : node.p.Destination === 'Library' ? 'library' : (it.flashback ? 'exile' : 'graveyard');
        g.move(it.obj, d, d === 'library' && node.p.LibraryPosition === '-1' ? { bottom: true } : {});
        remember(ctx, node, [it.obj]);
      }
    }
  };

  API.Discard = async (g, node, ctx) => {
    const p = node.p;
    const ps = players(affected(node, ctx, 'you'));
    const mode = p.Mode || 'TgtChoose';
    const num = p.NumCards === 'X' ? n('X', ctx, node, 0) : n(p.NumCards, ctx, node, 1);
    for (const pl of ps) {
      let chosen = [];
      if (mode === 'Hand') chosen = pl.hand.slice();
      else if (mode === 'Random') { const h = pl.hand.slice(); for (let i = 0; i < num && h.length; i++) chosen.push(h.splice(Math.floor(g.rng() * h.length), 1)[0]); }
      else if (mode === 'RevealYouChoose' || mode === 'RevealDiscardAll' || mode === 'LookYouChoose') {
        const v = p.DiscardValid || 'Card';
        const pool = pl.hand.filter(o => M.matchValid(v, o, Object.assign({}, ctx, { lenient: true })));
        chosen = await chooseCards(g, ctx.ctrl, pool, Math.min(num, pool.length), num, `Choose card(s) for ${pl.name} to discard`, 'oppDiscard', { reveal: pl.hand.slice() });
      } else {

        const pool = pl.hand.filter(o => M.matchValid(v, o, Object.assign({}, ctx, { lenient: true })));
        chosen = await chooseCards(g, pl, pool, Math.min(num, pool.length), num, `Discard ${num} card(s)`, 'discard');

      for (const o of chosen) g.discard(pl, o);

  API.Scry = async (g, node, ctx) => {
    const ps = players(affected(node, ctx, 'you'));
    const num = n(node.p.ScryNum, ctx, node, 1);
    for (const pl of ps) {
      const top = pl.library.slice(0, num);
      if (!top.length) continue;
      const res = await g.ask(pl, { type: 'scry', cards: top, prompt: `Scry ${num}: choose cards to put on the bottom` });
      const bottom = (res && res.bottom) || [];
      const keep = (res && res.top) || top.filter(o => !bottom.includes(o));
      pl.library.splice(0, top.length);
      pl.library.unshift(...keep);
      pl.library.push(...bottom);
      g.log(`${pl.name} scries ${num}${bottom.length ? ` (${bottom.length} to bottom)` : ''}.`);
    }

  API.Dig = async (g, node, ctx) => {
    const p = node.p;
    const pl = players(affected(node, ctx, 'you'))[0] || ctx.ctrl;
    const num = n(p.DigNum, ctx, node, 1);
    const top = pl.library.slice(0, num);
    if (!top.length) return;
    const valid = p.ChangeValid || 'Card';
    const elig = top.filter(o => M.matchValid(valid, o, Object.assign({}, ctx, { lenient: true })));
    const changeNum = p.ChangeNum === 'All' ? elig.length : n(p.ChangeNum, ctx, node, 1);
    const dest1 = p.DestinationZone || 'Hand';
    const optional = p.AnyNumber === 'True' || p.Optional === 'True' || p.ChangeValid != null;
    const picked = changeNum >= elig.length && p.ChangeNum === 'All' ? elig : await chooseCards(g, ctx.ctrl, elig, optional ? 0 : Math.min(changeNum, elig.length), changeNum, `Look at the top ${num}: choose ${changeNum} for ${dest1.toLowerCase()}`, 'dig', { dest: dest1, shown: top });
    for (const o of picked) {
      const z = ZONE[dest1] || dest1.toLowerCase();
      if (z === 'library') { const i = pl.library.indexOf(o); pl.library.splice(i, 1); pl.library.unshift(o); }
      else if (z === 'battlefield') g.move(o, 'battlefield', { tapped: p.Tapped === 'True', controller: ctx.ctrl });
      else g.move(o, z);
    }
    const rest = top.filter(o => !picked.includes(o) && o.zone === 'library');
    const dest2 = p.DestinationZone2 || 'Library';
    for (const o of rest) {
      const z = ZONE[dest2] || dest2.toLowerCase();
      if (z === 'library') { const i = pl.library.indexOf(o); pl.library.splice(i, 1); if (p.LibraryPosition2 === '0') pl.library.unshift(o); else pl.library.push(o); }
      else g.move(o, z);
    }
    if (picked.length) g.log(`${ctx.ctrl.name} ${dest1 === 'Hand' ? 'puts ' + picked.length + ' card(s) into hand' : 'puts ' + picked.map(o => o.name).join(', ') + ' → ' + dest1.toLowerCase()}.`);
    remember(ctx, node, picked);
  };
  API.DigUntil = async (g, node, ctx) => {
    const p = node.p;

    const amount = n(p.Amount, ctx, node, 1);

    while (pl.library.length && found.length < amount) {
      const o = pl.library.shift(); o.zone = 'limbo';
      if (M.matchValid(valid, o, Object.assign({}, ctx, { lenient: true }))) found.push(o); else revealed.push(o);
    }
    const fd = p.FoundDestination || 'Hand';
    for (const o of found) { o.zone = 'library'; pl.library.unshift(o); await moveTo(g, o, fd, { p: { Tapped: p.Tapped }, face: node.face }, ctx); }
    const rd = p.RevealedDestination || 'Graveyard';
    for (const o of revealed) { o.zone = 'library'; if (rd === 'Library') pl.library.push(o); else { pl.library.unshift(o); g.move(o, ZONE[rd] || 'graveyard'); } }
    if (found.length) g.log(`${pl.name} reveals cards until finding ${found.map(o => o.name).join(', ')}.`);
    remember(ctx, node, found);

  API.Fight = async (g, node, ctx) => {
    const p = node.p;
    let fighters = [];
    if (p.Defined) fighters.push(...onBF(resolveDefined(p.Defined, ctx, node)));
    fighters.push(...onBF(ownTargets(node)));
    if (fighters.length < 2) { const pt = onBF(nodeTargets(node.parent || node)); for (const x of pt) if (!fighters.includes(x)) fighters.unshift(x); }
    fighters = fighters.filter((x, i, a) => a.indexOf(x) === i).slice(0, 2);
    if (fighters.length < 2) return;
    const [a, b] = fighters;
    const pa = M.power(a), pb = M.power(b);
    g.dealDamage(a, b, pa, false);
    g.dealDamage(b, a, pb, false);
    g.log(`${a.name} fights ${b.name}.`, 'dmg');

  function typeMatch(d, t) {
    if (t === 'mine') return !!d.custom;
    if (t === 'sixty') return d.mode === 'constructed';
    if (t === 'cmdr') return d.mode === 'commander';
    if (t === 'all') return true;
    if (d.custom) return false;
    if (t === 'recent') return d.date >= '2023';
    const ty = d.type;
    if (t === 'starter') return /starter|welcome|arena|game-night|sample|guild-kit|ssk/.test(ty);
    if (t === 'pw') return /^pw/.test(ty);
    if (t === 'challenger') return /challenger|pioneer|modern/.test(ty);
    if (t === 'intro') return /intro/.test(ty);
    if (t === 'theme') return /theme/.test(ty);
    if (t === 'duel') return /duel|dotp|clash/.test(ty);
    if (t === 'event') return /event|wc|pt|enhanced|advanced|enemy|starter$/.test(ty);
    return true;
  }
  function filteredDecks() {
    const q = S.q.trim().toLowerCase();
    return customDecks().concat(DATA.decks).filter(d => {
      if (S.mode !== 'horde' && d.mode !== S.mode) return false;
      if (!typeMatch(d, S.type)) return false;
      if (S.colors.size) { for (const c of S.colors) if (!d._colors.includes(c)) return false; }

        const hay = (d.name + ' ' + d.set + ' ' + d.typeName + ' ' + d.commander.join(' ') + ' ' + d.date.slice(0, 4)).toLowerCase();
        if (!hay.includes(q)) {
          if (q.length < 4) return false;
          if (!d.main.some(([, n]) => n.toLowerCase().includes(q))) return false;
        }
      }
      return true;
    }).sort((a, b) => (b.custom ? 1 : 0) - (a.custom ? 1 : 0) || (b.date || '').localeCompare(a.date || '') || a.name.localeCompare(b.name));

  function hordeSample(h, size) {

  function timeAgo(t) {
