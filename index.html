    min = Math.min(min, cards.length); max = Math.min(max, cards.length);
    const r = await g.ask(pl, Object.assign({ type: 'chooseCards', cards, min, max, prompt, purpose }, extra || {}));
    return (r || []).slice(0, max);
  }
  M.chooseCardsHelper = chooseCards;

  function shuffle(g, pl) { const a = pl.library; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(g.rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } }

  const ZONE = { Battlefield: 'battlefield', Graveyard: 'graveyard', Hand: 'hand', Library: 'library', Exile: 'exile', Command: 'command', Stack: 'stack' };

  async function moveTo(g, o, dest, node, ctx) {
    const p = node.p;
    const z = ZONE[dest] || dest.toLowerCase();
    if (z === 'library') {
      const pos = p.LibraryPosition != null ? +M.evalNum(p.LibraryPosition, ctx, node.face) : 0;
      g.move(o, 'library', pos === -1 ? { bottom: true } : { position: pos });
    } else if (z === 'battlefield') {
      const ctrl = p.GainControl ? ctx.ctrl : (p.Unearth ? ctx.ctrl : undefined);
      g.move(o, 'battlefield', { tapped: p.Tapped === 'True', controller: ctrl });
      if (p.Unearth) { o.mustExileOnLeave = true; pumpObj(g, o, 0, 0, ['Haste'], 'perm'); g.delayed.push(delayedAtEnd(g, `DB$ ChangeZone | Defined$ Self | Origin$ Battlefield | Destination$ Exile`, o)); }
      if (p.WithCountersType) g.addCounters(o, p.WithCountersType, n(p.WithCountersAmount, ctx, node, 1));
      if (p.Attacking && g.inCombat()) { o.attacking = g.opponent(ctx.ctrl); }
      if (p.AttachedTo) { const host = (resolveDefined(p.AttachedTo, ctx, node) || []).find(x => !isP(x) && x.zone === 'battlefield'); if (host) o.attachedTo = host.id; }
    } else if (z === 'hand') {
      g.move(o, 'hand');
    } else g.move(o, z);
  }

  function delayedAtEnd(g, str, src) {
    const turn = g.turn;
    return { once: true, match: ev => ev.type === 'phase' && ev.step === 'end', make: () => ({ src, ctrl: src.controller, str, face: src.face, trig: {}, desc: `${src.name} delayed trigger` }) };
  }

  // ---------------------------------------------------------------- API table
  const API = {};
  M.API = API;

  API.Draw = async (g, node, ctx) => {
    const ps = players(affected(node, ctx, 'you'));
    const num = n(node.p.NumCards, ctx, node, 1);
    for (const pl of (ps.length ? ps : [ctx.ctrl])) { g.draw(pl, num); g.log(`${pl.name} draws ${num} card${num === 1 ? '' : 's'}.`); }
  };

  API.GainLife = async (g, node, ctx) => {
    const ps = players(affected(node, ctx, 'you'));
    const amt = n(node.p.LifeAmount, ctx, node, 1);
    for (const pl of ps) { g.gainLife(pl, amt); g.log(`${pl.name} gains ${amt} life.`); }
  };
  API.LoseLife = async (g, node, ctx) => {
    const ps = players(affected(node, ctx, 'you'));
    const amt = n(node.p.LifeAmount, ctx, node, 1);
    for (const pl of ps) { g.loseLife(pl, amt); g.log(`${pl.name} loses ${amt} life.`); }
  };
  API.SetLife = async (g, node, ctx) => { for (const pl of players(affected(node, ctx, 'you'))) pl.life = n(node.p.LifeAmount, ctx, node, pl.life); };

  API.DealDamage = async (g, node, ctx) => {
    const p = node.p;
    const amt = n(p.NumDmg, ctx, node, 0);
    let src = ctx.src;
    if (p.DamageSource) { const s = resolveDefined(p.DamageSource, ctx, node); if (s && s.length && !isP(s[0])) src = s[0]; else if (s && s.length === 0) return; }
    const own = ownTargets(node);
    let tg = own.length ? own : (p.Defined ? resolveDefined(p.Defined, ctx, node) : []);
    if (node.divided && own.length) {
      own.forEach((t, i) => { const d = node.divided[i] || 0; if (d > 0) { g.dealDamage(src, t, d, false); } });
      g.log(`${src ? src.name : ''} deals ${amt} damage divided among ${own.map(t => t.name).join(', ')}.`, 'dmg');
      return;
    }
    for (const t of tg) {
      if (!isP(t) && t.zone !== 'battlefield') continue;
      const dealt = g.dealDamage(src, t, amt, false);
      g.log(`${src ? src.name : 'Source'} deals ${dealt} damage to ${t.name}.`, 'dmg');
    }
  };
  API.DamageAll = async (g, node, ctx) => {
    const p = node.p;
    const amt = n(p.NumDmg, ctx, node, 0);
    let src = ctx.src;
    if (p.DamageSource) { const s = resolveDefined(p.DamageSource, ctx, node); if (s && s.length && !isP(s[0])) src = s[0]; }
    const vc = p.ValidCards ? g.battlefield.filter(o => M.matchValid(p.ValidCards, o, ctx)) : [];
    const vp = p.ValidPlayers ? g.players.filter(pl => M.matchValid(p.ValidPlayers, pl, ctx)) : [];
    for (const o of vc) g.dealDamage(src, o, amt, false);
    for (const pl of vp) g.dealDamage(src, pl, amt, false);
    g.log(`${src ? src.name : ''} deals ${amt} damage to ${[vc.length ? `${vc.length} permanent(s)` : '', ...vp.map(x => x.name)].filter(Boolean).join(' and ') || 'nothing'}.`, 'dmg');
  };

  API.Destroy = async (g, node, ctx) => {
    const objs = onBF(affected(node, ctx, 'parent'));
    const dest = [];
    for (const o of objs) { if (g.destroy(o, node.p.NoRegen === 'True')) dest.push(o); }
    if (objs.length) g.log(`Destroy: ${objs.map(o => o.name).join(', ')}${dest.length < objs.length ? ' (some survived)' : ''}.`, 'dmg');
    remember(ctx, node, dest);
  };
  API.DestroyAll = async (g, node, ctx) => {
    const v = node.p.ValidCards || 'Card';
    const objs = g.battlefield.filter(o => M.matchValid(v, o, ctx));
    let k = 0;
    for (const o of objs) if (g.destroy(o, node.p.NoRegen === 'True')) k++;
    g.log(`${k} permanent(s) destroyed.`, 'dmg');
    remember(ctx, node, objs);
  };

  API.Pump = async (g, node, ctx) => {
    const p = node.p;
    const objs = onBF(affected(node, ctx, 'self'));
    const a = n(p.NumAtt, ctx, node, 0), d = n(p.NumDef, ctx, node, 0);
    const kws = kwList(p.KW);
    const until = p.Duration === 'Permanent' ? 'perm' : 'eot';
    for (const o of objs) pumpObj(g, o, a, d, kws, until);
    if (objs.length) g.log(`${objs.map(o => o.name).join(', ')} get${objs.length === 1 ? 's' : ''} ${a >= 0 ? '+' : ''}${a}/${d >= 0 ? '+' : ''}${d}${kws.length ? ' and ' + kws.join(', ') : ''}.`);
  };
  API.PumpAll = async (g, node, ctx) => {
    const p = node.p;
    const objs = g.battlefield.filter(o => M.matchValid(p.ValidCards || 'Creature', o, ctx));
    const a = n(p.NumAtt, ctx, node, 0), d = n(p.NumDef, ctx, node, 0);
    const kws = kwList(p.KW);
    for (const o of objs) pumpObj(g, o, a, d, kws, p.Duration === 'Permanent' ? 'perm' : 'eot');
    g.log(`${objs.length} creature(s) get ${a >= 0 ? '+' : ''}${a}/${d >= 0 ? '+' : ''}${d}${kws.length ? ' and ' + kws.join(', ') : ''}.`);
  };

  API.Animate = async (g, node, ctx) => {
    const p = node.p;
    const objs = onBF(affected(node, ctx, 'self'));
    for (const o of objs) {
      const extra = {};
      if (p.Power != null) extra.setP = n(p.Power, ctx, node, 0);
      if (p.Toughness != null) extra.setT = n(p.Toughness, ctx, node, 0);
      if (p.Types) extra.addType = p.Types.split(',').map(s => s.trim());
      if (p.Colors) extra.setColor = p.Colors.split(',').map(c => ({ White: 'W', Blue: 'U', Black: 'B', Red: 'R', Green: 'G' })[c.trim()]).filter(Boolean);
      pumpObj(g, o, 0, 0, kwList(p.Keywords), p.Duration === 'Permanent' ? 'perm' : 'eot', extra);
    }
  };

  API.Token = async (g, node, ctx) => {
    const p = node.p;
    const amt = n(p.TokenAmount, ctx, node, 1);
    const owners = p.TokenOwner ? players(resolveDefined(p.TokenOwner, ctx, node).map(x => isP(x) ? x : x.controller)) : [ctx.ctrl];
    const scripts = (p.TokenScript || '').split(',').map(s => s.trim()).filter(Boolean);
    const made = [];
    for (const pl of (owners.length ? owners : [ctx.ctrl])) {
      for (const sc of scripts) {
        const toks = g.createToken(sc, pl, amt, { tapped: p.TokenTapped === 'True', attacking: p.TokenAttacking === 'True' ? g.opponent(pl) : null });
        made.push(...toks);
      }
    }
    if (p.PumpKeywords) for (const o of made) pumpObj(g, o, 0, 0, kwList(p.PumpKeywords), p.PumpDuration === 'EOT' ? 'eot' : 'perm');
    if (p.AddsCounters || p.WithCountersType) for (const o of made) g.addCounters(o, p.WithCountersType || 'P1P1', n(p.WithCountersAmount, ctx, node, 1));
    if (made.length) g.log(`${made[0].controller.name} creates ${made.length} ${made[0].name}${made.length > 1 ? 's' : ''}.`, 'token');
    remember(ctx, node, made);
    if (p.AtEOT) for (const o of made) g.delayed.push(delayedAtEnd(g, p.AtEOT === 'Exile' ? 'DB$ ChangeZone | Defined$ Self | Origin$ Battlefield | Destination$ Exile' : 'DB$ Sacrifice | Defined$ Self', o));
  };
  API.Investigate = async (g, node, ctx) => { const k = n(node.p.Num, ctx, node, 1); g.createToken('c_a_clue_draw', ctx.ctrl, k); g.log(`${ctx.ctrl.name} investigates.`, 'token'); };
  API.Amass = async (g, node, ctx) => {
    const k = n(node.p.Num, ctx, node, 1);
    let army = g.battlefield.find(o => o.controller === ctx.ctrl && M.hasType(o, 'Army'));
    if (!army) army = g.createToken('b_0_0_zombie_army', ctx.ctrl, 1)[0];
    if (army) g.addCounters(army, 'P1P1', k);
  };

  API.PutCounter = async (g, node, ctx) => {
    const p = node.p;
    const objs = onBF(affected(node, ctx, 'self'));
    const type = p.CounterType || 'P1P1';
    const num = n(p.CounterNum, ctx, node, 1);
    for (const o of objs) g.addCounters(o, type, num);
    if (objs.length) g.log(`${num} ${counterName(type)} counter(s) on ${objs.map(o => o.name).join(', ')}.`);
  };
  API.PutCounterAll = async (g, node, ctx) => {
    const p = node.p;
    const objs = g.battlefield.filter(o => M.matchValid(p.ValidCards || 'Creature', o, ctx));
    const num = n(p.CounterNum, ctx, node, 1);
    for (const o of objs) g.addCounters(o, p.CounterType || 'P1P1', num);
  };
  API.RemoveCounter = async (g, node, ctx) => {
    const p = node.p;
    const objs = onBF(affected(node, ctx, 'self'));
    for (const o of objs) {
      const t = p.CounterType === 'Any' ? Object.keys(o.counters)[0] : (p.CounterType || 'P1P1');
      const num = p.CounterNum === 'All' ? (o.counters[t] || 0) : n(p.CounterNum, ctx, node, 1);
      if (t) o.counters[t] = Math.max(0, (o.counters[t] || 0) - num);
    }
  };
  API.Proliferate = async (g, node, ctx) => {
    for (const o of g.battlefield) {
      const mine = o.controller === ctx.ctrl;
      for (const t of Object.keys(o.counters)) if (o.counters[t] > 0 && (mine ? t !== 'M1M1' : t === 'M1M1')) o.counters[t]++;
    }
    g.opponent(ctx.ctrl).poison && g.opponent(ctx.ctrl).poison++;
    g.log(`${ctx.ctrl.name} proliferates.`);
  };
  function counterName(t) { return { P1P1: '+1/+1', M1M1: '-1/-1', LOYALTY: 'loyalty' }[t] || t.toLowerCase(); }

  API.Tap = async (g, node, ctx) => { for (const o of onBF(affected(node, ctx, 'self'))) { o.tapped = true; g.fire({ type: 'tap', card: o }); } };
  API.Untap = async (g, node, ctx) => { for (const o of onBF(affected(node, ctx, 'self'))) o.tapped = false; };
  API.TapAll = async (g, node, ctx) => { for (const o of g.battlefield.filter(o => M.matchValid(node.p.ValidCards || 'Creature', o, ctx))) o.tapped = true; };
  API.UntapAll = async (g, node, ctx) => { for (const o of g.battlefield.filter(o => M.matchValid(node.p.ValidCards || 'Permanent.YouCtrl', o, ctx))) o.tapped = false; };
  API.TapOrUntap = async (g, node, ctx) => { for (const o of onBF(affected(node, ctx, 'self'))) o.tapped = o.controller !== ctx.ctrl; };

  API.Regenerate = async (g, node, ctx) => { for (const o of onBF(affected(node, ctx, 'self'))) { o.regen++; } };

  API.ChangeZone = async (g, node, ctx) => {
    const p = node.p;
    const origin = (p.Origin || '').split(',').map(s => s.trim());
    const dest = p.Destination || 'Hand';
    const hidden = p.Hidden === 'True' || (p.ChangeType && origin.some(z => z === 'Library' || z === 'Hand') && !ownTargets(node).length && !p.Defined);
    if (hidden) {
      // search
      const who = p.DefinedPlayer ? players(resolveDefined(p.DefinedPlayer, ctx, node)) : [ctx.ctrl];
      const chooser = p.Chooser ? (players(resolveDefined(p.Chooser, ctx, node))[0] || ctx.ctrl) : ctx.ctrl;
      for (const pl of who) {
        let pool = [];
        for (const z of origin) pool.push(...(pl[ZONE[z] || z.toLowerCase()] || []));
        const valid = p.ChangeType || 'Card';
        pool = pool.filter(o => M.matchValid(valid, o, ctx));
        const num = p.ChangeNum === 'All' ? pool.length : n(p.ChangeNum, ctx, node, 1);
        const min = p.Mandatory === 'True' ? Math.min(num, pool.length) : 0;
        const picked = await chooseCards(g, chooser, pool, min, num, `Search: choose up to ${num} ${p.ChangeTypeDesc || valid}`, 'search', { dest, card: ctx.src });
        for (const o of picked) await moveTo(g, o, dest, node, ctx);
        if (picked.length) g.log(`${chooser.name} search${chooser.id === 0 && !chooser.isAI ? "" : "es"}: ${picked.map(o => (dest === 'Hand' && chooser.isAI && pl === chooser) ? 'a card' : o.name).join(', ')} → ${dest.toLowerCase()}.`);
        remember(ctx, node, picked);
        if (origin.includes('Library') && p.Shuffle !== 'False') shuffle(g, pl);
      }
      return;
    }
    const objs = cards(affected(node, ctx, p.Defined ? null : 'parent')).filter(o => !o.isStackItem);
    const moved = [];
    for (const o of objs) {
      const fromZoneOk = !p.Origin || origin.some(z => (ZONE[z] || z.toLowerCase()) === o.zone) || p.Origin === 'Any';
      if (!fromZoneOk) continue;
      if (dest === 'Battlefield' && p.Origin === 'Battlefield' && p.Destination === 'Battlefield') continue;
      await moveTo(g, o, dest, node, ctx);
      moved.push(o);
    }
    if (moved.length) g.log(`${moved.map(o => o.name).join(', ')} → ${dest.toLowerCase()}.`);
    remember(ctx, node, moved);
  };

  API.ChangeZoneAll = async (g, node, ctx) => {
    const p = node.p;
    const origin = (p.Origin || 'Battlefield').split(',').map(s => ZONE[s.trim()] || s.trim().toLowerCase());
    const valid = p.ChangeType || 'Card';
    let pool = [];
    for (const z of origin) pool.push(...(z === 'battlefield' ? g.battlefield : g.allIn(z)));
    if (p.Defined) { const who = players(resolveDefined(p.Defined, ctx, node)); pool = pool.filter(o => who.includes(o.owner) || who.includes(o.controller)); }
    pool = pool.filter(o => M.matchValid(valid, o, ctx));
    for (const o of pool.slice()) await moveTo(g, o, p.Destination || 'Graveyard', node, ctx);
    if (pool.length) g.log(`${pool.length} card(s) → ${(p.Destination || 'graveyard').toLowerCase()}.`);
    remember(ctx, node, pool);
    if (origin.includes('library') && p.Shuffle !== 'False') for (const pl of g.players) shuffle(g, pl);
  };

  API.Counter = async (g, node, ctx) => {
    const items = (node.targets || []).map(M.refThing).filter(x => x && x.isStackItem);
    const defined = node.p.Defined ? resolveDefined(node.p.Defined, ctx, node).filter(x => x && x.isStackItem) : [];
    for (const it of items.concat(defined)) {
      const i = g.stack.indexOf(it);
      if (i < 0) continue;
      g.stack.splice(i, 1);
      g.log(`${it.kind === 'spell' ? it.face.name : (it.obj ? it.obj.name + "'s ability" : 'Ability')} is countered.`, 'fizzle');
      if (it.kind === 'spell') {
        it.obj.zone = 'limbo';
        const d = node.p.Destination === 'Exile' ? 'exile' : node.p.Destination === 'Hand' ? 'hand' : node.p.Destination === 'Library' ? 'library' : (it.flashback ? 'exile' : 'graveyard');
        g.move(it.obj, d, d === 'library' && node.p.LibraryPosition === '-1' ? { bottom: true } : {});
        remember(ctx, node, [it.obj]);
      }
    }
  };

  API.Discard = async (g, node, ctx) => {
    const p = node.p;
    const ps = players(affected(node, ctx, 'you'));
    const mode = p.Mode || 'TgtChoose';
    const num = p.NumCards === 'X' ? n('X', ctx, node, 0) : n(p.NumCards, ctx, node, 1);
    for (const pl of ps) {
      let chosen = [];
      if (mode === 'Hand') chosen = pl.hand.slice();
      else if (mode === 'Random') { const h = pl.hand.slice(); for (let i = 0; i < num && h.length; i++) chosen.push(h.splice(Math.floor(g.rng() * h.length), 1)[0]); }
      else if (mode === 'RevealYouChoose' || mode === 'RevealDiscardAll' || mode === 'LookYouChoose') {
        const v = p.DiscardValid || 'Card';
        const pool = pl.hand.filter(o => M.matchValid(v, o, ctx));
        chosen = await chooseCards(g, ctx.ctrl, pool, Math.min(num, pool.length), num, `Choose card(s) for ${pl.name} to discard`, 'oppDiscard', { reveal: pl.hand.slice() });
      } else {
        const v = p.DiscardValid || 'Card';
        const pool = pl.hand.filter(o => M.matchValid(v, o, ctx));
        chosen = await chooseCards(g, pl, pool, Math.min(num, pool.length), num, `Discard ${num} card(s)`, 'discard');
      }
      for (const o of chosen) g.discard(pl, o);
      if (chosen.length) g.log(`${pl.name} discards ${chosen.map(o => o.name).join(', ')}.`);
      remember(ctx, node, chosen);
      ctx.discarded = (ctx.discarded || []).concat(chosen);
    }
  };

  API.Mill = async (g, node, ctx) => {
    const ps = players(affected(node, ctx, 'you'));
    const num = n(node.p.NumCards, ctx, node, 1);
    for (const pl of ps) {
      const milled = pl.library.slice(0, num);
      for (const o of milled) g.move(o, node.p.Destination === 'Exile' ? 'exile' : 'graveyard');
      g.log(`${pl.name} mills ${milled.length}.`);
      remember(ctx, node, milled);
    }
  };

  API.Sacrifice = async (g, node, ctx) => {
    const p = node.p;
    if (!p.SacValid || p.SacValid === 'Self' || p.SacValid === 'Card.Self' || (p.Defined && /^(Self|Remembered|Targeted|Enchanted|Equipped)/.test(p.Defined) && !p.SacValid)) {
      const objs = p.Defined ? onBF(resolveDefined(p.Defined, ctx, node)) : (ctx.src && ctx.src.zone === 'battlefield' ? [ctx.src] : []);
      for (const o of objs) { g.sacrifice(o); g.log(`${o.controller.name} sacrifices ${o.name}.`); }
      ctx.sacrificed = (ctx.sacrificed || []).concat(objs);
      remember(ctx, node, objs);
      return;
    }
    const ps = players(affected(node, ctx, 'you'));
    const amt = n(p.Amount, ctx, node, 1);
    for (const pl of (ps.length ? ps : [ctx.ctrl])) {
      const pool = g.battlefield.filter(o => o.controller === pl && M.matchValid(p.SacValid, o, Object.assign({}, ctx, { ctrl: pl === ctx.ctrl ? ctx.ctrl : ctx.ctrl })));
      const chosen = await chooseCards(g, pl, pool, Math.min(amt, pool.length), amt, `Sacrifice ${amt} (${p.SacValid})`, 'sacrifice');
      for (const o of chosen) { g.sacrifice(o); g.log(`${pl.name} sacrifices ${o.name}.`); }
      ctx.sacrificed = (ctx.sacrificed || []).concat(chosen);
      remember(ctx, node, chosen);
    }
  };
  API.SacrificeAll = async (g, node, ctx) => {
    const objs = g.battlefield.filter(o => M.matchValid(node.p.ValidCards || 'Creature', o, ctx));
    for (const o of objs) g.sacrifice(o);
    remember(ctx, node, objs);
  };

  API.Scry = async (g, node, ctx) => {
    const ps = players(affected(node, ctx, 'you'));
    const num = n(node.p.ScryNum, ctx, node, 1);
    for (const pl of ps) {
      const top = pl.library.slice(0, num);
      if (!top.length) continue;
      const res = await g.ask(pl, { type: 'scry', cards: top, prompt: `Scry ${num}: choose cards to put on the bottom` });
      const bottom = (res && res.bottom) || [];
      const keep = (res && res.top) || top.filter(o => !bottom.includes(o));
      pl.library.splice(0, top.length);
      pl.library.unshift(...keep);
      pl.library.push(...bottom);
      g.log(`${pl.name} scries ${num}${bottom.length ? ` (${bottom.length} to bottom)` : ''}.`);
    }
  };
  API.Surveil = async (g, node, ctx) => {
    const pl = ctx.ctrl;
    const num = n(node.p.Amount, ctx, node, 1);
    const top = pl.library.slice(0, num);
    if (!top.length) return;
    const res = await g.ask(pl, { type: 'scry', cards: top, surveil: true, prompt: `Surveil ${num}: choose cards to put into your graveyard` });
    const gy = (res && res.bottom) || [];
    for (const o of gy) g.move(o, 'graveyard');
    g.log(`${pl.name} surveils ${num}${gy.length ? ` (${gy.length} to graveyard)` : ''}.`);
  };

  API.Dig = async (g, node, ctx) => {
    const p = node.p;
    const pl = players(affected(node, ctx, 'you'))[0] || ctx.ctrl;
    const num = n(p.DigNum, ctx, node, 1);
    const top = pl.library.slice(0, num);
    if (!top.length) return;
    const valid = p.ChangeValid || 'Card';
    const elig = top.filter(o => M.matchValid(valid, o, ctx));
    const changeNum = p.ChangeNum === 'All' ? elig.length : n(p.ChangeNum, ctx, node, 1);
    const dest1 = p.DestinationZone || 'Hand';
    const optional = p.AnyNumber === 'True' || p.Optional === 'True' || p.ChangeValid != null;

      for (const m of text.matchAll(/\{([^}]+)\}/g)) for (const ch of m[1].split('/')) if ('WUBRG'.includes(ch) && ch.length === 1) ci.add(ch);
    }
    let cmc = M.manaValue(M.parseMana(f0.c));
    if (def.alt === 'Split') cmc = def.faces.reduce((a, f) => a + M.manaValue(M.parseMana(f.c)), 0);
    const words = t.split(/\s+/);
    const isLand = words.includes('Land');
    const kws = f0.K || [];
    let partner = null;
    for (const k of kws) {
      if (k === 'Partner') partner = { kind: 'any' };
      else if (k.startsWith('Partner with:')) partner = { kind: 'with', name: k.split(':')[1] };
      else if (k.startsWith('Partner:')) partner = { kind: 'group', name: k.split(':')[1] };
      else if (k === 'Choose a Background') partner = { kind: 'chooseBg' };
      else if (k === "Doctor's companion") partner = { kind: 'companionOfDoctor' };
    }
    let limit = null;
    for (const k of kws) {
      if (/^A deck can have any number of cards named/.test(k)) limit = Infinity;
      const m = /^DeckLimit:(\d+)/.exec(k); if (m) limit = +m[1];
    }
    if (words.includes('Basic') && isLand) limit = Infinity;
    const legendary = words.includes('Legendary');
    const creature = words.includes('Creature');
    const background = legendary && /\bBackground\b/.test(t);
    const doctor = creature && /\bDoctor\b/.test(t) && /\bTime Lord\b/.test(t);
    const canCommand = (legendary && creature) || /can be your commander/i.test(f0.o || '');
    const name = def.alt === 'Split' ? def.faces.map(f => f.n).join(' // ') : f0.n;
    const L = def.L || '';
    let group = 'Other';
    if (creature) group = 'Creatures';
    else if (words.includes('Planeswalker')) group = 'Planeswalkers';
    else if (words.includes('Instant') || words.includes('Sorcery')) group = 'Instants & sorceries';
    else if (isLand) group = 'Lands';
    else if (words.includes('Artifact') || words.includes('Enchantment') || words.includes('Battle')) group = 'Artifacts & enchantments';
    return {
      key, name, def, type: t, cost: f0.c, cmc, colors, ci, isLand, legendary, creature, canCommand, background, doctor, partner, limit,
      std: L.includes('s'), cmdBanned: L.includes('b'), group,
      nameN: norm(name), textN: norm(def.faces.map(f => (f.o || '')).join(' ')), typeN: norm(def.faces.map(f => f.t || '').join(' ')),
    };
  }

  const IDX = { byNorm: new Map(), info: new Map(), list: [], cards: null };
  D.index = IDX;
  D.indexCards = function (cards) {
    IDX.cards = cards;
    IDX.byNorm = new Map(); IDX.info = new Map(); IDX.list = [];
    const byName = new Map();
    for (const key of Object.keys(cards)) {
      const def = cards[key];
      const canon = def.alt === 'Split' ? def.faces.map(f => f.n).join(' // ') : def.faces[0].n;
      let inf = byName.get(canon);
      if (!inf) {
        inf = infoOf(key, def);
        byName.set(canon, inf);
        IDX.list.push(inf);
      }
      IDX.info.set(key, inf);
      const names = [key, inf.name, def.faces[0].n];
      if (def.faces.length > 1) { names.push(def.faces.map(f => f.n).join(' // '), def.faces.map(f => f.n).join(' / '), def.faces.map(f => f.n).join('/')); }
      for (const n of names) { const k = norm(n); if (!IDX.byNorm.has(k)) IDX.byNorm.set(k, key); }
    }
  };
  D.info = key => IDX.info.get(key) || null;
  D.resolve = function (raw) {
    let n = norm(raw);
    if (!n) return null;
    const tries = [n, n.replace(/^a-/, ''), n.split(' // ')[0], n.split(' / ')[0], n.split('/')[0].trim(), n.replace(/\s*\(.*$/, ''), n.replace(/ - .*$/, '')];
    for (const t of tries) { const k = IDX.byNorm.get(t); if (k) return k; }
    return null;
  };

  // ---------------------------------------------------------------- import
  const SECTION = [
    [/^(commanders?|command zone|commander\(s\))$/i, 'commander'],
    [/^(deck|main ?deck|main ?board|main|library|cards|creatures?|lands?|spells?|instants?|sorcer(y|ies)|artifacts?|enchantments?|planeswalkers?|battles?|other)$/i, 'main'],
    [/^(sideboard|side ?board|sb)$/i, 'side'],
    [/^(maybe ?board|maybe|considering|wishlist|tokens?|attractions?|stickers?)$/i, 'skip'],
    [/^companions?$/i, 'companion'],
  ];
  function sectionOf(line) {
    let l = line.trim().replace(/^(\/\/|#+)\s*/, '').replace(/[:\s]+$/, '').replace(/\s*\(\d+\)$/, '');
    for (const [re, s] of SECTION) if (re.test(l)) return s;
    return null;
  }

  D.parseText = function (text) {
    text = String(text || '').replace(/\r\n?/g, '\n');
    if (/<\s*Deck[\s>]/i.test(text) && /<\s*Cards\b/i.test(text)) return D.parseDek(text);
    const res = { name: '', commander: [], main: [], side: [], unknown: [], notes: [], companion: [] };
    const add = (bucket, n, key) => {
      const arr = res[bucket];
      const ex = arr.find(x => x[1] === key);
      if (ex) ex[0] += n; else arr.push([n, key]);
    };
    let sec = 'main';
    let sawBlankAfterFirst = false, firstBlock = [], blockIndex = 0, linesInBlock = 0;
    const lines = text.split('\n');
    // CSV export (Moxfield/Archidekt/Deckbox): header with Count/Quantity and Name
    const head = (lines[0] || '').toLowerCase();
    if (/(^|,)"?(count|quantity|qty)"?(,|$)/.test(head) && /(^|,)"?(name|card name)"?(,|$)/.test(head)) return parseCSV(lines, res);
    let aboutMode = false;
    for (let raw of lines) {
      let line = raw.trim();
      if (!line) { if (linesInBlock) { blockIndex++; linesInBlock = 0; } aboutMode = false; continue; }
      if (/^about$/i.test(line)) { aboutMode = true; continue; }
      if (aboutMode) { const m = /^name\s+(.+)$/i.exec(line); if (m) res.name = m[1].trim(); continue; }
      const nm = /^(?:\/\/\s*)?(?:name|deck name|title)\s*[:=]\s*(.+)$/i.exec(line);
      if (nm && !/^\d/.test(line)) { res.name = nm[1].trim(); continue; }
      const s = sectionOf(line);
      if (s && !/^\d/.test(line)) { sec = s; continue; }
      if (/^(\/\/|#)/.test(line)) continue;
      let bucket = sec;
      if (/^SB:\s*/i.test(line)) { bucket = 'side'; line = line.replace(/^SB:\s*/i, ''); }
      const m = /^(\d+)\s*[xX]?\s+(.+)$/.exec(line) || /^()(\D.*)$/.exec(line);
      if (!m) continue;
      let n = m[1] ? parseInt(m[1], 10) : 1;
      let name = m[2];
      let isCmd = false;
      if (/\*CMDR\*|\[\s*commander\b[^\]]*\]|\(\s*commander\s*\)|#\s*commander\b/i.test(name)) isCmd = true;
      name = name
        .replace(/\s*\[[^\]]*\]/g, '')                          // [Commander{top}] tags
        .replace(/\s*\*[A-Z]+\*/g, '')                          // *F* *CMDR*
        .replace(/\s+\^[^^]*\^/g, '')                          // ^tag^ (Archidekt colours)
        .replace(/\s+#.*$/, '')                                 // #tags
        .replace(/\s+\(([A-Za-z0-9_]{2,8})\)(\s+[A-Za-z0-9★†\-]+)?\s*$/, '') // (SET) 123
        .replace(/\s+<[^>]*>\s*$/, '')
        .trim();
      if (!name) continue;
      const key = D.resolve(name);
      if (!key) { res.unknown.push({ n, name, line: raw.trim() }); continue; }
      if (bucket === 'skip') continue;
      if (isCmd) bucket = 'commander';
      if (bucket === 'companion') { res.companion.push(key); continue; }
      add(bucket === 'commander' ? 'commander' : bucket, n, key);
      linesInBlock++;
    }
    res.commander = res.commander.map(x => x[1]);
    finishImport(res);
    return res;
  };

  function parseCSV(lines, res) {
    const split = l => { const out = []; let cur = '', q = false; for (let i = 0; i < l.length; i++) { const c = l[i]; if (q) { if (c === '"' && l[i + 1] === '"') { cur += '"'; i++; } else if (c === '"') q = false; else cur += c; } else if (c === '"') q = true; else if (c === ',') { out.push(cur); cur = ''; } else cur += c; } out.push(cur); return out; };
    const head = split(lines[0]).map(h => h.trim().toLowerCase());
    const ci = head.findIndex(h => ['count', 'quantity', 'qty'].includes(h));
    const ni = head.findIndex(h => ['name', 'card name'].includes(h));
    const bi = head.findIndex(h => ['board', 'section', 'category', 'categories'].includes(h));
    const add = (bucket, n, key) => { const arr = res[bucket]; const ex = arr.find(x => x[1] === key); if (ex) ex[0] += n; else arr.push([n, key]); };
    for (const l of lines.slice(1)) {
      if (!l.trim()) continue;
      const cols = split(l);
      const n = parseInt(cols[ci], 10) || 1, name = (cols[ni] || '').trim();
      if (!name) continue;
      const board = bi >= 0 ? (cols[bi] || '').toLowerCase() : '';
      const key = D.resolve(name);
      if (!key) { res.unknown.push({ n, name, line: l }); continue; }
      if (/commander/.test(board)) res.commander.push([1, key]);
      else if (/side/.test(board)) add('side', n, key);
      else if (/maybe|token/.test(board)) continue;
      else add('main', n, key);
    }
    res.commander = res.commander.map(x => x[1]);
    finishImport(res);
    return res;
  }

  D.parseDek = function (xml) {
    const res = { name: '', commander: [], main: [], side: [], unknown: [], notes: [], companion: [] };
    const add = (bucket, n, key) => { const arr = res[bucket]; const ex = arr.find(x => x[1] === key); if (ex) ex[0] += n; else arr.push([n, key]); };
    const attr = (s, a) => { const m = new RegExp(a + '\\s*=\\s*"([^"]*)"', 'i').exec(s); return m ? m[1] : ''; };
    for (const m of xml.matchAll(/<\s*Cards\b([^>]*)\/?>/gi)) {
      const a = m[1];
      const name = attr(a, 'Name').replace(/&amp;/g, '&').replace(/&apos;|&#39;/g, "'").replace(/&quot;/g, '"');
      const n = parseInt(attr(a, 'Quantity'), 10) || 1;
      const side = /true/i.test(attr(a, 'Sideboard'));
      const cmd = /commander/i.test(attr(a, 'Annotation')) || attr(a, 'Annotation') === '1';
      const key = D.resolve(name);
      if (!key) { res.unknown.push({ n, name, line: name }); continue; }
      if (cmd) res.commander.push([1, key]); else add(side ? 'side' : 'main', n, key);
    }
    res.commander = res.commander.map(x => x[1]);
    finishImport(res);
    return res;
  };

  function finishImport(res) {
    // Commanders listed in the main deck too: take them out
    for (const c of res.commander) {
      const i = res.main.findIndex(x => x[1] === c);
      if (i >= 0) { res.main[i][0]--; if (res.main[i][0] <= 0) res.main.splice(i, 1); }
    }
    const total = res.main.reduce((a, x) => a + x[0], 0) + res.commander.length;
    const singleton = res.main.every(([n, k]) => n === 1 || (D.info(k) && D.info(k).limit === Infinity));
    let mode = res.commander.length ? 'commander' : (total >= 95 && singleton ? 'commander' : 'constructed');
    if (mode === 'commander' && !res.commander.length) {
      // Commander not marked: a lone legendary in the sideboard, or the first card if it can lead
      const sideCmd = res.side.filter(([, k]) => D.info(k) && D.info(k).canCommand);
      if (sideCmd.length >= 1 && sideCmd.length <= 2 && res.side.length <= 2) {
        res.commander = sideCmd.map(x => x[1]); res.side = res.side.filter(x => !res.commander.includes(x[1]));
        res.notes.push(`Used ${res.commander.join(' + ')} from the sideboard as the commander.`);
      } else {
        const first = res.main[0];
        if (first && first[0] === 1 && D.info(first[1]) && D.info(first[1]).canCommand) {
          res.commander = [first[1]]; res.main.shift();
          res.notes.push(`No commander was marked, so ${first[1]} (the first card) was made the commander. Change it in the builder if that's wrong.`);
        } else res.notes.push('No commander was marked. Pick one in the builder.');
      }
    }
    if (mode === 'commander' && res.side.length) { res.notes.push(`${res.side.reduce((a, x) => a + x[0], 0)} sideboard card(s) were left out.`); }
    else if (res.side.length) res.notes.push(`${res.side.reduce((a, x) => a + x[0], 0)} sideboard card(s) were kept aside; sideboards aren't used in games.`);
    if (res.companion.length) res.notes.push(`Companion ${res.companion.join(', ')} isn't used in games and was left out.`);
    res.mode = mode;
  }

  // ---------------------------------------------------------------- deck helpers
  D.count = deck => deck.main.reduce((a, x) => a + x[0], 0) + (deck.mode === 'commander' ? deck.commander.length : 0);
  D.qty = (deck, key) => { const r = deck.main.find(x => x[1] === key); return r ? r[0] : 0; };
  D.setQty = function (deck, key, n) {
    const i = deck.main.findIndex(x => x[1] === key);
    if (n <= 0) { if (i >= 0) deck.main.splice(i, 1); return; }
    if (i >= 0) deck.main[i][0] = n; else deck.main.push([n, key]);
  };
  D.identity = function (deck) {
    const s = new Set();
    for (const c of deck.commander) { const i = D.info(c); if (i) for (const x of i.ci) s.add(x); }
    return s;
  };
  D.colorsOf = function (deck) {
    if (deck.mode === 'commander' && deck.commander.length) return ['W', 'U', 'B', 'R', 'G'].filter(c => D.identity(deck).has(c));
    const cnt = { W: 0, U: 0, B: 0, R: 0, G: 0 };
    let tot = 0;
    for (const [n, k] of deck.main) { const i = D.info(k); if (!i || i.isLand) continue; for (const c of i.colors) { cnt[c] += n; tot += n; } }
    return Object.keys(cnt).filter(c => cnt[c] / (tot || 1) > 0.12);
  };

  function pairOK(a, b) {
    const A = D.info(a), B = D.info(b);
    if (!A || !B) return false;
    const pa = A.partner, pb = B.partner;
    if (pa && pb && pa.kind === 'any' && pb.kind === 'any') return true;
    if (pa && pa.kind === 'with' && norm(pa.name) === B.nameN) return true;
    if (pb && pb.kind === 'with' && norm(pb.name) === A.nameN) return true;
    if (pa && pb && pa.kind === 'group' && pb.kind === 'group' && pa.name === pb.name) return true;
    if ((pa && pa.kind === 'chooseBg' && B.background) || (pb && pb.kind === 'chooseBg' && A.background)) return true;
    if ((pa && pa.kind === 'companionOfDoctor' && B.doctor) || (pb && pb.kind === 'companionOfDoctor' && A.doctor)) return true;
    return false;
  }
  D.canAddSecondCommander = (deck, key) => deck.commander.length === 1 && pairOK(deck.commander[0], key);

  // issues: {level: 'error'|'warn', text, cards?}
  D.validate = function (deck) {
    const issues = [];
    const cmd = deck.mode === 'commander';
    const total = D.count(deck);
    const list = (arr) => arr.slice(0, 6).join(', ') + (arr.length > 6 ? ` and ${arr.length - 6} more` : '');
    const missing = deck.main.filter(([, k]) => !D.info(k)).map(x => x[1]).concat(deck.commander.filter(k => !D.info(k)));
    if (missing.length) issues.push({ level: 'error', text: `Unknown cards: ${list(missing)}.` });
    if (cmd) {
      if (!deck.commander.length) issues.push({ level: 'error', text: 'Choose a commander.' });
      for (const c of deck.commander) { const i = D.info(c); if (i && !i.canCommand && !(i.background && deck.commander.length === 2)) issues.push({ level: 'error', text: `${c} can't be a commander (it isn't a legendary creature).` }); }
      if (deck.commander.length > 2) issues.push({ level: 'error', text: 'A deck can have at most two commanders.' });
      if (deck.commander.length === 2 && !pairOK(deck.commander[0], deck.commander[1])) issues.push({ level: 'error', text: `${deck.commander[0]} and ${deck.commander[1]} can't be paired as commanders (they need Partner, Choose a Background, or similar).` });
      if (total !== 100) issues.push({ level: total < 100 ? 'error' : 'error', text: `Commander decks have exactly 100 cards including the commander (this one has ${total}).` });
      const dup = deck.main.filter(([n, k]) => n > 1 && !(D.info(k) && D.info(k).limit && n <= D.info(k).limit)).map(x => x[1]);
      const dupCmd = deck.main.filter(([, k]) => deck.commander.includes(k)).map(x => x[1]);
      if (dup.length) issues.push({ level: 'error', text: `Only one copy of each card is allowed (except basic lands): ${list(dup)}.` });
      if (dupCmd.length) issues.push({ level: 'error', text: `Your commander is also in the deck: ${list(dupCmd)}.` });
      if (deck.commander.length) {
        const id = D.identity(deck);
        const out = deck.main.filter(([, k]) => { const i = D.info(k); return i && [...i.ci].some(c => !id.has(c)); }).map(x => x[1]);
        if (out.length) issues.push({ level: 'error', text: `Outside your commander's colors: ${list(out)}.` });
      }
      const banned = deck.main.map(x => x[1]).concat(deck.commander).filter(k => D.info(k) && D.info(k).cmdBanned);
      if (banned.length) issues.push({ level: 'error', text: `Banned in Commander: ${list(banned)}.` });
    } else {
      if (total < 60) issues.push({ level: 'error', text: `Standard decks need at least 60 cards (this one has ${total}).` });
      const over = deck.main.filter(([n, k]) => { const i = D.info(k); const lim = i && i.limit != null ? i.limit : 4; return n > lim; }).map(x => x[1]);
      if (over.length) issues.push({ level: 'error', text: `More than 4 copies: ${list(over)}.` });
      const notStd = deck.main.filter(([, k]) => D.info(k) && !D.info(k).std).map(x => x[1]);
      if (notStd.length) issues.push({ level: 'warn', text: `Not legal in current Standard: ${list(notStd)}.` });
    }
    return issues;
  };
  // the game can still run casual games with a near-legal deck
  D.playable = function (deck) {
    if (deck.main.some(([, k]) => !D.info(k))) return { ok: false, why: 'Remove the unknown cards first.' };
    if (deck.mode === 'commander') {
      if (!deck.commander.length) return { ok: false, why: 'Choose a commander first.' };
      if (D.count(deck) < 60) return { ok: false, why: 'Add at least 60 cards to play.' };
      return { ok: true };
    }
    if (D.count(deck) < 40) return { ok: false, why: 'Add at least 40 cards to play.' };
    return { ok: true };
  };

  D.exportText = function (deck) {
    const lines = [];
    if (deck.mode === 'commander' && deck.commander.length) { lines.push('Commander'); for (const c of deck.commander) lines.push(`1 ${D.info(c) ? D.info(c).name : c}`); lines.push(''); }
    lines.push('Deck');
    const order = ['Creatures', 'Planeswalkers', 'Instants & sorceries', 'Artifacts & enchantments', 'Other', 'Lands'];
    const rows = deck.main.slice().sort((a, b) => {
      const A = D.info(a[1]), B = D.info(b[1]);
      return (order.indexOf(A ? A.group : 'Other') - order.indexOf(B ? B.group : 'Other')) || ((A ? A.cmc : 0) - (B ? B.cmc : 0)) || a[1].localeCompare(b[1]);
    });
    for (const [n, k] of rows) lines.push(`${n} ${D.info(k) ? D.info(k).name : k}`);
    if (deck.side && deck.side.length && deck.mode !== 'commander') { lines.push('', 'Sideboard'); for (const [n, k] of deck.side) lines.push(`${n} ${D.info(k) ? D.info(k).name : k}`); }
    return lines.join('\n');
  };

  // Fill up to the target size with basics split by colored pips in the deck
  const BASIC = { W: 'Plains', U: 'Island', B: 'Swamp', R: 'Mountain', G: 'Forest' };
  D.fillLands = function (deck) {
    const target = deck.mode === 'commander' ? 100 : 60;
    let need = target - D.count(deck);
    if (need <= 0) return 0;
    const pips = { W: 0, U: 0, B: 0, R: 0, G: 0 };
    for (const [n, k] of deck.main) { const i = D.info(k); if (!i || i.isLand) continue; for (const tok of (i.cost || '').split(/\s+/)) for (const ch of tok.split('/')) if (pips[ch] != null) pips[ch] += n; }
    let cols = Object.keys(pips).filter(c => pips[c] > 0);
    if (deck.mode === 'commander' && deck.commander.length) { const id = D.identity(deck); cols = cols.filter(c => id.has(c)); if (!cols.length) cols = [...id]; }
    if (!cols.length) { D.setQty(deck, 'Wastes', D.qty(deck, 'Wastes') + need); return need; }
    const tot = cols.reduce((a, c) => a + pips[c], 0) || cols.length;
    const alloc = cols.map(c => [c, Math.floor(need * (pips[c] || 1) / tot)]);
    let rem = need - alloc.reduce((a, x) => a + x[1], 0);
    alloc.sort((a, b) => (pips[b[0]] || 0) - (pips[a[0]] || 0));
    for (let i = 0; rem > 0; i = (i + 1) % alloc.length, rem--) alloc[i][1]++;
    for (const [c, n] of alloc) if (n > 0 && IDX.info.has(BASIC[c])) D.setQty(deck, BASIC[c], D.qty(deck, BASIC[c]) + n);
    return need;
  };

  D.newId = () => 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  D.blank = mode => ({ id: D.newId(), name: mode === 'commander' ? 'New Commander deck' : 'New deck', mode, commander: [], main: [], side: [], created: Date.now(), updated: Date.now() });
  D.clone = d => JSON.parse(JSON.stringify({ id: d.id, name: d.name, mode: d.mode, commander: d.commander || [], main: d.main || [], side: d.side || [], colors: d.colors || [], created: d.created || Date.now(), updated: d.updated || Date.now() }));

  // ---------------------------------------------------------------- storage
  // Account storage (claude.ai `db`, private per person) when available; this browser otherwise.
  const LKEY = 'mtg.decks.v1';
  const Store = { mode: 'local', decks: new Map(), listeners: [], ready: false, writing: new Map(), cloud: null };
  D.store = Store;
  function readLocal() { try { return JSON.parse(localStorage.getItem(LKEY) || '{}') || {}; } catch (e) { return {}; } }
  function writeLocal(obj) { try { localStorage.setItem(LKEY, JSON.stringify(obj)); return true; } catch (e) { return false; } }
  function emit() { for (const fn of Store.listeners) { try { fn(); } catch (e) { console.error(e); } } }
  Store.onChange = fn => Store.listeners.push(fn);
  Store.list = () => [...Store.decks.values()].sort((a, b) => (b.updated || 0) - (a.updated || 0));
  Store.get = id => Store.decks.get(id) || null;

  Store.init = async function () {
    const local = readLocal();
    for (const d of Object.values(local)) if (d && d.id) Store.decks.set(d.id, Object.assign(D.clone(d), { _where: 'local' }));
    Store.ready = true;
    emit();

  function artLinksHTML(name) {
